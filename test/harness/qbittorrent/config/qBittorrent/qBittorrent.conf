[LegalNotice]
Accepted=true

[BitTorrent]
Session\DefaultSavePath=/downloads
Session\TempPathEnabled=false
Session\Port=6881
# The harness completes from a web seed, so peer discovery is only latency to no
# purpose. Turning it off keeps a run deterministic and fast.
Session\DHTEnabled=false
Session\PeXEnabled=false
Session\LSDEnabled=false

[Preferences]
General\Locale=en
Downloads\SavePath=/downloads
Downloads\TempPathEnabled=false
WebUI\Enabled=true
WebUI\Port=8080
WebUI\Address=*
# No credential dance for a disposable, host-local instance: the WebUI is
# published only to 127.0.0.1 and the whole point is that this daemon is nobody's
# but the harness's. Auth is bypassed for any client on the (private) network,
# so the Go client authenticates with empty credentials and qBittorrent answers
# "Ok.".
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0, ::/0
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\ClickjackingProtection=false
