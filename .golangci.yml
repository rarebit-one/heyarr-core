version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused

  settings:
    govet:
      disable:
        # Reports that a third-party constructor "should be inlined". It is a
        # performance hint about code we do not own, not a correctness finding.
        - inline

    misspell:
      # "Devialet" is a loudspeaker manufacturer, and misspell reads it as a
      # misspelling of "deviate". The word appears wherever a real renderer is
      # named — fixture names, test cases, package documentation.
      ignore-rules:
        - Devialet
        - devialet

    errcheck:
      # Writes to an already-open stdout/stderr: there is no useful recovery, and
      # checking each one buries the usage text in error handling. Every other
      # unchecked error is a finding.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    depguard:
      rules:
        # Spec §18: "The content-management domain must not depend on physical
        # path layout, chunking algorithm, local vs remote storage, or
        # replication transport." This rule is that sentence, enforced.
        # See docs/adr/0006 and docs/adr/0007.
        domain-is-storage-agnostic:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: path/filepath
              desc: "the domain layer must not know about filesystem paths — paths are ingest inputs, not identity (spec §61, ADR-0006)"
            - pkg: os
              desc: "the domain layer must not touch the filesystem — go through a Storage Fabric interface (spec §18, ADR-0007)"
            - pkg: database/sql
              desc: "the domain layer must not know how it is persisted — go through a repository interface"
            - pkg: github.com/rarebit-one/heyarr-core/internal/persistence
              desc: "the domain layer must not import persistence (spec §18, ADR-0007)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/storagefabric/cas
              desc: "the domain layer must not import the CAS implementation — depend on an interface it defines (spec §18, ADR-0007)"

        # The Storage Fabric is a self-contained subsystem that may one day be
        # extracted as its own module (spec §18). It must not reach back up.
        fabric-does-not-depend-on-domain:
          files:
            - "**/internal/storagefabric/**"
          deny:
            - pkg: github.com/rarebit-one/heyarr-core/internal/domain
              desc: "the Storage Fabric must stay extractable — it may not depend on Heyarr's content domain (spec §18, ADR-0007)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/api
              desc: "the Storage Fabric must stay extractable — it may not depend on Heyarr's API layer (spec §18, ADR-0007)"

        # Chunking is arithmetic over a byte stream and nothing else (spec §15,
        # ADR-0005). It is the one package in the fabric that can be verified as
        # mathematics rather than as a system, and only because it reaches
        # nowhere: no disk, no database, no catalog, no peer. Purity is not a
        # style preference here, it is what makes the golden boundaries, the
        # measured shift property and the flat-memory assertion mean anything —
        # and a boundary enforced by review is not enforced.
        chunking-is-pure:
          files:
            - "**/internal/storagefabric/chunking/**"
          deny:
            - pkg: os
              desc: "chunking is a pure function from a byte stream to cut points — it takes an io.Reader, it does not open files (spec §15)"
            - pkg: path/filepath
              desc: "chunking never sees a path; a chunk is an offset, a length and a digest and nothing else (spec §15)"
            - pkg: database/sql
              desc: "chunking does not persist anything — manifests are M5-03's job, in another package"
            - pkg: github.com/rarebit-one/heyarr-core/internal/persistence
              desc: "chunking does not persist anything — manifests are M5-03's job, in another package"
            - pkg: github.com/rarebit-one/heyarr-core/internal/storagefabric/cas
              desc: "chunking does not read or write blobs; the caller hands it a reader (spec §15, ADR-0006)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/storagefabric/manifests
              desc: "chunking produces chunks, it does not know what a manifest is — the dependency runs the other way"
            - pkg: github.com/rarebit-one/heyarr-core/internal/domain
              desc: "chunking must not know Heyarr's content domain (spec §18, ADR-0007)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/api
              desc: "chunking must not know Heyarr's API layer (spec §18, ADR-0007)"

        # Invariant 6, §38, §42, ADR-0049: the peer moves opaque encrypted
        # changes and NEVER decrypts or merges one — the semantic merge is
        # client-side. The peer-side sync surface may depend on the opaque wire
        # type (internal/personalstate/protocol) but not on the plaintext CRDT
        # model or the device-side decrypt path, so "a merge helper on the peer
        # that peeks at a decrypted field" does not compile. This is that
        # sentence, enforced — the personal-state counterpart of
        # domain-is-storage-agnostic.
        peer-never-reads-personal-state:
          files:
            - "**/internal/api/peerapi/**"
          deny:
            - pkg: github.com/rarebit-one/heyarr-core/internal/personalstate/crdt
              desc: "the peer must not import the plaintext CRDT model — it moves opaque changes and merges none (Invariant 6, §42, ADR-0049)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/personalstate/client
              desc: "the peer must not import the device-side space client — unwrapping and decryption are client-side only (Invariant 6, ADR-0049)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/personalstate/statesync
              desc: "the peer must not import the CRDT<->change bridge — decoding a change to a CRDT op is a client-side operation (Invariant 6, §42)"
            - pkg: github.com/rarebit-one/heyarr-core/internal/personalstate/encryption
              desc: "the peer must not import the encryption package — it holds no key and turns no stored byte into plaintext (Invariant 6, ADR-0049)"

    revive:
      rules:
        - name: package-comments
        - name: exported

  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]

      # On a platform without copy-on-write cloning, reflink() is an
      # unconditional error by construction (see reflink_other.go), so
      # staticcheck correctly reports the error check as always true — on that
      # build only. The ladder degrading to hardlink and then copy is the
      # intended design (ADR-0014), not a bug, and the same code is a real
      # check on linux and darwin.
      - path: internal/storagefabric/cas/fs\.go$
        text: "SA4023"
        linters: [staticcheck]

formatters:
  enable:
    - gofumpt
    - goimports
