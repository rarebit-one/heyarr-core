version: 2
# The gomod updater must fetch the private github.com/rarebit-one/void-which-binds-go
# module over git; GO_PRIVATE_READ_PAT is a read-only PAT held as an org
# Dependabot secret.
registries:
  github-rarebit-one:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.GO_PRIVATE_READ_PAT}}
updates:
  - package-ecosystem: gomod
    directory: /
    registries:
      - github-rarebit-one
    schedule: { interval: weekly }
    cooldown: { default-days: 3, semver-major-days: 7 }
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # github-actions and devcontainers accept only default-days.
    cooldown: { default-days: 3 }
    groups:
      actions:
        patterns: ["*"]
  # Dev container features (.devcontainer/devcontainer.json). The deploy
  # Dockerfile's base (distroless static-debian12:nonroot) has no version tag
  # for Dependabot's docker updater to move, so docker is not listed.
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      devcontainers:
        patterns: ["*"]
