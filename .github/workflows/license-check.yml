name: license-check

# Third-party licence check over this repo's lockfiles against the org policy in
# rarebit-one/.github. Report-only: the job writes its verdicts to the run
# summary and never fails, and it is not a required check. Repo-specific
# exceptions go in .github/license-policy.json, each with a reason.

on:
  pull_request:
  push:
    branches: [main]
  # Required check + merge queue (planned org ruleset, ~2 Dec): the queue waits for
  # this check on its merge group commit, so it must run there too or the queue
  # deadlocks. Same reason as pin-gate.yml and ci.yml.
  merge_group:

permissions:
  contents: read

jobs:
  license-check:
    uses: rarebit-one/.github/.github/workflows/license-check.yml@main
