name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The release gate and goreleaser both compile the module, which fetches the
# private voidbind-go dependency. GOPRIVATE + the private-modules token (used in
# each job below) let that fetch succeed.
env:
  GOPRIVATE: github.com/rarebit-one/*

jobs:
  # The release must not be the first place the gate runs. A tag that fails
  # acceptance has already been pushed, and an immutable tag pointing at a build
  # nobody verified is worse than a delayed release.
  #
  # The gate re-ran the full CI (-race + make demo) here, ~25 min every release,
  # to re-establish that. But ci.yml already ran that exact suite when the tag's
  # commit landed on main (push: branches: [main]) or on its PR — its aggregate
  # `ci` check pins every job (lint, race, acceptance, build, ...). A tag only
  # ever points at a commit already on main, so the answer the gate needs
  # already exists on that commit. Verify it instead of recomputing it: same
  # backstop ("don't release an unvalidated tag"), minutes instead of half an
  # hour. If the tag lands before that CI run finishes, we wait for it.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      checks: read # read the tag commit's check-runs
    steps:
      - name: require ci green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        # Pass if any `ci` check-run on this commit concluded success (a red run
        # later re-run green still means the commit is green). Fail only once
        # every `ci` run on the commit has completed and none succeeded — an
        # in-progress or not-yet-created run is waited on, up to the deadline,
        # so tagging a just-merged commit races the CI it mirrors rather than
        # losing to it. No `ci` run at all by the deadline is a failure too:
        # nothing validated this commit, which is exactly what the gate guards.
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1500 )) # 25m: cover a full CI run still in flight
          while :; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
              -q '.check_runs[] | select(.name=="ci") | "\(.status):\(.conclusion // "")"')
            if echo "$runs" | grep -q '^completed:success$'; then
              echo "ci is green for ${SHA}"; exit 0
            fi
            if [ -n "$runs" ] && ! echo "$runs" | grep -qv '^completed:'; then
              echo "ci ran for ${SHA} but did not pass:"; echo "$runs"; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out waiting for ci to complete for ${SHA}"
              echo "check-runs seen: ${runs:-<none>}"; exit 1
            fi
            echo "waiting for ci on ${SHA} (seen: ${runs:-<none>})"; sleep 20
          done

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload archives
      packages: write # push to ghcr.io
      id-token: write # provenance is signed with a workload identity token
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # goreleaser derives the changelog from history

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }

      # Multi-architecture images without an arm64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance: a signed statement of which workflow, at which commit, on
      # which runner produced these bytes. The checksums file says the archives
      # have not changed since the build; this says who built them, which is the
      # half a checksum cannot cover.
      - name: attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: read the image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Manifest")] | .[0].extra.Digest // empty' dist/artifacts.json)
          if [[ -z "$digest" ]]; then
            echo "no image digest in dist/artifacts.json — attestation would be a no-op" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rarebit-one/heyarr
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
