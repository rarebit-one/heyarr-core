name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The release gate and goreleaser both compile the module, which fetches the
# private voidbind-go dependency. GOPRIVATE + the private-modules token (used in
# each job below) let that fetch succeed.
env:
  GOPRIVATE: github.com/rarebit-one/*

jobs:
  # The release must not be the first place the gate runs. A tag that fails
  # acceptance has already been pushed, and an immutable tag pointing at a build
  # nobody verified is worse than a delayed release.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - run: go test -race -count=1 ./...
      - run: make demo

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload archives
      packages: write # push to ghcr.io
      id-token: write # provenance is signed with a workload identity token
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # goreleaser derives the changelog from history

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }

      # Multi-architecture images without an arm64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance: a signed statement of which workflow, at which commit, on
      # which runner produced these bytes. The checksums file says the archives
      # have not changed since the build; this says who built them, which is the
      # half a checksum cannot cover.
      - name: attest the archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: read the image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Manifest")] | .[0].extra.Digest // empty' dist/artifacts.json)
          if [[ -z "$digest" ]]; then
            echo "no image digest in dist/artifacts.json — attestation would be a no-op" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: attest the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/rarebit-one/heyarr
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
