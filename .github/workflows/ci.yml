name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The full OS matrix, nightly, even on a day nothing merges — so runner-image
  # drift on macOS or Windows surfaces within a day rather than on the next
  # merge. 05:30 UTC, after daemon-acceptance.yml (03:30) and race-nightly.yml
  # (04:00), so the three do not compete for the org's macOS runners.
  schedule:
    - cron: "30 5 * * *"
  # Run the full matrix against any branch on demand.
  workflow_dispatch:
  # Merge queue. `ci` is the required check, so it has to report on the queue's
  # merge_group ref too, or a queued PR waits until the queue times it out.
  # This trigger does nothing until a merge queue is enabled on main. `plan`
  # gives these runs the full OS matrix (scripts/ci-matrix.sh rule 1: not a
  # pull request), the same verdict a push to main gets, so macOS/Windows-only
  # breakage is caught before main moves. The concurrency group below falls back
  # to github.ref, which is unique per queue entry
  # (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>), and cancel-in-progress is
  # false for this event, so queued runs never cancel one another.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# voidbind-go is a private module in this org. GOPRIVATE keeps its path off the
# public proxy and checksum database; the private-modules action (used in each
# compiling job below) supplies the token that lets git fetch it.
env:
  GOPRIVATE: github.com/rarebit-one/*

# A new push to a PR supersedes the run in flight, so cancel it. A run on main
# is never cancelled mid-flight: each merge gets its full-matrix verdict, which
# is what makes it safe for pull requests to skip the macOS and Windows legs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which operating systems this run tests on. Push to main, a merge-queue
  # run, the nightly schedule and a manual dispatch get the full matrix; a pull
  # request gets Linux only unless it touches something platform-sensitive or
  # carries the `ci:full-matrix` label. scripts/ci-matrix.sh holds the rules and the data
  # behind them. Only the jobs that need a macOS or Windows RUNNER read this —
  # `lint` cross-compiles every GOOS on Linux and stays unconditional, because
  # it is cheap and it is what caught the one Windows-only bug in the sample.
  plan:
    name: plan the OS matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # bash, not ./: the file mode is not something this check should depend on.
        run: bash scripts/ci-matrix.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Build-tagged files are invisible to a lint run on another platform —
        # a gosec finding in reflink_linux.go survived a clean local darwin lint
        # and only surfaced here. Lint every platform we build for.
        goos: [linux, darwin, windows]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - run: go vet ./...
      # Pinned, not `latest`: a new golangci-lint release can add or tighten
      # checks and turn main red with no change here. Bump it deliberately,
      # together with whatever .golangci.yml needs, after a clean local run.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.13.2 }
      # A function that nothing calls, not even a test, is a claim with no
      # evidence behind it (#613 removed the backlog). deadcode is pinned in the
      # Makefile for the same reason golangci-lint is pinned above. It checks
      # one build configuration, so it runs on the linux leg only. If a function
      # is ever reachable only from another GOOS's files, move it behind that
      # build tag instead of adding an allowlist.
      - name: no unreachable functions
        if: matrix.goos == 'linux'
        run: make deadcode
      # A malformed workflow file does not fail — it silently never runs.
      # actionlint catches that before it can hide a broken pipeline.
      #
      # This check doesn't vary with matrix.goos, so it only needs to run once
      # per CI run rather than once per matrix leg.
      - name: lint workflow files
        if: matrix.goos == 'linux'
        # `docker run` rather than `uses: docker://...`: the org pin gate's pinact cannot
        # parse docker:// action refs and fails on them. The image stays digest-pinned (1.7.12).
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # This repo is public. A real host name, a real premises name or a real home
  # directory in a public AGPL repo is a permanent disclosure — git history
  # keeps it after the file is fixed. #147 and #211 were both found by accident
  # during unrelated work; this job is so the next one fails a PR instead.
  hygiene:
    name: no real host, site or personal names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup step: the guard needs only git and python3, both present on
      # the runner image. It refuses to pass if python3 is missing rather than
      # skipping, because a hygiene check that silently no-ops is worse than
      # not having one.
      - run: ./scripts/hygiene.sh

  generate-check:
    name: generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - run: ./scripts/gen.sh
      - name: fail if generated output drifted
        run: git diff --exit-code

  # The toolchain matrix is the point, not an accident (ADR-0023).
  #
  # Linux carries the pinned FFmpeg; macOS deliberately does not. No publisher
  # offers one FFmpeg version across both platforms, so rather than pretend,
  # macOS becomes a real test of the degrade path: every build proves on a real
  # machine that a Heyarr with no ffprobe still starts, scans, ingests and
  # serves. A unit test cannot make that claim about a whole process tree.
  #
  # On a pull request the macOS legs run only when `plan` says the change is
  # platform-sensitive; push to main and the nightly run always include them.
  test:
    needs: plan
    runs-on: ${{ matrix.os }}
    # No leg here runs -race any more: the race detector moved to the dedicated
    # `test-race` job below, which shards the full suite across parallel runners
    # so it no longer sits on the merge critical path. What remains is the plain
    # go test across the os/go matrix, ~5m wall incl. build and the pinned-
    # toolchain fetch. The go test -timeout=20m below is the real per-run bound;
    # this is only the outer stop for a wedged job.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: install the pinned media toolchain
        if: runner.os == 'Linux'
        # The script prints the bin directory on stdout and its progress on
        # stderr, so this appends exactly the path.
        run: ./scripts/toolchain.sh >> "$GITHUB_PATH"
      - name: the toolchain is the pinned version, or there is none
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ffprobe -version | head -1
            ./scripts/toolchain.sh --check
          else
            # Assert the ABSENCE. A macOS runner that quietly acquired ffmpeg
            # would silently stop testing the degrade path, and nothing would
            # go red to say so.
            if command -v ffprobe >/dev/null 2>&1; then
              echo "this runner has ffprobe; it is supposed to be the bare one" >&2
              exit 1
            fi
          fi
      - name: libssl for the TPM reference simulator (tpm-custody seal/unseal test)
        if: runner.os == 'Linux'
        # go-tpm's transport API targets the TPM 2.0 reference simulator, which
        # go-tpm-tools runs in-process via cgo + libcrypto. This is the only cgo in
        # the build and it is confined to the tpmsim-tagged step below; the whole
        # matrix stays CGO_ENABLED=0.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      # -timeout=20m, not the default 10m per package: internal/api/resources
      # can approach the default under load on a busy runner, and a per-package
      # test timeout is only a hang reported as a failure if the bound is
      # generous enough to be reached solely when something is genuinely wedged.
      # The job's own timeout-minutes stays the outer stop. No -coverprofile:
      # nothing uploaded or gated on coverage.out. The race detector lives in
      # `test-race`.
      - run: go test -count=1 -timeout=20m ./...
      - name: the toolchain tests ran rather than skipping
        if: runner.os == 'Linux'
        run: |
          # "Optional" quietly meaning "untested" is the specific failure this
          # milestone is most exposed to, and a skipped test looks exactly like
          # a passing one in the summary line.
          go test -count=1 -v ./internal/media/... | tee /tmp/media.log
          # The fixture probe tests are the other half: they are the assertion
          # that the committed media is real, and they are skip-guarded the
          # same way.
          go test -count=1 -v ./internal/testutil/fixtures/... | tee -a /tmp/media.log
          if grep -q -- '--- SKIP' /tmp/media.log; then
            echo "a media test skipped on the runner that has the toolchain" >&2
            grep -B2 -- '--- SKIP' /tmp/media.log >&2
            exit 1
          fi
      - name: the ADR-0098 TPM seal/unseal round-trip (reference simulator, cgo)
        if: runner.os == 'Linux'
        # The only cgo in this build, confined to one step and the `tpmsim` tag —
        # the CGO_ENABLED=0 matrix above never compiles it. A skipped hardware test
        # looks like a passing one, so assert it actually ran and passed.
        run: |
          CGO_ENABLED=1 go test -count=1 -v -tags tpmsim -run TestSealUnsealAgainstSimulator ./internal/personalstate/client/tpm/ | tee /tmp/tpm.log
          grep -q -- '--- PASS: TestSealUnsealAgainstSimulator' /tmp/tpm.log || {
            echo "the TPM seal/unseal simulator test skipped or did not pass" >&2
            exit 1
          }

  # The race detector, sharded. Until now the ubuntu/stable `test` leg ran
  # `go test -race ./...` over the whole module in a single job — ~24m, and the
  # entire PR critical path (every other job finishes in ≤6m). The detector's
  # cost is per-package and embarrassingly parallel, so this partitions
  # `go list ./...` deterministically across N runners by line index, runs -race
  # on each subset, and the aggregating `race` gate below turns the shards back
  # into one status. The SAME package set runs under -race as before, at ~1/N
  # the wall time. The full os/go -race matrix still runs nightly on main
  # (race-nightly.yml).
  #
  # Coverage is deliberately NOT collected here: coverage.out was never uploaded
  # or gated anywhere (dead output), and the instrumentation only slows the
  # detector.
  test-race:
    name: test-race
    runs-on: ubuntu-latest
    # ~1/4 of the suite under -race is well under 10m incl. build and toolchain
    # fetch; 25m is a generous outer stop, kept above the go test -timeout=20m
    # inner bound so a genuine per-package hang fails as a test timeout first.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - name: install the pinned media toolchain
        # The same toolchain the ubuntu `test` leg installs: some packages' tests
        # need ffprobe, and under -race a skipped test is as invisible as a
        # passing one. The `test` job asserts the pinned version on every run, so
        # this only needs the binaries on PATH.
        run: ./scripts/toolchain.sh >> "$GITHUB_PATH"
      - name: run this shard's packages under -race
        run: |
          # Deterministic partition: `go list ./...` is sorted, and awk assigns
          # each package to exactly one shard by line index (NR % SHARD_TOTAL).
          # The union over shards 0..SHARD_TOTAL-1 is the full list, no gaps and
          # no overlap. An empty shard (fewer packages than shards) is a no-op
          # success, never a failure.
          pkgs=$(go list ./... | awk -v idx="$SHARD_INDEX" -v n="$SHARD_TOTAL" 'NR % n == idx')
          if [ -z "$pkgs" ]; then
            echo "shard $SHARD_INDEX/$SHARD_TOTAL has no packages; nothing to test"
            exit 0
          fi
          echo "shard $SHARD_INDEX/$SHARD_TOTAL packages:"
          echo "$pkgs"
          # No -coverprofile: see the job header. $pkgs is intentionally
          # unquoted — each line is one package argument to go test.
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout=20m $pkgs

  # Aggregate the race shards into one status a maintainer can require, exactly
  # as `ci` does for the pipeline as a whole. if: always() plus the toJSON check
  # means a failed OR cancelled shard fails this gate rather than leaving it
  # skipped — a skipped job would slip through `ci`'s failure check below.
  race:
    name: race (all shards)
    if: always()
    needs: [test-race]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if any race shard failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "one or more race shards failed"; exit 1
          fi
          echo "all race shards passed"

  # Chunk boundaries must be identical on every platform, and this is the only
  # job that can say so.
  #
  # Two peers that cut one blob into different chunks compute different
  # manifests for it. Nothing fails: transfers simply stop deduplicating and
  # repair stops reusing, quietly, forever. The `test` matrix above runs Linux
  # and macOS, so Windows — the platform most likely to differ, and the one
  # nobody here develops on — would otherwise be asserted by nothing.
  #
  # On a pull request only the Linux row runs unless `plan` says otherwise —
  # and a change to the chunking package itself always makes it say otherwise.
  chunking-determinism:
    name: chunk boundaries are identical across platforms
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Full: ubuntu and macOS under -race, plus windows without it —
        # windows/amd64 needs a C toolchain for the race detector, and the
        # assertion here is determinism, which the detector has nothing to say
        # about. The two unix rows run this package under -race.
        include: ${{ fromJSON(needs.plan.outputs.full == 'true' && '[{"os":"ubuntu-latest","flags":"-race"},{"os":"macos-latest","flags":"-race"},{"os":"windows-latest","flags":""}]' || '[{"os":"ubuntu-latest","flags":"-race"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - run: go test -count=1 -v ${{ matrix.flags }} ./internal/storagefabric/chunking/...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/heyarr

  # The milestone gate. It runs on both operating systems deliberately: the
  # demo drives unix sockets, SIGTERM handling, filesystem materialisation and
  # free-space behaviour, and every one of those differs between Linux and
  # macOS. Running it on one of the two would leave the other untested in
  # exactly the places it is most likely to differ.
  #
  # On a pull request the macOS leg runs only when `plan` says the change is
  # platform-sensitive (scripts/, which holds the demo, always is); every push
  # to main and the nightly run still run both. Over 30 days, 22 macOS-only
  # failures here caught one real bug (bash 3.2 in scripts/acceptance.sh) and
  # were otherwise the demo overrunning its budget on a slower runner.
  acceptance:
    name: acceptance (end-to-end)
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - name: install the pinned media toolchain
        if: runner.os == 'Linux'
        run: ./scripts/toolchain.sh >> "$GITHUB_PATH"
      # Linux runs the demo with a toolchain, macOS without one. Both must
      # pass: everything M1 proved is independent of FFmpeg, and ADR-0023 says
      # it stays that way.
      #
      # `make claims` rather than `make demo`: it runs the same demo and then
      # checks what it printed against scripts/claims.list, which fails when
      # something this repository claims to do was not exercised. That is the
      # guard for the defect five features shipped with — a mechanism built,
      # tested, reviewed and merged, that no running binary can reach. See the
      # header of scripts/claims.list.
      - run: make claims

  # The degraded pass, on the SAME operating system as the equipped one.
  #
  # macOS already runs without a toolchain, but that confounds two variables:
  # a failure there could be the missing FFmpeg or it could be macOS. This job
  # changes exactly one thing against the Linux acceptance job above, so
  # "Heyarr works with no FFmpeg" is tested rather than inferred.
  #
  # It is also the job that would catch the toolchain quietly becoming
  # mandatory — the failure mode ADR-0023 exists to prevent, and the one that
  # would otherwise be discovered by a user on a NAS.
  # Every job here is bounded. GitHub's default is SIX HOURS, and a hung
  # acceptance run therefore looks identical to a slow one for most of a
  # working day — which is exactly what happened while this file was being
  # written: `acceptance (no media toolchain)` sat in_progress for seventeen
  # minutes against a job that normally takes eighty seconds, with fourteen
  # sibling jobs already green and nothing to say it was stuck.
  #
  # scripts/acceptance.sh already applies this reasoning INSIDE itself —
  # `assert_refuses` bounds every command it runs, because "a regressed refusal
  # turns this script into a hang rather than a failure". The workflow around
  # it had no such bound. These numbers are generous against observed
  # durations, so they are a starvation guard rather than a service-level
  # objective: if a job is genuinely wedged it still fails, and it fails for a
  # reason that is true.
  acceptance-degraded:
    name: acceptance (no media toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.AUTOLAND_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: true }
      - name: assert this runner has no toolchain
        run: |
          # A runner that quietly acquired ffmpeg would silently stop testing
          # the degrade path, and nothing would go red to say so.
          for tool in ffmpeg ffprobe; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "this runner has $tool; it is supposed to be the bare one" >&2
              exit 1
            fi
          done
      - run: make demo

  # Aggregate status so branch protection needs exactly one required check.
  #
  # `plan` is in the list so that if it fails, `ci` fails — the jobs that need
  # it are then skipped, and a skipped job alone would not trip the check
  # below. Legs that `plan` leaves out of a matrix are not skipped jobs: they
  # never exist, so they cannot affect `needs.<job>.result`.
  ci:
    name: ci
    if: always()
    needs: [plan, lint, hygiene, generate-check, test, race, chunking-determinism, build, acceptance, acceptance-degraded]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if any job failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "one or more ci jobs failed"; exit 1
          fi
          echo "all ci jobs passed"
