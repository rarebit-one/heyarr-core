# Pinned FFmpeg toolchain (ADR-0023).
#
# Format: <tool>-<goos>-<goarch> <version> <sha256> <url>
#
# The DIGEST is the pin. The version is recorded so an install can assert it
# rather than merely check that a file exists — a leftover binary from an older
# pin looks identical to a correct one until something behaves differently.
#
# Why a digest and not a package manager: a distro package drifts, and two
# machines running "the latest ffmpeg" are two different test environments. Why
# not a marketplace Action: that is another supply-chain dependency in a public
# AGPL repository, and it gives no story at all for the deployment host, which
# has no Go toolchain and no CI. A GitHub release asset CAN be replaced by its
# publisher after the fact; a committed digest is the difference between
# noticing that and not.
#
# ---------------------------------------------------------------------------
# THE VERSIONS ARE NOT THE SAME ON EVERY PLATFORM, AND THAT IS NOT A TYPO
# ---------------------------------------------------------------------------
#
# The upstream release tagged `b6.1.1` ships ffmpeg 7.0.2-static for linux and ffmpeg
# 6.0 for darwin/arm64. The tag names the project's own release, not the
# binaries in it, and no static-build publisher offers one version across both
# linux and macOS/arm64 — checked while writing this file, which is how the
# skew was found at all.
#
# Rather than pretend otherwise, the skew is made load-bearing:
#
# The linux binaries report "7.0.2-static" and the darwin ones report "6.0";
# the version column is what the binary SAYS, verbatim, not a tidied-up form of
# it. TestAgainstTheRealPinnedToolchain compares them exactly and caught this
# file claiming "7.0.2" on the first CI run.
#
#   * LINUX IS THE CANONICAL TOOLCHAIN PLATFORM. Golden probe output is
#     generated and asserted there, and CI installs the toolchain on the Linux
#     runners only.
#   * The macOS runners deliberately run WITHOUT a toolchain, which makes them
#     a real test of ADR-0023's degrade path rather than a second version of
#     the same test. The claim "a Heyarr with no ffprobe still works" is then
#     exercised on a real machine every build.
#   * The darwin entries exist for local development convenience. A developer's
#     probe output may differ from CI's; when it does, CI is right.
#
# What would make us revisit: a publisher offering matched static builds across
# linux and darwin/arm64, or ffprobe's JSON output changing in a way that makes
# the skew visible to the tests rather than merely present.

