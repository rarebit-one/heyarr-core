# The Heyarr JSON API (spec §77).
#
# This document is written by hand and kept honest by a test, not generated
# (ADR-0015). internal/controller/openapi_test.go walks the real router and
# asserts parity in both directions: a route that is served and not documented
# fails, and an operation documented here that is not served fails too.
#
# So: add a route, add it here. The test tells you the exact string to write —
# `go test -run TestRouteInventory -v ./internal/controller`.
#
# Paths are absolute rather than relative to a /api/v1 server URL, because
# /healthz, /readyz and /metrics are real routes that live outside it. With a
# prefixed server URL those three could not be written down at all, and the
# parity test would have to be taught to ignore them — which is the same thing
# as not checking them.
openapi: 3.1.0

info:
  title: Heyarr
  version: "1"
  summary: Headless content lifecycle, replication and consumption for homelabs.
  description: |
    Every error is an RFC 9457 problem document with a stable `type` URI. Clients
    branch on `type` — not on the title, not on the detail, and not on the HTTP
    status alone, which several different conditions share.

    Collections are paginated by keyset with an opaque cursor. `next_cursor` is
    absent on the last page, so "keep going while next_cursor is set" is the
    whole client loop. The cursor's contents are not a contract: it encodes the
    sort key of the last row returned, and a client that parses it breaks the
    first time a sort order changes.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8385
    description: The default loopback bind (ADR-0011).

security:
  - bearerAuth: []

tags:
  - name: content
    description: Works, editions, assets and the libraries they come from.
  - name: bytes
    description: Blob metadata. The bytes themselves are a separate contract (ADR-0013).
  - name: fabric
    description: Peers and replicas.
  - name: operations
    description: Jobs, events, credentials and system state.
  - name: policy
    description: Quality profiles — the standard desired state is measured against (§62).
  - name: desired
    description: What should exist, whether or not it does yet (§55).

paths:
  /healthz:
    get:
      tags: [operations]
      operationId: healthz
      summary: Liveness.
      description: |
        This process is running and its HTTP stack works. It checks nothing else
        on purpose: a liveness probe that fails because the database is busy
        causes a restart loop that makes the database busier.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [operations]
      operationId: readyz
      summary: Readiness.
      description: |
        Whether this process can actually serve requests. Deliberately free of
        anything an unauthenticated caller should not learn — no paths, no
        versions, no counts.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Prometheus metrics.
      description: |
        Authenticated exactly like the API and requiring `read`. Route names,
        library sizes and request patterns are not "just metrics".
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system:
    get:
      tags: [operations]
      operationId: getSystem
      summary: What this node is and what it is running.
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works:
    get:
      tags: [content]
      operationId: listWorks
      summary: Page the catalog.
      description: |
        Ordered by `(sort_title, id)`. The id is in the sort key because
        sort_title is not unique, and a non-unique keyset boundary skips and
        repeats rows exactly as OFFSET does.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
          description: Restrict to one content type.
        - name: library_id
          in: query
          schema: { type: string }
          description: Works with at least one asset in this library.
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over `sort_title`.
      responses:
        "200":
          description: A page of works.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works/{id}:
    get:
      tags: [content]
      operationId: getWork
      summary: One work.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/editions/{id}:
    get:
      tags: [content]
      operationId: getEdition
      summary: One edition.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The edition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/assets:
    get:
      tags: [content]
      operationId: listAssets
      summary: Page the files.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: library_id
          in: query
          schema: { type: string }
        - name: content_type
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [present, missing] }
          description: |
            `missing` is an asset whose source path has vanished. It is not a
            deletion: the catalog row and any blob both remain (ADR-0018).
      responses:
        "200":
          description: A page of assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/assets/{id}:
    get:
      tags: [content]
      operationId: getAsset
      summary: One asset.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [content]
      operationId: deleteAsset
      summary: Delete an asset. Requires `write`.
      description: |
        Logical, per ADR-0018. The asset stops existing; its blob does not. A
        later `gc_blobs` sweep reclaims blobs that no asset references, once a
        grace window has passed — which is what makes a mistaken delete
        reversible. Nothing is unlinked inside this request.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204":
          description: Deleted. No bytes were removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries:
    get:
      tags: [content]
      operationId: listLibraries
      summary: Page the libraries, each with its roots.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over the name.
      responses:
        "200":
          description: A page of libraries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [content]
      operationId: createLibrary
      summary: Create a library. Requires `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content_type]
              additionalProperties: false
              properties:
                name: { type: string }
                content_type: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/libraries/{id}:
    get:
      tags: [content]
      operationId: getLibrary
      summary: One library, with its roots.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries/{id}/roots:
    post:
      tags: [content]
      operationId: createLibraryRoot
      summary: Add a root to a library. Requires `write`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string }
                ingest_mode:
                  type: string
                  enum: [reflink, hardlink, copy, link]
                  default: reflink
                  description: |
                    How ingest materialises bytes into the CAS (ADR-0014).
                    `link` catalogues files where they are and never copies them
                    (ADR-0020).
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRoot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/libraries/{id}/scan:
    post:
      tags: [content]
      operationId: scanLibrary
      summary: Enqueue a scan. Requires `write`.
      description: |
        One `scan_library` job per enabled root, because the scanner's job is
        root-scoped. A library with two roots therefore yields two jobs, and a
        client waiting on the scan must wait on all of them — waiting on the
        first only is how a CLI exits 0 with half the library unscanned.

        Enqueueing is idempotent while a scan of the same root is still live: a
        second request returns the running job rather than queueing a second
        walk of the same tree (ADR-0008).
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "202":
          description: Accepted; the jobs are queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_id: { type: string }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The library has no enabled roots, so there is nothing to scan.
            Returning 202 here would let a client believe a scan is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/blobs/{hash}:
    get:
      tags: [bytes]
      operationId: getBlob
      summary: Blob metadata.
      description: |
        Metadata only. The bytes are served by `/api/v1/blobs/{hash}/content`,
        which is deliberately a separate contract with four consumers
        (ADR-0013).
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: The blob record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/blobs/{hash}/content:
    parameters:
      - name: hash
        in: path
        required: true
        description: The BLAKE3 digest that names the blob, as `blake3:<64 lowercase hex characters>`.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [bytes]
      operationId: getBlobContent
      summary: Serve a blob's bytes, whole or by range.
      description: >-
        The byte-serving contract of spec §28, and deliberately one endpoint
        with four consumers: direct playback, remote ffprobe (§29),
        replication, and HTTP web-seeding (§27). See ADR-0013 — it is not "the
        playback endpoint" and must not be tuned as one.


        The response carries a strong `ETag` derived from the content, and
        `Cache-Control: public, max-age=31536000, immutable`. Immutable caching
        is correct here rather than risky because the URL is the digest: this
        path can never mean different bytes. No `Last-Modified` is sent —
        a modification time is a property of one peer's copy, and two peers
        holding identical bytes must advertise identical validators.


        The media type is always `application/octet-stream`: the content store
        knows the digest and the length and nothing else. What the bytes mean
        is catalog metadata.
      parameters:
        - name: download
          in: query
          required: false
          description: >-
            `1`, `true` or `yes` adds `Content-Disposition: attachment`. The
            bytes, ranges and validators are identical either way.
          schema:
            type: string
      responses:
        '200':
          description: The whole blob.
          headers:
            ETag:
              description: '`"blake3-<hex digest>"`.'
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Cache-Control:
              schema: { type: string }
            Content-Disposition:
              description: Present only when `download` was requested.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The requested range or ranges.
          headers:
            Content-Range:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404':
          description: This peer holds no such blob. Ask another peer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '416':
          description: The requested range lies outside the blob.
          headers:
            Content-Range:
              description: '`bytes */<size>`.'
              schema: { type: string }
    head:
      tags: [bytes]
      operationId: headBlobContent
      summary: Report a blob's size and range support without transferring it.
      description: >-
        Identical to `get` in every header, with no body. This is how a remote
        prober or a replication client learns the length and confirms range
        support before it starts.
      responses:
        '200':
          description: The blob exists; `Content-Length` is its size.
          headers:
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Content-Length:
              schema: { type: integer, format: int64 }
        '206':
          description: The blob exists and the requested range is satisfiable.
          headers:
            Content-Range:
              schema: { type: string }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '416':
          description: The requested range lies outside the blob.

  /api/v1/peers:
    get:
      tags: [fabric]
      operationId: listPeers
      summary: Page the peers.
      description: |
        A paginated collection even though Milestone 1 has exactly one peer
        (ADR-0010). A client written against a single-object response would have
        to be rewritten for Milestone 4, and the ones that are not keep showing
        one peer.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: mode
          in: query
          schema: { type: string, enum: [full, partial, cache, archive, compute] }
      responses:
        "200":
          description: A page of peers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Peer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/replicas:
    get:
      tags: [fabric]
      operationId: listReplicas
      summary: Page the replicas.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [present, pending, corrupt, missing] }
        - name: peer_id
          in: query
          schema: { type: string }
        - name: blob_hash
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of replicas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Replica" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/blobs/{hash}/probe:
    get:
      tags: [content]
      operationId: getBlobProbe
      summary: What ffprobe said about a blob's bytes.
      description: |
        Hangs off the blob rather than the asset because a probe describes
        **bytes**, and bytes are identity: two assets sharing a blob share one
        probe (§29, invariant 1).

        A blob with no probe is **404, not an empty 200**. "We have not probed
        this" and "this has no streams" are different answers, and a client
        that cannot tell them apart cannot decide whether to wait — which is
        exactly the state every blob is in on a node with no ffprobe
        (ADR-0023).

        `bytes_read` and `materialised` are how the probe was obtained, exposed
        so §29 is auditable in a running deployment. An instance where every
        probe materialised is one where remote probing is silently not working,
        and the only other symptom is that it feels slow.
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobProbe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/publications:
    get:
      tags: [content]
      operationId: listPublications
      summary: Page publications — EPUB, PDF, CBZ and CBR.
      description: |
        Heyarr **stores and serves** publications; it does not render them
        (§69). Clients render.

        This is the catalog view: enough to tell an EPUB from a CBZ, and how
        long it is, without downloading it first. The bytes come from
        `/api/v1/blobs/{hash}/content` like everything else — ADR-0013 makes
        that one endpoint with several consumers, and a reader is another one,
        not another endpoint.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: format
          in: query
          schema:
            type: string
            enum: [epub, pdf, cbz, cbr]
      responses:
        "200":
          description: A page of publications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/publications/{id}:
    get:
      tags: [content]
      operationId: getPublication
      summary: One publication, by ASSET id.
      description: |
        Keyed by asset rather than blob. The metadata is stored against the
        blob because it describes the bytes, but a client holds an asset: one
        blob can be two assets with two filenames in two libraries, and "which
        publication" is a question about a *use* of the bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playback:
    post:
      tags: [playback]
      operationId: startPlayback
      summary: Plan, open a session, and return somewhere to play from.
      description: |
        The one call a client makes when someone presses play.

        **The controller stays out of the content data path (§32).** It returns
        a direct URL to the peer holding the replica; it does not proxy bytes.
        A controller that proxied would make playback's availability depend on
        its own, which is exactly the coupling §53's degraded-operation model
        exists to avoid — a Full Peer must keep streaming when the controller
        has gone.

        The URL is `/api/v1/blobs/{hash}/content`, unchanged. ADR-0013's
        consequences forbid "adding a player-shaped session token" to it, so
        playback gets no byte route, no auth scheme and no signed URL of its
        own — it gets a short-lived credential and the same endpoint
        replication and the BitTorrent web-seed use.

        **The credential is scoped to `read` and expires, but is not scoped to
        one blob.** A client holding one can read any blob until it expires.
        Per-blob scoping is a *grant* (§77's `/grants`), which is a later
        milestone with principals behind it; inventing a lesser version here
        would be a second authorisation model to reconcile with the real one.

        **Anything that is not DIRECT is a 409** carrying the planner's first
        reason, not a 501. The request is well-formed and the asset is real;
        what cannot happen is this pairing of asset and device. No session is
        opened — a session for a playback that cannot happen is state nobody
        will clean up, and it would appear in "continue watching" for something
        nobody watched. `POST /playback/plan` has the full rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartPlayback" }
      responses:
        "201":
          description: The session, the plan, and where to play from.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedPlayback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The plan is not DIRECT, or nothing holds the bytes. No session was
            opened.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/remux:
    post:
      tags: [playback]
      operationId: enqueueRemux
      summary: Queue a remux for an asset a device cannot take as it is (§10, §75).
      description: |
        Rewraps the encoded streams into a container the device declares. It
        does **not** re-encode: `-c copy` is the whole contract, and Milestone
        2 has no quality ladder, no HLS or DASH segmenting and no transcode.

        **Separate from `POST /playback` deliberately.** A remux is minutes of
        work and disk; starting one because a client asked what it could play
        would let a browsing client fill a disk. When to spend that is a policy
        question, and policy is §55's.

        Only a **REMUX** plan is actionable. A DIRECT plan needs no work, and a
        TRANSCODE plan would produce a remux that still does not play — a
        failure the client would discover only after waiting for it. Both are
        409.

        Returns the job. Poll `/jobs/{id}` or follow `job.*` on the event
        stream, then re-plan.

        The output is recorded as an **Asset** with role `derived` on the same
        Edition, so replication, integrity and garbage collection treat it like
        any other managed asset. That means it will be replicated and will be
        reclaimed when nothing references it — both correct, neither free.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemuxRequest" }
      responses:
        "202":
          description: The remux was queued.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  container: { type: string, enum: [mp4, mkv] }
                  asset_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The plan is not REMUX, so there is nothing useful to queue.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/plan:
    post:
      tags: [playback]
      operationId: planPlayback
      summary: What should this device do with this asset? (§68)
      description: |
        DIRECT, REMUX, TRANSCODE — or `unplayable` when nothing holds the bytes.

        **It writes nothing and opens no session.** A client shows a "play"
        button by planning and opens a session when someone presses it; if
        planning created state, every hover would too.

        The `reasons` are the point. "Why is my television transcoding this" is
        the single most common question this class of software is asked, and a
        planner that answers only with a verb cannot answer it. Codes are
        stable strings because clients branch on them; `detail` is prose for a
        human and may change.

        **Media nothing has probed plans DIRECT**, with a `no_probe` reason
        saying the plan is a guess. The conservative-looking answer is
        TRANSCODE and it is wrong: a node with no probes is precisely a node
        with no ffprobe (ADR-0023), which cannot transcode either — so
        planning TRANSCODE there would make the entire library unplayable,
        while DIRECT makes most of it work and fails visibly when it does not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/consumption/sessions:
    get:
      tags: [playback]
      operationId: listConsumptionSessions
      summary: Page consumption sessions, newest first.
      description: |
        `?state=resumable` is the **"continue watching"** query: every session
        that has not reached a terminal state, most recently touched first, for
        watching, listening and reading alike (§67).

        It is a named filter rather than `state=created,playing,paused` because
        "resumable" is the question clients actually ask, and spelling it as
        three states would put the state machine's shape into every client.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [resumable, created, playing, paused, stopped, completed]
        - name: asset_id
          in: query
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: createConsumptionSession
      summary: Open a consumption session.
      description: |
        One model covers watching, listening and reading (§67, ADR-0024). The
        session starts in `created` — a real state, not a formality: the gap
        between "I intend to watch this" and "bytes are moving" is where the
        planner runs, and collapsing it makes an abandoned plan
        indistinguishable from a playback that stalled instantly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumptionSession" }
      responses:
        "201":
          description: The session.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/consumption/sessions/{id}:
    get:
      tags: [playback]
      operationId: getConsumptionSession
      summary: One session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/consumption/sessions/{id}/transitions:
    post:
      tags: [playback]
      operationId: transitionConsumptionSession
      summary: Move a session through its state machine.
      description: |
        One endpoint rather than six (`/start`, `/pause`, `/resume`, …),
        because the state machine is one thing: six endpoints would each need
        to know the transition table, and the first one to disagree with it
        would be a session in a state the domain says is impossible.

        Every transition emits a `playback.session.*` event, inside the same
        transaction that wrote the row (invariant 7, ADR-0009).

        An illegal transition — resuming a completed session, progressing a
        stopped one — is **409**, not 400. The request is well-formed and would
        be legal against a different state, and a client cannot tell "you sent
        nonsense" from "you are out of date" if both are 400. Only the second
        is fixed by re-reading the session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionTransition" }
      responses:
        "200":
          description: The session after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The transition is illegal from the session's current state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/devices:
    get:
      tags: [playback]
      operationId: listDevices
      summary: Page the registered devices.
      description: Ordered by `(name, id)`.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: registerDevice
      summary: Register a device, or update the one already registered.
      description: |
        An **upsert on `device_key`**, not a create. An app announces itself on
        every launch; if that created a row each time, this collection would
        fill with duplicates named "Living Room" and the playback planner would
        be choosing between four thousand copies of one television.

        `201` with a `Location` header the first time, `200` afterwards.

        A device here is a **capability profile, not an identity** (§68).
        Nothing in it is a credential and nothing is authenticated: Heyarr has
        no way to interrogate a television, so a client declares what it can
        play and Heyarr believes it. Device enrolment, keypairs and key
        recovery are ADR-0022 and Milestone 8.

        Codec and container names are lower-cased, trimmed and de-duplicated,
        so two clients spelling one capability differently converge rather than
        producing a planner that matches one device and not its identical twin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDevice" }
      responses:
        "200":
          description: The device already existed; its profile was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: A new device.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{id}:
    get:
      tags: [playback]
      operationId: getDevice
      summary: One device.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired:
    get:
      tags: [desired]
      operationId: listDesired
      summary: Page what should exist.
      description: |
        Ordered by `(created_at, id)`. A want has no name to sort by, and the
        interesting order is the order things were asked for.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: scope
          in: query
          schema: { type: string, enum: [work, edition] }
        - name: monitor
          in: query
          description: Only monitored, or only unmonitored, wants.
          schema: { type: string, enum: ["true", "false"] }
        - name: work_id
          in: query
          schema: { type: string }
        - name: quality_profile_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of desired items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [desired]
      operationId: createDesired
      summary: Want something.
      description: |
        **A want must work when you have nothing.** That is the whole point of
        this endpoint and the requirement most easily lost: every fixture in
        this repository has assets, so a design that only works once something
        exists passes every test and fails the first real use.

        Name the work either by `work_id`, or — when it does not exist yet — by
        a `work` descriptor of content type, title and year. The descriptor
        resolves through the **same** `(content_type, work_key)` get-or-create
        the scanner uses, so wanting a film and later scanning it converge on
        one Work rather than producing two.

        Name the quality profile by `quality_profile_id` or by
        `quality_profile` (its name) — a person writing this by hand knows
        `living-room`, not a UUID. A profile is **required**: "this should
        exist", with no statement of what would count as existing, cannot be
        evaluated (§56).

        `monitor` defaults to **true**. Wanting something and then silently
        never looking for anything better is the surprising default.

        Two wants over the same target with **different** profiles are legal
        and are the point (§61 — never one version per title): the living-room
        copy and the phone-sized copy are two wants. The same target with the
        same profile is one want written twice, and is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDesired" }
      responses:
        "201":
          description: The want.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That content is already wanted under that profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}:
    get:
      tags: [desired]
      operationId: getDesired
      summary: One desired item.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The want.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [desired]
      operationId: updateDesired
      summary: Change the conditions, the monitoring or the note.
      description: |
        An omitted field is left alone.

        **The target cannot be changed.** Repointing a want at different
        content is not an edit, it is a different want, and allowing it would
        make the acquisition history attached to this row describe something
        else. Delete it and want the other thing.

        A request that changes nothing emits no event.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDesired" }
      responses:
        "200":
          description: The want as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new profile would duplicate an existing want.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [desired]
      operationId: deleteDesired
      summary: Stop wanting something.
      description: |
        Physical, matching quality profiles and for the same reason: a want is
        a statement of intent, not bytes. ADR-0018's logical-delete stance
        exists to stop shared, expensive, unrecoverable bytes being unlinked
        inline, and none of that applies here — an operator who says they no
        longer want something should find it gone.

        The `desired.removed` event carries the target, not only the row id, so
        the log still says what was wanted after the row is gone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: No longer wanted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/quality-profiles:
    get:
      tags: [policy]
      operationId: listQualityProfiles
      summary: Page the quality profiles.
      description: Ordered by `name`, which is unique.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of quality profiles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [policy]
      operationId: createQualityProfile
      summary: Author a quality profile.
      description: |
        A **create, not an upsert**. Device registration is an upsert because a
        television announces itself on every launch and nobody chose to do it;
        a profile is authored deliberately, and silently replacing one because
        the name matched would discard whatever it said before. A name
        collision is a `409`.

        Rules are validated here, at write time — an attribute that does not
        exist, an ordering comparison on a codec name, or a weight on a gate is
        a `400` naming the section and the rule. That is deliberate: a mistake
        in a profile should be reported to whoever wrote the profile, not
        turned into a rejection reason attached to every candidate for the next
        six months.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "201":
          description: The profile.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A profile with that name already exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles/{id}:
    get:
      tags: [policy]
      operationId: getQualityProfile
      summary: One quality profile.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [policy]
      operationId: updateQualityProfile
      summary: Replace a quality profile's rules.
      description: |
        A section the request **omits** is left alone; a section sent as `[]`
        is **cleared**. Those are different intentions, and collapsing them
        would make "clear this profile's terminal rules" and "forget to send
        them" the same request.

        A request that changes nothing emits no event. A client that re-sends
        its whole configuration on every start would otherwise turn the event
        stream into a heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "200":
          description: The profile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new name is already taken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [policy]
      operationId: deleteQualityProfile
      summary: Delete a quality profile.
      description: |
        Physical, not logical — a deliberate departure from ADR-0018's stance
        for *content*. ADR-0018 is about bytes: deleting an asset must not
        unlink blobs inline because bytes are expensive, shared and
        unrecoverable. A profile is a page of configuration, cheap to retype
        and referenced by nothing but desired state, and a soft-deleted one
        would have to be filtered out of every read path forever to avoid an
        operator seeing a profile they deleted.

        A profile still referenced by desired state is refused with `409`
        rather than cascaded: deleting the standard by which desire is
        measured, and leaving the desire, would make satisfaction unanswerable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Still referenced by desired state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/jobs:
    get:
      tags: [operations]
      operationId: listJobs
      summary: Page the job queue.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/jobs/{id}:
    get:
      tags: [operations]
      operationId: getJob
      summary: One job.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{id}/retry:
    post:
      tags: [operations]
      operationId: retryJob
      summary: Put a finished job back on the queue. Requires `write`.
      description: |
        An operator action: something was wrong and has been fixed. Only a
        succeeded, failed or dead job may be retried; a pending or leased one is
        a 409, because "retry" on a job that is already running would mean
        running it twice.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job, back in `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/events:
    get:
      tags: [operations]
      operationId: streamEvents
      summary: The event stream (server-sent events).
      description: |
        A live SSE feed of §76 events, preceded by everything after `after`.

        Reconnection is gapless: a client that saw sequence N reconnects with
        `?after=N` and receives everything since, with no hole and no duplicate.
        The subscription is opened before the catch-up read — the other order
        leaves a window in which committed events are in neither half, and both
        halves look complete on their own.

        Each frame carries `id: <seq>`, so a browser `EventSource` resumes on
        its own via `Last-Event-ID`, which this endpoint honours when `after` is
        absent.

        A slow consumer is dropped rather than backpressured (ADR-0009). When
        that happens the stream emits one `heyarr.stream.gap` event carrying
        `resume_after` and `dropped`, and closes. Reconnect with
        `?after=resume_after`. Closing silently would be indistinguishable from
        a network blip, and a client cannot tell "refill" from "carry on".

        Resume from the highest sequence number you have seen. Under concurrent
        writes a straggler may arrive slightly out of order; nothing is ever
        delivered twice.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: Deliver everything with a sequence number greater than this.
        - name: types
          in: query
          schema: { type: string }
          description: |
            Comma-separated event types. Each is an exact name (`job.failed`) or
            a trailing-`*` namespace prefix (`job.*`).
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens:
    get:
      tags: [operations]
      operationId: listTokens
      summary: Every credential. Requires `admin`.
      description: |
        Not paginated: the number of tokens is the number of integrations an
        operator has set up, and unlike the catalog nothing writes to this table
        while it is being read.
      responses:
        "200":
          description: The credentials. Never any secret material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operations]
      operationId: createToken
      summary: Mint a credential. Requires `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name: { type: string }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [read, write, admin] }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: |
            The credential and its secret. The secret is returned exactly once
            and is not recoverable: only its argon2id hash was stored.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{id}:
    get:
      tags: [operations]
      operationId: getToken
      summary: One credential. Requires `admin`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [operations]
      operationId: revokeToken
      summary: Revoke a credential. Requires `admin`.
      description: |
        Logical: the row stays and `revoked_at` is set. An audit trail that
        deletes the thing being audited is not one. Revoking twice is a 409, so
        a script cannot mistake "already revoked" for "revoked something just
        now".
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The revoked credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque scoped token (ADR-0011), presented as `Authorization: Bearer
        heyarr_…`. The header is the only place a credential is accepted: a
        `?token=` parameter would write it into every proxy log, browser history
        and Referer header between the client and here.

        Scopes are ordered — `admin` implies `write` implies `read`. Every
        route under /api/v1 requires at least `read`.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        An opaque position from a previous page's `next_cursor`. It is scoped to
        one collection: a cursor from `/works` is rejected by `/jobs` rather
        than being read as a position in a different sort order.
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Values above the maximum are clamped, not rejected.

  responses:
    BadRequest:
      description: The request is malformed or semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No credential, or one that was rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: A valid credential that does not carry the required scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        No such resource. Never an empty 200: a client cannot tell "no such
        work" from "a work with nothing in it" if both are 200, and it is the
        difference between retrying and giving up.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request contradicts current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457. Clients branch on `type` and nothing else.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlates the response with the server log line.

    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          description: Absent on the last page.

    Work:
      type: object
      required: [id, content_type, work_key, title, sort_title, attributes, created_at, updated_at]
      properties:
        id: { type: string }
        content_type: { type: string }
        work_key:
          type: string
          description: Normalised identity, so a rescan converges on the same work.
        title: { type: string }
        sort_title: { type: string }
        year: { type: [integer, "null"] }
        attributes:
          type: object
          description: |
            Per-content-type fields. They live here rather than as columns so
            that registering a fourth content type is not a migration.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Edition:
      type: object
      required: [id, work_id, label, edition_type, attributes, created_at]
      properties:
        id: { type: string }
        work_id: { type: string }
        label: { type: string }
        edition_type: { type: string }
        language: { type: [string, "null"] }
        attributes: { type: object }
        created_at: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, edition_id, source_class, role, identification_source, created_at, updated_at]
      properties:
        id: { type: string }
        edition_id: { type: string }
        library_id: { type: [string, "null"] }
        source_class:
          type: string
          enum: [managed, linked, vault]
        blob_hash:
          type: [string, "null"]
          description: |
            Null for a `linked` asset, which has no blob at all — not a mutable
            one, not a special one, none (ADR-0020). That is what keeps blob
            immutability absolute.
        source_path: { type: [string, "null"] }
        role: { type: string }
        filename: { type: [string, "null"] }
        mime: { type: [string, "null"] }
        identification_source: { type: string }
        missing_since:
          type: [string, "null"]
          format: date-time
          description: Set when the source path vanished. Not a deletion.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Blob:
      type: object
      required: [hash, size, chunked, first_seen_at]
      properties:
        hash:
          type: string
          description: "`blake3:<64 hex>` — the canonical byte identity (ADR-0005)."
        size: { type: integer, format: int64 }
        mime: { type: [string, "null"] }
        chunked: { type: boolean }
        first_seen_at: { type: string, format: date-time }

    Library:
      type: object
      required: [id, name, content_type, enabled, created_at, roots]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        roots:
          type: array
          items: { $ref: "#/components/schemas/LibraryRoot" }

    LibraryRoot:
      type: object
      required: [id, library_id, path, ingest_mode, enabled, created_at]
      properties:
        id: { type: string }
        library_id: { type: string }
        path: { type: string }
        ingest_mode: { type: string, enum: [reflink, hardlink, copy, link] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    Peer:
      type: object
      required: [id, name, site, mode, is_self, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        site: { type: string, description: The failure domain this peer is in. }
        mode: { type: string, enum: [full, partial, cache, archive, compute] }
        endpoint: { type: [string, "null"] }
        is_self: { type: boolean }
        created_at: { type: string, format: date-time }

    Replica:
      type: object
      required: [blob_hash, peer_id, state, bytes_present, updated_at]
      properties:
        blob_hash: { type: string }
        peer_id: { type: string }
        state: { type: string, enum: [present, pending, corrupt, missing] }
        bytes_present: { type: integer, format: int64 }
        verified_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, type, payload, state, priority, required_capability, run_after, attempts, max_attempts, created_at, updated_at]
      properties:
        id: { type: string }
        type: { type: string }
        payload: { type: object }
        state: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        priority: { type: integer, description: Lower runs first. }
        dedupe_key: { type: [string, "null"] }
        required_capability: { type: string }
        run_after: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        lease_owner: { type: [string, "null"] }
        lease_expires_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    Token:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    SystemInfo:
      type: object
      properties:
        build:
          type: object
          properties:
            version: { type: string }
            commit: { type: string }
            date: { type: string }
        peer:
          type: object
          properties:
            name: { type: string }
            site: { type: string }
        schema_version: { type: integer }
        database:
          $ref: "#/components/schemas/StorageInfo"
        cas:
          $ref: "#/components/schemas/StorageInfo"
        events:
          $ref: "#/components/schemas/EventsInfo"
        media:
          type: array
          description: |
            The external media toolchain THIS node resolved (ADR-0023). FFmpeg
            is optional: a node without it still scans, ingests and serves byte
            ranges, but probe and remux jobs stay pending until a worker that
            has it claims them.

            In a split-process deployment this describes the node answering the
            request, not the fleet — the worker that would claim a probe job may
            be another machine. `/api/v1/jobs` showing pending probes is the
            other half of that picture.
          items: { $ref: "#/components/schemas/ToolInfo" }
        auth_enabled: { type: boolean }

    EventsInfo:
      type: object
      description: |
        Where the event log currently is, so a client can follow the stream
        from *now* rather than replaying from sequence zero.
      properties:
        head:
          type: integer
          format: int64
          description: |
            The most recent sequence number, and a resume point: pass it as
            `?after=` on `/api/v1/events` to receive everything from here. An
            empty log reports 0, which is already what "everything" means.
        ok:
          type: boolean
          description: |
            False when the head could not be read, in which case `head` is
            meaningless. It is reported rather than 500ing because 0 is a
            legitimate head, so a client cannot otherwise tell "nothing has
            happened" from "we could not find out".

    ToolInfo:
      type: object
      properties:
        name:
          type: string
          description: The binary described, `ffprobe` or `ffmpeg`.
        available: { type: boolean }
        path:
          type: string
          description: Where it was found. Absent when unavailable.
        version:
          type: string
          description: What it reported, e.g. `7.0.2`. Absent when unavailable.
        detail:
          type: string
          description: |
            Why an unavailable tool is unavailable, in a few words — "not found
            on PATH", "did not report a version". Absent when available.

    BlobProbe:
      type: object
      properties:
        blob_hash: { type: string }
        container:
          type: string
          description: |
            ffprobe's `format_name` verbatim — a comma-separated list of every
            name the demuxer answers to, e.g. `mov,mp4,m4a,3gp,3g2,mj2`. Kept
            whole rather than reduced to one name, because which of those a
            file "is" is a question with no answer, and the planner matches by
            membership.
        format_long: { type: string }
        duration_seconds: { type: number, nullable: true }
        bitrate_bps:
          type: integer
          format: int64
          nullable: true
          description: Null when the container declared none — a Matroska file legitimately has none.
        streams:
          type: array
          items: { $ref: "#/components/schemas/ProbeStream" }
        bytes_read:
          type: integer
          format: int64
          description: What crossed the wire to answer this. §29's evidence.
        materialised:
          type: boolean
          description: |
            True when Range probing did not work and the whole blob was copied
            (§29's fallback). Counted rather than silent: a fallback nobody can
            see becomes the default without anyone noticing.
        probed_at: { type: string, format: date-time }

    ProbeStream:
      type: object
      properties:
        index: { type: integer }
        type:
          type: string
          description: video, audio, subtitle or data.
        codec: { type: string }
        profile: { type: string }
        level: { type: integer }
        width: { type: integer }
        height: { type: integer }
        frame_rate: { type: string }
        channels: { type: integer }
        sample_rate: { type: integer }
        bitrate_bps: { type: integer, format: int64 }
        language: { type: string }

    Publication:
      type: object
      description: |
        An asset that is one of §69's four containers, with what its own
        manifest declared.
      properties:
        asset_id: { type: string }
        edition_id: { type: string }
        work_id: { type: string }
        title: { type: string }
        blob_hash: { type: string }
        filename: { type: string }
        size: { type: integer, format: int64 }
        format:
          type: string
          enum: [epub, pdf, cbz, cbr]
        page_count:
          type: integer
          description: |
            Page images in a comic archive. **Absent when unread**, which is not
            the same as zero: an empty comic is a zero-page comic, and a PDF is
            a publication whose length Heyarr has not counted. Reading a PDF's
            page tree needs a PDF parser, and §69 says Heyarr does not render.
        chapter_count:
          type: integer
          description: |
            Spine items in an EPUB — its reading order, which is the closest
            thing an EPUB has to a length and is deliberately not called a page
            count. Absent when unread.
        content_url:
          type: string
          description: |
            The ordinary blob endpoint. Named here so the single-endpoint
            contract is visible in the response rather than only in ADR-0013.

    StartPlayback:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
          description: |
            Optional. Derived from the probe when omitted — watching when there
            is video, listening when there is not. Derived from the probe
            rather than the extension because a `.mkv` holding only audio is a
            legitimate thing, and calling it "watching" puts it in the wrong
            row of every continue-watching list.

    StartedPlayback:
      type: object
      properties:
        session_id: { type: string }
        plan: { $ref: "#/components/schemas/PlaybackPlan" }
        content_url:
          type: string
          description: The ordinary blob endpoint (ADR-0013).
        token:
          type: string
          description: |
            A short-lived `read` credential for that URL. **Not scoped to one
            blob** — see the endpoint description.
        expires_at: { type: string, format: date-time }

    RemuxRequest:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }

    PlanRequest:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }

    PlaybackPlan:
      type: object
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        decision:
          type: string
          enum: [direct, remux, transcode, unplayable]
        reasons:
          type: array
          description: |
            Why the decision is not DIRECT, or why nothing can be played. Empty
            for a clean DIRECT.
          items: { $ref: "#/components/schemas/PlanReason" }
        peer_id:
          type: string
          description: The replica chosen to serve from. Absent when unplayable.
        remote:
          type: boolean
          description: |
            The chosen replica is at another site. §31 prefers a local one, so
            an instance where this is usually true is one where replication is
            not working.

            **Unproven:** nothing has ever run against a second peer
            (ADR-0010), so this path is unit-tested against synthetic replicas
            and nothing more until Milestone 4.
        content_url:
          type: string
          description: |
            Where the bytes are, for a DIRECT plan. **Absent otherwise** — a
            REMUX or TRANSCODE plan has no bytes to point at yet, and offering
            the original would invite the client to play exactly what the plan
            just said it cannot.

    PlanReason:
      type: object
      properties:
        code:
          type: string
          enum:
            [no_replica, container_unsupported, video_codec_unsupported,
             audio_codec_unsupported, resolution_too_high, bitrate_too_high,
             hdr_unsupported, no_probe, remote_replica_only,
             device_declares_nothing]
          description: Stable. Clients branch on this, and a client branching on prose breaks when the prose improves.
        detail:
          type: string
          description: Prose for a human. May change.

    ConsumptionSession:
      type: object
      description: |
        One consumption of one asset by one device — watching, listening or
        reading (§67, ADR-0024).
      properties:
        id: { type: string }
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
        state:
          type: string
          enum: [created, playing, paused, stopped, completed]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: |
            **Absent** until something has been recorded — not a zero locator.
            Position zero is a real position, and a client cannot tell "at the
            very beginning" from "never played" if both render as 0.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the session first played. Null for one created and abandoned,
            which is what makes "nobody watched this" distinguishable from
            "someone watched two minutes".
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: When it reached a terminal state.

    SessionProgress:
      type: object
      description: |
        Where a session reached, as a **locator and a unit** — never a bare
        number. A page number is not a number of seconds, and storing both as
        "position" makes every reader guess which it has.
      properties:
        locator:
          type: string
          description: |
            A decimal offset for `seconds`, a decimal page number for `page`,
            or an `epubcfi(...)` expression for `cfi`. A CFI is opaque to
            Heyarr, which stores and serves publications and never renders
            them (§69).
        unit:
          type: string
          enum: [seconds, page, cfi]

    CreateConsumptionSession:
      type: object
      required: [asset_id, device_id, verb]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]

    SessionTransition:
      type: object
      required: [transition]
      properties:
        transition:
          type: string
          enum: [start, pause, resume, progress, stop, complete]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: Recorded with the transition. Usually sent with `progress`.

    DesiredItem:
      type: object
      description: |
        "This content should exist under these conditions" (§55) — the row that
        makes Heyarr more than a catalogue.

        It anchors to a **Work**, the semantic entity (§11), which exists
        whether or not any bytes do. Never to an Asset: an Asset is a file that
        exists by definition, and wanting a file you already have is not a
        coherent thing to say.
      required: [id, scope, work_id, quality_profile_id, monitor]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [work, edition]
          description: |
            How much of the work is wanted — the whole thing, or one edition of
            it (a season, a particular release, a language).

            **There is no `episode` scope, and that is a limitation rather than
            an omission.** §11 makes the *series* the Work and an edition the
            season, so an episode is an Asset — a file that exists — and there
            is no entity anywhere for an episode nobody has yet. Knowing which
            episodes *should* exist is what a metadata provider is for, and
            that is deferred out of Milestone 3.

            What this costs today, stated rather than papered over: with no
            metadata provider, content satisfaction for a series-scoped want is
            "an acceptable asset exists", **not** "every episode exists". A
            want for a series is not a completeness guarantee in this
            milestone.
        work_id:
          type: string
          description: Always set, even at edition scope.
        edition_id:
          type: string
          description: Present only at edition scope — absent, not null, at work scope.
        quality_profile_id: { type: string }
        monitor:
          type: boolean
          description: |
            "Keep looking for something better", which is **not** the same as
            wanting (§60 keeps both words). An unmonitored want that is
            satisfied is finished, terminal profile or not: the operator said
            "get me this", not "keep improving this". Running the upgrade
            workflow over unmonitored items is how *arr installations
            re-download libraries nobody asked them to touch.
        reason:
          type: string
          description: |
            Free text, never interpreted. It exists because a library
            accumulates wants and six months later nobody remembers why one is
            there.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateDesired:
      type: object
      description: |
        Name the work by `work_id` **or** `work`, and the profile by
        `quality_profile_id` **or** `quality_profile`. Supplying both of a pair
        is a `400` rather than a silent precedence rule.
      properties:
        scope:
          type: string
          enum: [work, edition]
          default: work
        work_id: { type: string }
        edition_id:
          type: string
          description: Required at edition scope, refused at work scope.
        work:
          $ref: "#/components/schemas/WorkDescriptor"
        quality_profile_id: { type: string }
        quality_profile:
          type: string
          description: The profile's name, for when a person is typing this.
        monitor:
          type: boolean
          default: true
        reason: { type: string }

    WorkDescriptor:
      type: object
      description: |
        Content named semantically, whether or not it exists. Resolved through
        the same `(content_type, work_key)` get-or-create the scanner uses, so
        wanting something and later scanning it converge on one Work.
      required: [content_type, title]
      properties:
        content_type:
          type: string
          description: "`movie`, `series`, `music`, `book`, … (§12)."
        title: { type: string }
        year:
          type: integer
          description: |
            Optional, and part of the identity when present. A year in the
            title (`"Blade Runner (1982)"`) is understood too; an explicit year
            wins, because the caller said so.

    UpdateDesired:
      type: object
      description: An omitted field is left alone. The target cannot be changed.
      properties:
        quality_profile_id: { type: string }
        quality_profile: { type: string }
        monitor: { type: boolean }
        reason: { type: string }

    QualityProfile:
      type: object
      description: |
        A quality profile (§62). It says three different **kinds** of thing,
        not three degrees of one:

        | section | meaning |
        |---|---|
        | `accept` | a **gate**. Fail one and the candidate is rejected outright, whatever else it offers. |
        | `prefer` | a **score**. Never a gate — a candidate meeting no preference at all is still acceptable, merely worse. |
        | `terminal` | a **stop condition**. The point at which the upgrade workflow has nothing left to want. |

        Collapsing any two produces the *arr behaviour §61 rejects: a
        preference that silently rejects, or an upgrade loop with no ceiling
        that never terminates because "better" is unbounded.

        An **empty `terminal` and an absent one are the same thing** — "there
        is no condition under which this profile is finished", which is legal
        and means *never stop looking*. The seeded `archival` profile is
        exactly that.
      required: [id, name, accept, prefer, terminal]
      properties:
        id: { type: string }
        name:
          type: string
          description: Unique. This is what a DesiredItem names (§55).
        description: { type: string }
        accept:
          type: array
          description: Gates. Every one must pass.
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          description: Scored. None is required; each contributes its weight.
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          description: |
            Stop conditions. **All** must hold for a candidate to be terminal.
            Empty means this profile is never finished.
          items: { $ref: "#/components/schemas/QualityRule" }
        seeded:
          type: boolean
          description: |
            Came from Heyarr's defaults rather than from an operator. Seeding
            converges on the name and never overwrites, so an edited default
            stays edited — this is how you can tell you are looking at one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WriteQualityProfile:
      type: object
      description: |
        On `POST`, an omitted section is empty. On `PUT`, an omitted section is
        **left alone** and a section sent as `[]` is **cleared**.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        accept:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }

    QualityRule:
      type: object
      description: |
        One assertion about a release: an attribute, a comparison and an
        operand. The same shape serves all three sections — what differs is
        what a failure *means*, and that belongs to the section rather than to
        the rule. One rule type is what lets §63 report all three the same way.

        The attribute vocabulary is **closed**, so a rule can be validated when
        it is written rather than when it is evaluated. Adding an attribute is
        a code change, which is correct: something has to know how to extract
        it from a release, and an attribute nothing populates is a rule that
        silently never matches.
      required: [attribute, op, value]
      properties:
        attribute:
          type: string
          enum:
            [
              audio_channels,
              audio_codec,
              hdr,
              language,
              resolution,
              size_bytes,
              source,
              video_codec,
            ]
          description: |
            `resolution` is vertical lines (480, 720, 1080, 2160) rather than a
            label, because "4K", "2160p" and "UHD" are three spellings of one
            number.

            `source` is **not ordered**, even though there is an obvious
            quality ordering among `remux`, `bluray`, `web-dl` and the rest. An
            ordering here would be a second scoring system living outside
            `prefer`, invisible to §63's reasons — the opaque scoring §61
            rejects. Say "bluray beats webrip" with two preferences instead,
            and it appears in the explanation.
        op:
          type: string
          enum: [eq, neq, gte, lte, in, nin]
          description: |
            `gte` and `lte` are numbers only; `in` and `nin` are names only. A
            comparison that does not apply to the attribute's type is a `400`,
            as is a list operand with `eq` — which would otherwise validate and
            then silently match nothing.
        value:
          description: |
            A bare JSON value whose shape follows the attribute: a whole number,
            a name, a list of names (for `in`/`nin`), or a boolean. The kind is
            read from the JSON and then checked against the attribute, never
            coerced — so `"1080"` against `resolution` is a caught typo rather
            than a working rule.
          oneOf:
            - type: integer
            - type: string
            - type: boolean
            - type: array
              items: { type: string }
        weight:
          type: integer
          description: |
            The score contribution, meaningful **only** in `prefer`. May be
            negative — a penalty is a real thing to want. May not be zero: a
            preference that cannot affect the score is indistinguishable from
            an absent one, and keeping it means an operator believes something
            is being preferred when nothing is.

            A weight on an `accept` or `terminal` rule is a `400`, not an
            ignored field. It is the mistake this design most invites, and
            silently dropping it would leave an operator believing a gate is
            scoring.

    Device:
      type: object
      description: A registered device and the capabilities it declares (§68).
      properties:
        id: { type: string }
        device_key:
          type: string
          description: |
            The client's own stable identifier, and the idempotency key for
            registration. Not a credential and never checked as one.
        name: { type: string }
        platform:
          type: string
          description: Free text — `tvos`, `android`, `web`.
        profile: { $ref: "#/components/schemas/DeviceProfile" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: |
            When this device last registered. The only thing that makes a stale
            row identifiable later.

    DeviceProfile:
      type: object
      description: |
        What a device says it can play. A zero maximum means **no limit
        stated**, which is deliberately different from a limit of zero: a
        client that omits `max_bitrate_bps` is not claiming it can play
        nothing.
      properties:
        containers:
          type: array
          items: { type: string }
        video_codecs:
          type: array
          items: { type: string }
        audio_codecs:
          type: array
          items: { type: string }
        max_width: { type: integer }
        max_height: { type: integer }
        max_bitrate_bps: { type: integer, format: int64 }
        supports_hdr: { type: boolean }

    RegisterDevice:
      type: object
      required: [device_key, name]
      properties:
        device_key: { type: string }
        name: { type: string }
        platform: { type: string }
        profile: { $ref: "#/components/schemas/DeviceProfile" }

    StorageInfo:
      type: object
      properties:
        path: { type: string }
        ok: { type: boolean }

    Readiness:
      type: object
      properties:
        status: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
