# The Heyarr JSON API (spec §77).
#
# This document is written by hand and kept honest by a test, not generated
# (ADR-0015). internal/controller/openapi_test.go walks the real router and
# asserts parity in both directions: a route that is served and not documented
# fails, and an operation documented here that is not served fails too.
#
# So: add a route, add it here. The test tells you the exact string to write —
# `go test -run TestRouteInventory -v ./internal/controller`.
#
# Paths are absolute rather than relative to a /api/v1 server URL, because
# /healthz, /readyz and /metrics are real routes that live outside it. With a
# prefixed server URL those three could not be written down at all, and the
# parity test would have to be taught to ignore them — which is the same thing
# as not checking them.
openapi: 3.1.0

info:
  title: Heyarr
  version: "1"
  summary: Headless content lifecycle, replication and consumption for homelabs.
  description: |
    Every error is an RFC 9457 problem document with a stable `type` URI. Clients
    branch on `type` — not on the title, not on the detail, and not on the HTTP
    status alone, which several different conditions share.

    Collections are paginated by keyset with an opaque cursor. `next_cursor` is
    absent on the last page, so "keep going while next_cursor is set" is the
    whole client loop. The cursor's contents are not a contract: it encodes the
    sort key of the last row returned, and a client that parses it breaks the
    first time a sort order changes.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8385
    description: The default loopback bind (ADR-0011).

security:
  - bearerAuth: []

tags:
  - name: content
    description: Works, editions, assets and the libraries they come from.
  - name: bytes
    description: Blob metadata. The bytes themselves are a separate contract (ADR-0013).
  - name: fabric
    description: Peers and replicas.
  - name: operations
    description: Jobs, events, credentials and system state.
  - name: policy
    description: Quality profiles — the standard desired state is measured against (§62).
  - name: desired
    description: What should exist, whether or not it does yet (§55).
  - name: providers
    description: The centralised registry of external services — indexers, download clients (§59).
  - name: mcp
    description: Semantic actions for agents, over JSON-RPC (§71, ADR-0019).
  - name: peer
    description: |
      The inter-peer surface. A SEPARATE listener with a separate credential:
      mutual TLS pinned to peer membership (§26, ADR-0012). No bearer token is
      accepted here and no peer certificate authenticates anything under
      /api/v1.

paths:
  /healthz:
    get:
      tags: [operations]
      operationId: healthz
      summary: Liveness.
      description: |
        This process is running and its HTTP stack works. It checks nothing else
        on purpose: a liveness probe that fails because the database is busy
        causes a restart loop that makes the database busier.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [operations]
      operationId: readyz
      summary: Readiness.
      description: |
        Whether this process can actually serve requests. Deliberately free of
        anything an unauthenticated caller should not learn — no paths, no
        versions, no counts.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Prometheus metrics.
      description: |
        Authenticated exactly like the API and requiring `read`. Route names,
        library sizes and request patterns are not "just metrics".
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system:
    get:
      tags: [operations]
      operationId: getSystem
      summary: What this node is, what it is running, and how far that has drifted.
      description: |
        The `drift` object answers "how far behind is this instance", and it
        answers with a distance rather than a boolean. A deployment once ran 36
        commits and seven unapplied migrations behind `main`, across two whole
        milestones, and nothing reported it — every input to the check already
        existed and nothing compared them.

        The SCHEMA half needs nothing from the caller: a binary embeds its own
        migrations, so it already knows the highest version that exists and can
        compare that against what is applied. Pass `expected_schema` to compare
        against something else instead.

        The BUILD half cannot be answered alone — a binary has no idea what
        release was supposed to be deployed — so the expectation is supplied per
        request. Without it the build half reports `unknown`, which is
        deliberately not `current`: a check that has quietly stopped comparing
        must not look like a fleet that never drifts.
      parameters:
        - name: expected_version
          in: query
          schema: { type: string }
          description: |
            The version this instance was expected to be running, e.g. `v1.4.0`.
            Ordering is by semantic version when both sides carry one; otherwise
            `expected_commit` decides whether the builds are the same build.
        - name: expected_commit
          in: query
          schema: { type: string }
          description: |
            The commit this instance was expected to be built from. Matched by
            prefix, with a floor of seven characters, so an abbreviated stamp
            still matches its full form.
        - name: expected_schema
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            The schema version its database was expected to be at. Defaults to
            the highest migration THIS binary embeds. A value that is not a
            non-negative integer is rejected rather than ignored: falling back
            to the default would answer a question nobody asked and report
            `current` for it.
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works:
    get:
      tags: [content]
      operationId: listWorks
      summary: Page the catalog.
      description: |
        Ordered by `(sort_title, id)`. The id is in the sort key because
        sort_title is not unique, and a non-unique keyset boundary skips and
        repeats rows exactly as OFFSET does.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
          description: Restrict to one content type.
        - name: library_id
          in: query
          schema: { type: string }
          description: Works with at least one asset in this library.
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over `sort_title`.
      responses:
        "200":
          description: A page of works.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works/{id}:
    get:
      tags: [content]
      operationId: getWork
      summary: One work.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/editions/{id}:
    get:
      tags: [content]
      operationId: getEdition
      summary: One edition.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The edition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/assets:
    get:
      tags: [content]
      operationId: listAssets
      summary: Page the files.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: library_id
          in: query
          schema: { type: string }
        - name: content_type
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [present, missing] }
          description: |
            `missing` is an asset whose source path has vanished. It is not a
            deletion: the catalog row and any blob both remain (ADR-0018).
      responses:
        "200":
          description: A page of assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/assets/{id}:
    get:
      tags: [content]
      operationId: getAsset
      summary: One asset.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [content]
      operationId: deleteAsset
      summary: Delete an asset. Requires `write`.
      description: |
        Logical, per ADR-0018. The asset stops existing; its blob does not. A
        later `gc_blobs` sweep reclaims blobs that no asset references, once a
        grace window has passed — which is what makes a mistaken delete
        reversible. Nothing is unlinked inside this request.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204":
          description: Deleted. No bytes were removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries:
    get:
      tags: [content]
      operationId: listLibraries
      summary: Page the libraries, each with its roots.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over the name.
      responses:
        "200":
          description: A page of libraries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [content]
      operationId: createLibrary
      summary: Create a library. Requires `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content_type]
              additionalProperties: false
              properties:
                name: { type: string }
                content_type: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/libraries/{id}:
    get:
      tags: [content]
      operationId: getLibrary
      summary: One library, with its roots.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries/{id}/roots:
    post:
      tags: [content]
      operationId: createLibraryRoot
      summary: Add a root to a library. Requires `write`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string }
                ingest_mode:
                  type: string
                  enum: [reflink, hardlink, copy, link]
                  default: reflink
                  description: |
                    How ingest materialises bytes into the CAS (ADR-0014).
                    `link` catalogues files where they are and never copies them
                    (ADR-0020).
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRoot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/libraries/{id}/scan:
    post:
      tags: [content]
      operationId: scanLibrary
      summary: Enqueue a scan. Requires `write`.
      description: |
        One `scan_library` job per enabled root, because the scanner's job is
        root-scoped. A library with two roots therefore yields two jobs, and a
        client waiting on the scan must wait on all of them — waiting on the
        first only is how a CLI exits 0 with half the library unscanned.

        Enqueueing is idempotent while a scan of the same root is still live: a
        second request returns the running job rather than queueing a second
        walk of the same tree (ADR-0008).
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "202":
          description: Accepted; the jobs are queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_id: { type: string }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The library has no enabled roots, so there is nothing to scan.
            Returning 202 here would let a client believe a scan is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/blobs/{hash}:
    get:
      tags: [bytes]
      operationId: getBlob
      summary: Blob metadata.
      description: |
        Metadata only. The bytes are served by `/api/v1/blobs/{hash}/content`,
        which is deliberately a separate contract with four consumers
        (ADR-0013).
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: The blob record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/blobs/{hash}/content:
    parameters:
      - name: hash
        in: path
        required: true
        description: The BLAKE3 digest that names the blob, as `blake3:<64 lowercase hex characters>`.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [bytes]
      operationId: getBlobContent
      summary: Serve a blob's bytes, whole or by range.
      description: >-
        The byte-serving contract of spec §28, and deliberately one endpoint
        with four consumers: direct playback, remote ffprobe (§29),
        replication, and HTTP web-seeding (§27). See ADR-0013 — it is not "the
        playback endpoint" and must not be tuned as one.


        The response carries a strong `ETag` derived from the content, and
        `Cache-Control: public, max-age=31536000, immutable`. Immutable caching
        is correct here rather than risky because the URL is the digest: this
        path can never mean different bytes. No `Last-Modified` is sent —
        a modification time is a property of one peer's copy, and two peers
        holding identical bytes must advertise identical validators.


        The media type is always `application/octet-stream`: the content store
        knows the digest and the length and nothing else. What the bytes mean
        is catalog metadata.
      parameters:
        - name: download
          in: query
          required: false
          description: >-
            `1`, `true` or `yes` adds `Content-Disposition: attachment`. The
            bytes, ranges and validators are identical either way.
          schema:
            type: string
      responses:
        '200':
          description: The whole blob.
          headers:
            ETag:
              description: '`"blake3-<hex digest>"`.'
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Cache-Control:
              schema: { type: string }
            Content-Disposition:
              description: Present only when `download` was requested.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The requested range or ranges.
          headers:
            Content-Range:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404':
          description: This peer holds no such blob. Ask another peer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '416':
          description: The requested range lies outside the blob.
          headers:
            Content-Range:
              description: '`bytes */<size>`.'
              schema: { type: string }
    head:
      tags: [bytes]
      operationId: headBlobContent
      summary: Report a blob's size and range support without transferring it.
      description: >-
        Identical to `get` in every header, with no body. This is how a remote
        prober or a replication client learns the length and confirms range
        support before it starts.
      responses:
        '200':
          description: The blob exists; `Content-Length` is its size.
          headers:
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Content-Length:
              schema: { type: integer, format: int64 }
        '206':
          description: The blob exists and the requested range is satisfiable.
          headers:
            Content-Range:
              schema: { type: string }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '416':
          description: The requested range lies outside the blob.

  /api/v1/peers:
    get:
      tags: [fabric]
      operationId: listPeers
      summary: Page the peers.
      description: |
        A paginated collection even though Milestone 1 has exactly one peer
        (ADR-0010). A client written against a single-object response would have
        to be rewritten for Milestone 4, and the ones that are not keep showing
        one peer.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: mode
          in: query
          schema: { type: string, enum: [full, partial, cache, archive, compute] }
      responses:
        "200":
          description: A page of peers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Peer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [fabric]
      operationId: createPeer
      summary: Enrol a peer, or move an existing member's endpoint.
      description: |
        Peer enrolment is operator-mediated and explicit (§26, ADR-0012). There
        is no discovery, no join token and no trust on first use: an operator
        reads the other node's public key out of `GET /api/v1/peers` at that
        site and posts it here, and the operator at the other site does the
        same in the other direction.

        The public key decides what this does. A key nobody holds is an
        enrolment and answers `201` with a `Location`. A key this instance
        already pins is the same peer, and the request may move its `endpoint`,
        `site` or `mode` — that answers `200`, because nothing was created and
        a client treating `201` as "a peer joined" would count it twice. A key
        already pinned to a peer with a DIFFERENT name is refused: a peer is
        its key, not its name.

        Admin, not write, and for a stronger reason than the token endpoints:
        membership is the only trust root in the inter-peer path, so a
        credential that could enrol a peer could hand a complete replica of the
        library to a machine of its choosing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeerRegistration" }
      responses:
        "201":
          description: The peer was enrolled.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "200":
          description: |
            The key was already a member. Its endpoint, site or mode may have
            moved; its identity did not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "400":
          description: |
            The public key is missing, or malformed — the wrong algorithm
            prefix, not lowercase hex, or not 32 bytes.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            The key is registered to another peer, the name is taken by a peer
            with a different key, or the registration claimed to be this node
            and this node already exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: |
          The peer's id or its name. Both, because an operator holds whichever
          of the two they were shown, and a lookup that accepted only the id
          would send them to the list first — which is the step that gets
          skipped when the thing being looked up is about to be removed.
    get:
      tags: [fabric]
      operationId: getPeer
      summary: Show one peer.
      responses:
        "200":
          description: The peer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [fabric]
      operationId: deletePeer
      summary: Revoke a peer's membership.
      description: |
        ADR-0012: "Revocation is removing a membership record." There is no
        revocation list and no certificate to expire — the record IS the trust,
        so deleting it withdraws the trust.

        Membership is consulted on every request rather than at process start,
        so a removed peer stops being able to read bytes immediately, on the
        connection it is already holding open. The peer's `replicas` rows go
        with it: a peer this instance will not talk to is not a peer whose copy
        counts towards placement.

        It answers with the record it removed rather than `204`, so that "did I
        revoke the right peer?" is not a question answered by re-reading the
        list you just changed. This node cannot remove itself.
      responses:
        "200":
          description: The membership record that was revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The peer is this node, which cannot revoke itself.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/replicas:
    get:
      tags: [fabric]
      operationId: listReplicas
      summary: Page the replicas.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [present, pending, corrupt, missing] }
        - name: peer_id
          in: query
          schema: { type: string }
        - name: blob_hash
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of replicas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Replica" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/blobs/{hash}/probe:
    get:
      tags: [content]
      operationId: getBlobProbe
      summary: What ffprobe said about a blob's bytes.
      description: |
        Hangs off the blob rather than the asset because a probe describes
        **bytes**, and bytes are identity: two assets sharing a blob share one
        probe (§29, invariant 1).

        A blob with no probe is **404, not an empty 200**. "We have not probed
        this" and "this has no streams" are different answers, and a client
        that cannot tell them apart cannot decide whether to wait — which is
        exactly the state every blob is in on a node with no ffprobe
        (ADR-0023).

        `bytes_read` and `materialised` are how the probe was obtained, exposed
        so §29 is auditable in a running deployment. An instance where every
        probe materialised is one where remote probing is silently not working,
        and the only other symptom is that it feels slow.
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobProbe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/publications:
    get:
      tags: [content]
      operationId: listPublications
      summary: Page publications — EPUB, PDF, CBZ and CBR.
      description: |
        Heyarr **stores and serves** publications; it does not render them
        (§69). Clients render.

        This is the catalog view: enough to tell an EPUB from a CBZ, and how
        long it is, without downloading it first. The bytes come from
        `/api/v1/blobs/{hash}/content` like everything else — ADR-0013 makes
        that one endpoint with several consumers, and a reader is another one,
        not another endpoint.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: format
          in: query
          schema:
            type: string
            enum: [epub, pdf, cbz, cbr]
      responses:
        "200":
          description: A page of publications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/publications/{id}:
    get:
      tags: [content]
      operationId: getPublication
      summary: One publication, by ASSET id.
      description: |
        Keyed by asset rather than blob. The metadata is stored against the
        blob because it describes the bytes, but a client holds an asset: one
        blob can be two assets with two filenames in two libraries, and "which
        publication" is a question about a *use* of the bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playback:
    post:
      tags: [playback]
      operationId: startPlayback
      summary: Plan, open a session, and return somewhere to play from.
      description: |
        The one call a client makes when someone presses play.

        **The controller stays out of the content data path (§32).** It returns
        a direct URL to the peer holding the replica; it does not proxy bytes.
        A controller that proxied would make playback's availability depend on
        its own, which is exactly the coupling §53's degraded-operation model
        exists to avoid — a Full Peer must keep streaming when the controller
        has gone.

        The URL is `/api/v1/blobs/{hash}/content`, unchanged. ADR-0013's
        consequences forbid "adding a player-shaped session token" to it, so
        playback gets no byte route, no auth scheme and no signed URL of its
        own — it gets a short-lived credential and the same endpoint
        replication and the BitTorrent web-seed use.

        **The credential is scoped to `read` and expires, but is not scoped to
        one blob.** A client holding one can read any blob until it expires.
        Per-blob scoping is a *grant* (§77's `/grants`), which is a later
        milestone with principals behind it; inventing a lesser version here
        would be a second authorisation model to reconcile with the real one.

        **Anything that is not DIRECT is a 409** carrying the planner's first
        reason, not a 501. The request is well-formed and the asset is real;
        what cannot happen is this pairing of asset and device. No session is
        opened — a session for a playback that cannot happen is state nobody
        will clean up, and it would appear in "continue watching" for something
        nobody watched. `POST /playback/plan` has the full rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartPlayback" }
      responses:
        "201":
          description: The session, the plan, and where to play from.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedPlayback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The plan is not DIRECT, or nothing holds the bytes. No session was
            opened.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/remux:
    post:
      tags: [playback]
      operationId: enqueueRemux
      summary: Queue a remux for an asset a device cannot take as it is (§10, §75).
      description: |
        Rewraps the encoded streams into a container the device declares. It
        does **not** re-encode: `-c copy` is the whole contract, and Milestone
        2 has no quality ladder, no HLS or DASH segmenting and no transcode.

        **Separate from `POST /playback` deliberately.** A remux is minutes of
        work and disk; starting one because a client asked what it could play
        would let a browsing client fill a disk. When to spend that is a policy
        question, and policy is §55's.

        Only a **REMUX** plan is actionable. A DIRECT plan needs no work, and a
        TRANSCODE plan would produce a remux that still does not play — a
        failure the client would discover only after waiting for it. Both are
        409.

        Returns the job. Poll `/jobs/{id}` or follow `job.*` on the event
        stream, then re-plan.

        The output is recorded as an **Asset** with role `derived` on the same
        Edition, so replication, integrity and garbage collection treat it like
        any other managed asset. That means it will be replicated and will be
        reclaimed when nothing references it — both correct, neither free.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemuxRequest" }
      responses:
        "202":
          description: The remux was queued.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  container: { type: string, enum: [mp4, mkv] }
                  asset_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The plan is not REMUX, so there is nothing useful to queue.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/plan:
    post:
      tags: [playback]
      operationId: planPlayback
      summary: What should this device do with this asset? (§68)
      description: |
        DIRECT, REMUX, TRANSCODE — or `unplayable` when nothing holds the bytes.

        **It writes nothing and opens no session.** A client shows a "play"
        button by planning and opens a session when someone presses it; if
        planning created state, every hover would too.

        The `reasons` are the point. "Why is my television transcoding this" is
        the single most common question this class of software is asked, and a
        planner that answers only with a verb cannot answer it. Codes are
        stable strings because clients branch on them; `detail` is prose for a
        human and may change.

        **Media nothing has probed plans DIRECT**, with a `no_probe` reason
        saying the plan is a guess. The conservative-looking answer is
        TRANSCODE and it is wrong: a node with no probes is precisely a node
        with no ffprobe (ADR-0023), which cannot transcode either — so
        planning TRANSCODE there would make the entire library unplayable,
        while DIRECT makes most of it work and fails visibly when it does not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/consumption/sessions:
    get:
      tags: [playback]
      operationId: listConsumptionSessions
      summary: Page consumption sessions, newest first.
      description: |
        `?state=resumable` is the **"continue watching"** query: every session
        that has not reached a terminal state, most recently touched first, for
        watching, listening and reading alike (§67).

        It is a named filter rather than `state=created,playing,paused` because
        "resumable" is the question clients actually ask, and spelling it as
        three states would put the state machine's shape into every client.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [resumable, created, playing, paused, stopped, completed]
        - name: asset_id
          in: query
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: createConsumptionSession
      summary: Open a consumption session.
      description: |
        One model covers watching, listening and reading (§67, ADR-0024). The
        session starts in `created` — a real state, not a formality: the gap
        between "I intend to watch this" and "bytes are moving" is where the
        planner runs, and collapsing it makes an abandoned plan
        indistinguishable from a playback that stalled instantly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumptionSession" }
      responses:
        "201":
          description: The session.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/consumption/sessions/{id}:
    get:
      tags: [playback]
      operationId: getConsumptionSession
      summary: One session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/consumption/sessions/{id}/transitions:
    post:
      tags: [playback]
      operationId: transitionConsumptionSession
      summary: Move a session through its state machine.
      description: |
        One endpoint rather than six (`/start`, `/pause`, `/resume`, …),
        because the state machine is one thing: six endpoints would each need
        to know the transition table, and the first one to disagree with it
        would be a session in a state the domain says is impossible.

        Every transition emits a `playback.session.*` event, inside the same
        transaction that wrote the row (invariant 7, ADR-0009).

        An illegal transition — resuming a completed session, progressing a
        stopped one — is **409**, not 400. The request is well-formed and would
        be legal against a different state, and a client cannot tell "you sent
        nonsense" from "you are out of date" if both are 400. Only the second
        is fixed by re-reading the session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionTransition" }
      responses:
        "200":
          description: The session after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The transition is illegal from the session's current state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/devices:
    get:
      tags: [playback]
      operationId: listDevices
      summary: Page the registered devices.
      description: Ordered by `(name, id)`.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: registerDevice
      summary: Register a device, or update the one already registered.
      description: |
        An **upsert on `device_key`**, not a create. An app announces itself on
        every launch; if that created a row each time, this collection would
        fill with duplicates named "Living Room" and the playback planner would
        be choosing between four thousand copies of one television.

        `201` with a `Location` header the first time, `200` afterwards.

        A device here is a **capability profile, not an identity** (§68).
        Nothing in it is a credential and nothing is authenticated: Heyarr has
        no way to interrogate a television, so a client declares what it can
        play and Heyarr believes it. Device enrolment, keypairs and key
        recovery are ADR-0022 and Milestone 8.

        Codec and container names are lower-cased, trimmed and de-duplicated,
        so two clients spelling one capability differently converge rather than
        producing a planner that matches one device and not its identical twin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDevice" }
      responses:
        "200":
          description: The device already existed; its profile was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: A new device.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{id}:
    get:
      tags: [playback]
      operationId: getDevice
      summary: One device.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired:
    get:
      tags: [desired]
      operationId: listDesired
      summary: Page what should exist.
      description: |
        Ordered by `(created_at, id)`. A want has no name to sort by, and the
        interesting order is the order things were asked for.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: scope
          in: query
          schema: { type: string, enum: [work, edition] }
        - name: monitor
          in: query
          description: Only monitored, or only unmonitored, wants.
          schema: { type: string, enum: ["true", "false"] }
        - name: work_id
          in: query
          schema: { type: string }
        - name: quality_profile_id
          in: query
          schema: { type: string }
        - name: upgradable
          in: query
          description: |
            Which wants are in a state where an upgrade **could** happen — the
            listing question §71's `get_upgrade_candidates` asks.

            Answered from **state alone**: monitored, content satisfied, and
            holding bytes. It deliberately does not score anything, because
            whether a want has reached its profile's *terminal* condition needs
            the incumbent re-evaluated against the profile — a join and a
            scorer per row, which would run the evaluator hundreds of times to
            render one page.

            So this filter is the **cheap half** of eligibility and is a
            superset: a want that is monitored and satisfied but already
            terminal appears here. `GET /desired/{id}/satisfaction` reports the
            terminal test per want, and the `upgrade_scan` job applies it.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: A page of desired items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [desired]
      operationId: createDesired
      summary: Want something.
      description: |
        **A want must work when you have nothing.** That is the whole point of
        this endpoint and the requirement most easily lost: every fixture in
        this repository has assets, so a design that only works once something
        exists passes every test and fails the first real use.

        Name the work either by `work_id`, or — when it does not exist yet — by
        a `work` descriptor of content type, title and year. The descriptor
        resolves through the **same** `(content_type, work_key)` get-or-create
        the scanner uses, so wanting a film and later scanning it converge on
        one Work rather than producing two.

        Name the quality profile by `quality_profile_id` or by
        `quality_profile` (its name) — a person writing this by hand knows
        `living-room`, not a UUID. A profile is **required**: "this should
        exist", with no statement of what would count as existing, cannot be
        evaluated (§56).

        `monitor` defaults to **true**. Wanting something and then silently
        never looking for anything better is the surprising default.

        Two wants over the same target with **different** profiles are legal
        and are the point (§61 — never one version per title): the living-room
        copy and the phone-sized copy are two wants. The same target with the
        same profile is one want written twice, and is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDesired" }
      responses:
        "201":
          description: The want.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That content is already wanted under that profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}:
    get:
      tags: [desired]
      operationId: getDesired
      summary: One desired item.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The want.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [desired]
      operationId: updateDesired
      summary: Change the conditions, the monitoring or the note.
      description: |
        An omitted field is left alone.

        **The target cannot be changed.** Repointing a want at different
        content is not an edit, it is a different want, and allowing it would
        make the acquisition history attached to this row describe something
        else. Delete it and want the other thing.

        A request that changes nothing emits no event.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDesired" }
      responses:
        "200":
          description: The want as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new profile would duplicate an existing want.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [desired]
      operationId: deleteDesired
      summary: Stop wanting something.
      description: |
        Physical, matching quality profiles and for the same reason: a want is
        a statement of intent, not bytes. ADR-0018's logical-delete stance
        exists to stop shared, expensive, unrecoverable bytes being unlinked
        inline, and none of that applies here — an operator who says they no
        longer want something should find it gone.

        The `desired.removed` event carries the target, not only the row id, so
        the log still says what was wanted after the row is gone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: No longer wanted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/candidates:
    get:
      tags: [desired]
      operationId: listCandidates
      summary: What the last search found, and why each release was judged so.
      description: |
        §63 says evaluation is deterministic and **inspectable**. This is the
        inspectable half: an evaluation that lived in memory for two hundred
        milliseconds is deterministic and cannot answer "why did it pick that
        release, last Tuesday, at 3am".

        The **rejections matter more than the acceptance**. A search that found
        twelve releases and took none of them leaves twelve explained refusals
        here, because a want that simply goes quiet is the failure mode §60
        keeps explainable rejection reasons to avoid.

        It reads what the last search **stored**, and deliberately does not
        re-search or re-score. Re-running the scorer would answer a different
        question — what would be decided *now* — and that substitution is
        exactly what makes an audit trail worthless.

        Ordered best first, by the same total order the scorer ranks by:
        accepted above rejected, then score descending, then the provider's
        candidate id. The listing and the selection therefore cannot disagree
        about which is best.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The candidates, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/search:
    post:
      tags: [desired]
      operationId: searchDesired
      summary: Look for releases that would satisfy this want, now.
      description: |
        §60's **manual search** — the same job the schedule runs, triggered by
        a person, with the results visible whether or not anything was
        acceptable.

        **Enqueues** a job; it does not run one. A search is a job (invariant
        4, ADR-0002) and the worker that runs it may be another process, so
        this answers `202` rather than pretending to be the worker — and rather
        than holding a request open across a provider round trip an indexer may
        take thirty seconds to refuse.

        Deduped per want, so asking repeatedly while one is queued yields one
        job. Per want rather than globally: two wants should be searched
        concurrently, and collapsing them would make a library of two hundred
        wants take two hundred sequential searches to make one pass.

        On a node with **no indexer** the job stays *pending and visible*
        rather than failing (ADR-0025) — it is work waiting for a capability,
        not work that went wrong.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/select:
    post:
      tags: [desired]
      operationId: selectCandidate
      summary: Take this release, whatever the ranking says.
      description: |
        §60's **manual override**, and it is a different feature from manual
        search: a search asks what is out there, an override says which one to
        take.

        It **records that it was an override**, and what the scorer had chosen
        instead. An override that left no trace would look exactly like an
        ordinary selection, and "why did it take that one" would then have no
        answer — which is the property §60's deterministic scoring exists to
        give.

        ### It refuses a candidate the profile rejected

        A `409`, deliberately. The gates in §62 are the operator's own
        statement of what is acceptable, and an override that could ignore them
        would quietly turn `accept` into a suggestion. Wanting something
        outside the profile is perfectly expressible — by **changing the
        profile**, which is visible and durable, rather than by a one-off that
        leaves the profile saying something nobody means.

        Naming the candidate the scorer already chose is a selection rather
        than an override, and is not recorded as a disagreement: putting a
        departure in the audit trail that never happened is its own kind of
        wrong.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id]
              properties:
                candidate_id:
                  type: string
                  description: |
                    The **provider's** id for the release, as returned by
                    `/candidates`.
      responses:
        "200":
          description: The chosen candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No candidate with that id for this want — it may have been
            superseded by a later search.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: That candidate was rejected by the quality profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}/acquisitions:
    post:
      tags: [desired]
      operationId: adoptAcquisition
      summary: Adopt bytes that have already arrived (§65).
      description: |
        "These bytes are here, they answer this want, take them."

        §65 lists many ways bytes arrive, and a polled download client is only
        the ordinary one. A client Heyarr does **not** poll is an ordinary
        situation too: a transfer that finished before Heyarr knew about it,
        something fetched by hand, or a client the registry has no integration
        for.

        The pipeline afterwards is **identical** to the polled path — the same
        verification, the same ingest job, the same §64 edges. The only thing
        that differs is who noticed the transfer had finished.

        `local_path` is where the bytes are **in a namespace Heyarr can open**,
        not the download client's. Path mapping is the poller's job and there
        is no client here to map from.

        This is deliberately **not an upload**: Heyarr is told where the bytes
        already are rather than receiving them. An upload is a different §65
        source with a different shape, and conflating them would put a
        multi-gigabyte body on an endpoint whose whole job is a path.

        Answers `202`: the hash and the ingest are a job, because hashing a
        large file is real work and the worker that does it may be another
        process (invariant 4).

        Adopting the same transfer twice is harmless — the acquisition is keyed
        on `(provider, external_id)` and the ingest job is deduped per want.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id, local_path]
              properties:
                provider:
                  type: string
                  description: |
                    What produced the bytes. Free text: this endpoint exists
                    precisely for clients the registry does not know about.
                external_id:
                  type: string
                  description: |
                    That producer's identifier — an infohash, a job id. It is
                    what makes adopting the same transfer twice idempotent
                    rather than duplicative.
                external_name: { type: string }
                local_path:
                  type: string
                  description: Where the bytes are, in Heyarr's own namespace.
      responses:
        "202":
          description: Queued for verification and ingest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  phase: { type: string }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That want already has an acquisition in flight.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}/satisfaction:
    get:
      tags: [desired]
      operationId: getSatisfaction
      summary: Why a want is, or is not, satisfied.
      description: |
        The acquisition state on a `DesiredItem` says **what** the answer is.
        This says **why** — and it is what makes "I have this film, why does
        Heyarr say it is missing" answerable, which is the question this axis
        gets asked most often.

        It **reconciles** rather than reading a cached answer, for the same
        reason the evaluation endpoint scores rather than replays: an
        explanation that might be minutes stale is one nobody can trust while
        they are looking at a file they can see on disk.

        Per want rather than inlined on the listing, because a page of fifty
        wants would carry fifty evaluations of several rules each.

        ### The two axes are evaluated separately (§56)

        Content asks "do we hold bytes the quality profile accepts?" — and
        **existing is not satisfying**: a 480p rip under a 1080p-minimum
        profile is content *present* and content *not satisfied*. Conflating
        them makes the upgrade workflow unreachable.

        Placement asks "are those bytes on every Full Peer that should hold
        them?", and it is asked only of **the bytes that satisfy** — asking it
        of a rejected copy would report a want as fully satisfied because the
        wrong file is well replicated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Both axes, with reasons.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Satisfaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/reconcile:
    post:
      tags: [desired]
      operationId: reconcileDesired
      summary: Ask for this want to be re-examined.
      description: |
        **Enqueues** a job; it does not run one. Reconciliation is a job
        (invariant 4, ADR-0002) and the worker that runs it may be another
        process, so this answers `202` rather than pretending to be the worker.

        Deduped per want, so asking repeatedly while one is queued yields one
        job. Reconciliation also runs on a beat and when a want is created, so
        this is for impatience rather than for correctness.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: What external services are configured, and whether they work.
      description: |
        §59 centralises provider configuration. Content types do not maintain
        separate registries — a new provider kind is a new **capability** here,
        never a second registry (§61, §83).

        ### Why this endpoint exists

        A node with no indexer and no download client is a **supported, tested
        configuration** (ADR-0025): it scans, ingests, catalogues, verifies,
        serves ranges and plays, and search and acquire jobs sit *pending and
        visible* rather than failing. The cost of that design is that "why is
        nothing being acquired?" has an entirely legitimate answer which is
        invisible unless something reports it. This is that report.

        ### No credential is ever returned

        Not the API key, not an endpoint with credentials embedded in it, not a
        length-preserving hint. What an operator needs is which provider, what
        it can do, and whether it works.

        ### Health is observed, not asserted

        `healthy` is what the last check **found**, by exercising the provider
        — a provider that reported itself healthy because it was configured
        would be advertising something it might not deliver, and work would
        route to it and then fail.

        An **absent `checked_at` means never checked**, which is deliberately
        distinct from `healthy: false`: "nobody has looked" and "we looked and
        it is broken" lead to different actions. The same distinction §56's
        satisfaction axes make.

        Health is read from the database rather than from the answering
        process's memory, because under ADR-0002 the worker that ran the check
        may be another machine.
      responses:
        "200":
          description: Every configured provider, and what this node can therefore do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp:
    post:
      tags: [mcp]
      operationId: mcpRPC
      summary: MCP, as JSON-RPC 2.0 over a single endpoint.
      description: |
        Model Context Protocol (§71, ADR-0019). One route, because MCP
        multiplexes over JSON-RPC methods rather than over paths.

        Mounted here rather than on a server of its own so it inherits this
        API's middleware chain, request correlation and `read` scope floor. The
        **per-tool scope check** turns that floor into a contract: an MCP
        session is not a new trust domain, and a `read` token calling
        `want_content` is refused with JSON-RPC code `-32001`.

        ### Methods

        | method | does |
        |---|---|
        | `initialize` | handshake; returns protocol version, server info and instructions |
        | `tools/list` | the tool surface, each with its hand-written input schema and required scope |
        | `tools/call` | invoke one tool |
        | `ping` | keepalive |

        A request with no `id` is a notification and is answered with `202` and
        an empty body, per JSON-RPC — some clients treat a reply to one as a
        protocol violation.

        ### What is deliberately absent

        MCP's value is **semantic actions over desired state, not a second read
        API** (ADR-0019). There are no `resources` or `prompts` capabilities and
        no `list_works`-style tools: an agent that wants to browse should use
        this document's own endpoints.

        Five verbs §71 names are **absent rather than stubbed** —
        `search_releases`, `acquire_release`, `sync_peer`, `play_content` and
        `transfer_playback`. Asking for one returns `-32601` with the milestone
        that brings it, so an agent learns to wait rather than to retry. A tool
        answering "not implemented" would be a published vocabulary with a hole
        in it, which is exactly what ADR-0019 waited to avoid.

        ### §72

        Controller-side MCP holds no key for encrypted personal state.
        Playlists, ratings, reading positions and history are **not reachable
        here** and no tool exposes them — asserted by enumerating the
        registered surface, not by review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JSONRPCRequest" }
      responses:
        "200":
          description: The JSON-RPC response. Tool failures are errors INSIDE this envelope, not HTTP statuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "202": { description: A notification was accepted. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /peer/v1/identity:
    get:
      tags: [peer]
      operationId: getPeerIdentity
      summary: Report the peer identity this node derived from the client certificate.
      description: |
        The peer the SERVER worked out, from the certificate presented on this
        connection and the membership record pinning its key. Nothing in the
        request asserts an identity and nothing is echoed back.

        That is the whole reason the route exists. "The request returned 200"
        is not evidence that pinning happened — a server that authenticated
        nobody would also return 200 — so an acceptance assertion needs a value
        it can compare against the id enrolment returned. This is that value.

        It is served on the peer listener (`peer.listen`), which is off by
        default: a deployment with one peer has no fabric to serve and needs no
        certificate configuration of any kind.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The caller's membership record, as this node resolved it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerIdentity" }
        "401":
          description: |
            No client certificate was presented. Behind the real listener this
            is unreachable — the handshake is refused before a request exists —
            and it is documented because the router refuses independently of
            the listener it is mounted on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The presented key is not a member. It is the same answer for a key
            that was never enrolled and a key that was revoked a moment ago:
            after removal there is nothing left to tell them apart, which is
            what "revocation is removing a membership record" means.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/attachment:
    get:
      tags: [peer]
      operationId: getPeerAttachment
      summary: Report this peer's attachment to the controller.
      description: |
        A Full Peer is controller-attached: it runs no control plane and gets
        its scheduling, authorisation and read routing from the controller
        (ADR-0029). This is how it confirms which controller it is attached to
        and what that controller records it as.

        Every field is derived from the client certificate and the membership
        record pinning its key (ADR-0033). There is no request body and no path
        parameter, so nothing here can be influenced by the caller.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The caller's attachment, as this controller records it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerAttachment" }
        "401":
          description: |
            No client certificate was presented. Behind the real listener this
            is unreachable — the handshake is refused before a request exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/attach:
    post:
      tags: [peer]
      operationId: attachPeer
      summary: Attach to the controller, declaring which peer this node believes it is.
      description: |
        The body carries a DECLARED `peer_id`. It is not a credential and it is
        never the acting identity: the controller derives the acting peer from
        the client certificate, compares the declaration against it, and
        refuses a mismatch with 403 (ADR-0033).

        The declaration is worth sending anyway. A peer restored from another
        site's configuration, or pointed at the wrong data directory, finds out
        on its first request rather than after an inventory report has landed
        under somebody else's id.

        It writes nothing. Attaching is a peer confirming what the controller
        already holds; enrolment is an operator action on the admin surface,
        and no peer credential can reach it.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeerAttachRequest" }
      responses:
        "200":
          description: The caller's attachment, as this controller records it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerAttachment" }
        "400":
          description: |
            The body is not a JSON object, or carries no `peer_id`. The
            declaration is required and is never defaulted to the certificate's
            identity: a body that may be omitted is a body that stops being
            compared.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The presented key is not a member, or the declared `peer_id` is not
            the peer this connection authenticated as. Peer A cannot act as
            peer B.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles:
    get:
      tags: [policy]
      operationId: listQualityProfiles
      summary: Page the quality profiles.
      description: Ordered by `name`, which is unique.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of quality profiles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [policy]
      operationId: createQualityProfile
      summary: Author a quality profile.
      description: |
        A **create, not an upsert**. Device registration is an upsert because a
        television announces itself on every launch and nobody chose to do it;
        a profile is authored deliberately, and silently replacing one because
        the name matched would discard whatever it said before. A name
        collision is a `409`.

        Rules are validated here, at write time — an attribute that does not
        exist, an ordering comparison on a codec name, or a weight on a gate is
        a `400` naming the section and the rule. That is deliberate: a mistake
        in a profile should be reported to whoever wrote the profile, not
        turned into a rejection reason attached to every candidate for the next
        six months.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "201":
          description: The profile.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A profile with that name already exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles/{id}:
    get:
      tags: [policy]
      operationId: getQualityProfile
      summary: One quality profile.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [policy]
      operationId: updateQualityProfile
      summary: Replace a quality profile's rules.
      description: |
        A section the request **omits** is left alone; a section sent as `[]`
        is **cleared**. Those are different intentions, and collapsing them
        would make "clear this profile's terminal rules" and "forget to send
        them" the same request.

        A request that changes nothing emits no event. A client that re-sends
        its whole configuration on every start would otherwise turn the event
        stream into a heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "200":
          description: The profile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new name is already taken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [policy]
      operationId: deleteQualityProfile
      summary: Delete a quality profile.
      description: |
        Physical, not logical — a deliberate departure from ADR-0018's stance
        for *content*. ADR-0018 is about bytes: deleting an asset must not
        unlink blobs inline because bytes are expensive, shared and
        unrecoverable. A profile is a page of configuration, cheap to retype
        and referenced by nothing but desired state, and a soft-deleted one
        would have to be filtered out of every read path forever to avoid an
        operator seeing a profile they deleted.

        A profile still referenced by desired state is refused with `409`
        rather than cascaded: deleting the standard by which desire is
        measured, and leaving the desire, would make satisfaction unanswerable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Still referenced by desired state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles/{id}/evaluate:
    post:
      tags: [policy]
      operationId: evaluateCandidates
      summary: Score release candidates against a profile, and explain every answer.
      description: |
        §63: evaluation is **deterministic and inspectable**. This endpoint is
        what makes the second half true — an evaluation you can only reach
        through a background job is not inspectable, because "why did it pick
        that release, last Tuesday, at 3am" cannot be answered by re-running
        something that has since moved on.

        It **writes nothing**. A `POST` because the body carries the
        candidates, not because it changes anything — the same reasoning as
        `/playback/plan` — and it needs only `read`.

        Hand it candidates and it answers with the same values the search job
        will get, which makes a profile testable *before* it is used in anger.

        ### The reasons are the deliverable

        Every rule that was considered produces a reason, not only the ones
        that failed — a rule that ran silently is a rule nobody can confirm
        ran. §61 lists opaque scoring among the things Heyarr avoids, and a
        score with no reasons is exactly that.

        | result | meaning |
        |---|---|
        | `pass` | an `accept` or `terminal` rule held |
        | `fail` | an `accept` rule did not hold — **this gate rejected the candidate**, and nothing else uses this word |
        | `bonus` / `penalty` | a `prefer` rule landed, contributing its (possibly negative) weight |
        | `miss` | a `prefer` rule did not land, or a `terminal` condition was not reached. **Not** a rejection |
        | `undetermined` | the provider could not determine the attribute |

        `undetermined` is deliberately not `fail`. "This release is 720p and
        you wanted 1080p" and "nobody could tell what resolution this is" are
        different situations, and an operator seeing the second knows to look
        at the provider rather than at the release. An undetermined **gate**
        still rejects — a gate that cannot be shown to hold must not pass, or a
        profile saying "1080p minimum" quietly accepts a release nobody could
        measure.

        ### The ranking is a total order

        Accepted candidates rank above rejected ones (a rejected candidate's
        score is a number about something that will not be used); then by score
        descending; then by **candidate id ascending**, which is a stable key
        that does not depend on the order the candidates were supplied in.

        Without that last tie-break two equally good releases swap places
        between runs and the upgrade workflow churns between them forever — a
        bug that presents as bandwidth.

        `selected` is a separate field rather than "the first of `ranked`"
        because the first element is not necessarily acceptable: when
        everything was rejected it is merely the least bad, and acquiring it
        would be exactly what §62's gates exist to prevent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: Every candidate, ranked and explained.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs:
    get:
      tags: [operations]
      operationId: listJobs
      summary: Page the job queue.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/jobs/{id}:
    get:
      tags: [operations]
      operationId: getJob
      summary: One job.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{id}/retry:
    post:
      tags: [operations]
      operationId: retryJob
      summary: Put a finished job back on the queue. Requires `write`.
      description: |
        An operator action: something was wrong and has been fixed. Only a
        succeeded, failed or dead job may be retried; a pending or leased one is
        a 409, because "retry" on a job that is already running would mean
        running it twice.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job, back in `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/events:
    get:
      tags: [operations]
      operationId: streamEvents
      summary: The event stream (server-sent events).
      description: |
        A live SSE feed of §76 events, preceded by everything after `after`.

        Reconnection is gapless: a client that saw sequence N reconnects with
        `?after=N` and receives everything since, with no hole and no duplicate.
        The subscription is opened before the catch-up read — the other order
        leaves a window in which committed events are in neither half, and both
        halves look complete on their own.

        Each frame carries `id: <seq>`, so a browser `EventSource` resumes on
        its own via `Last-Event-ID`, which this endpoint honours when `after` is
        absent.

        A slow consumer is dropped rather than backpressured (ADR-0009). When
        that happens the stream emits one `heyarr.stream.gap` event carrying
        `resume_after` and `dropped`, and closes. Reconnect with
        `?after=resume_after`. Closing silently would be indistinguishable from
        a network blip, and a client cannot tell "refill" from "carry on".

        Resume from the highest sequence number you have seen. Under concurrent
        writes a straggler may arrive slightly out of order; nothing is ever
        delivered twice.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: Deliver everything with a sequence number greater than this.
        - name: types
          in: query
          schema: { type: string }
          description: |
            Comma-separated event types. Each is an exact name (`job.failed`) or
            a trailing-`*` namespace prefix (`job.*`).
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens:
    get:
      tags: [operations]
      operationId: listTokens
      summary: Every credential. Requires `admin`.
      description: |
        Not paginated: the number of tokens is the number of integrations an
        operator has set up, and unlike the catalog nothing writes to this table
        while it is being read.
      responses:
        "200":
          description: The credentials. Never any secret material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operations]
      operationId: createToken
      summary: Mint a credential. Requires `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name: { type: string }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [read, write, admin] }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: |
            The credential and its secret. The secret is returned exactly once
            and is not recoverable: only its argon2id hash was stored.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{id}:
    get:
      tags: [operations]
      operationId: getToken
      summary: One credential. Requires `admin`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [operations]
      operationId: revokeToken
      summary: Revoke a credential. Requires `admin`.
      description: |
        Logical: the row stays and `revoked_at` is set. An audit trail that
        deletes the thing being audited is not one. Revoking twice is a 409, so
        a script cannot mistake "already revoked" for "revoked something just
        now".
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The revoked credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque scoped token (ADR-0011), presented as `Authorization: Bearer
        heyarr_…`. The header is the only place a credential is accepted: a
        `?token=` parameter would write it into every proxy log, browser history
        and Referer header between the client and here.

        Scopes are ordered — `admin` implies `write` implies `read`. Every
        route under /api/v1 requires at least `read`.

    peerCertificate:
      type: mutualTLS
      description: |
        A self-signed X.509 certificate carrying this peer's Ed25519 public
        key, pinned against the controller-issued membership record
        (ADR-0012). There is no CA and no PKI: the certificate proves
        possession of a key, and membership decides whether that key may
        speak. Both ends pin, so the dialler authenticates the listener by
        exactly the same rule.

        It is checked twice — during the handshake, and again on every request
        the connection carries. Revocation is deleting the membership record,
        and there is no revocation list to fall back on, so the freshness of
        that second lookup is the mechanism.

        This credential is accepted ONLY on /peer/v1, and a bearer token is
        never accepted there. A connection presenting no client certificate is
        refused during the handshake, not with a status code.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        An opaque position from a previous page's `next_cursor`. It is scoped to
        one collection: a cursor from `/works` is rejected by `/jobs` rather
        than being read as a position in a different sort order.
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Values above the maximum are clamped, not rejected.

  responses:
    BadRequest:
      description: The request is malformed or semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No credential, or one that was rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: A valid credential that does not carry the required scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        No such resource. Never an empty 200: a client cannot tell "no such
        work" from "a work with nothing in it" if both are 200, and it is the
        difference between retrying and giving up.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request contradicts current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457. Clients branch on `type` and nothing else.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlates the response with the server log line.

    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          description: Absent on the last page.

    Work:
      type: object
      required: [id, content_type, work_key, title, sort_title, attributes, created_at, updated_at]
      properties:
        id: { type: string }
        content_type: { type: string }
        work_key:
          type: string
          description: Normalised identity, so a rescan converges on the same work.
        title: { type: string }
        sort_title: { type: string }
        year: { type: [integer, "null"] }
        attributes:
          type: object
          description: |
            Per-content-type fields. They live here rather than as columns so
            that registering a fourth content type is not a migration.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Edition:
      type: object
      required: [id, work_id, label, edition_type, attributes, created_at]
      properties:
        id: { type: string }
        work_id: { type: string }
        label: { type: string }
        edition_type: { type: string }
        language: { type: [string, "null"] }
        attributes: { type: object }
        created_at: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, edition_id, source_class, role, identification_source, created_at, updated_at]
      properties:
        id: { type: string }
        edition_id: { type: string }
        library_id: { type: [string, "null"] }
        source_class:
          type: string
          enum: [managed, linked, vault]
        blob_hash:
          type: [string, "null"]
          description: |
            Null for a `linked` asset, which has no blob at all — not a mutable
            one, not a special one, none (ADR-0020). That is what keeps blob
            immutability absolute.
        source_path: { type: [string, "null"] }
        role: { type: string }
        filename: { type: [string, "null"] }
        mime: { type: [string, "null"] }
        identification_source: { type: string }
        missing_since:
          type: [string, "null"]
          format: date-time
          description: Set when the source path vanished. Not a deletion.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Blob:
      type: object
      required: [hash, size, chunked, first_seen_at]
      properties:
        hash:
          type: string
          description: "`blake3:<64 hex>` — the canonical byte identity (ADR-0005)."
        size: { type: integer, format: int64 }
        mime: { type: [string, "null"] }
        chunked: { type: boolean }
        first_seen_at: { type: string, format: date-time }

    Library:
      type: object
      required: [id, name, content_type, enabled, created_at, roots]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        roots:
          type: array
          items: { $ref: "#/components/schemas/LibraryRoot" }

    LibraryRoot:
      type: object
      required: [id, library_id, path, ingest_mode, enabled, created_at]
      properties:
        id: { type: string }
        library_id: { type: string }
        path: { type: string }
        ingest_mode: { type: string, enum: [reflink, hardlink, copy, link] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    Peer:
      type: object
      required: [id, name, site, mode, is_self, created_at, enrolled_at, health, last_seen_at]
      properties:
        id: { type: string }
        name: { type: string }
        site: { type: string, description: The failure domain this peer is in. }
        mode: { type: string, enum: [full, partial, cache, archive, compute] }
        endpoint: { type: [string, "null"] }
        public_key:
          type: [string, "null"]
          description: |
            The peer's Ed25519 identity as `ed25519:<64 lowercase hex>` — the
            same algorithm-prefixed shape as a blob digest, so the two are not
            confused in a terminal. Null for a peer that has not established an
            identity yet (ADR-0012).

            This is the PUBLIC half, and it is what another site needs in order
            to enrol this peer. The private key is never exposed here or
            anywhere else in the API: it is a 0600 file in the data directory
            that the API layer does not read.
          pattern: "^ed25519:[0-9a-f]{64}$"
        is_self: { type: boolean }
        created_at: { type: string, format: date-time }
        enrolled_at:
          type: string
          format: date-time
          description: |
            When this peer was admitted to the fabric (M4-04). For the self
            peer it equals `created_at`. Revocation is deletion (ADR-0012), so
            a peer removed and re-enrolled comes back with a new `id` and a new
            `enrolled_at` — which is what makes this the answer to "has
            membership changed?" rather than a copy of `created_at`.
        health:
          type: string
          enum: [unknown, reachable, unreachable]
          description: |
            Whether this peer is reachable (§31, §32, M4-10).

            It is OBSERVED, not declared. A peer is `reachable` because it
            answered something recently — an inventory report, a served range,
            or a cheap probe when nothing else has happened — and there is no
            endpoint through which a peer can assert its own health.

            `unreachable` means SILENCE past the window, not a failed request.
            A peer that answered a request with a 500 is `reachable`: a 500
            proves a process is listening, and the question here is whether
            anything is there. `unknown` is a peer nothing has ever heard from,
            and it is deliberately not a synonym for reachable — an unprobed
            peer has not been shown to be up.

            Health is advisory for reads and does not affect membership: an
            unreachable peer is skipped as a read source, and still accrues the
            replication work it is owed.
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this peer last answered anything, or null if it never has.

            It ships beside `health` rather than instead of it because
            "unreachable" on its own is a status nobody can act on: it does not
            say whether to go and restart something or to wait twenty seconds.

    PeerIdentity:
      type: object
      required: [peer_id, name, public_key, served_by]
      description: |
        The identity the answering node derived from the client certificate on
        the connection, plus which node answered.

        Every field here is the SERVER's conclusion. A caller cannot influence
        any of it, which is the property that makes this endpoint worth having:
        comparing `peer_id` against the id enrolment returned is an assertion
        that pinning happened, and a 200 alone is not.
      properties:
        peer_id:
          type: string
          description: The caller's membership id, as this node resolved it.
        name:
          type: string
          description: The caller's name in this node's membership records.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: |
            The pinned key, so a caller can compare it against the one it
            enrolled. The public half, as everywhere else in this API.
        served_by:
          type: string
          description: The answering node's own peer id.

    PeerAttachRequest:
      type: object
      required: [peer_id]
      description: |
        What a Full Peer declares when it attaches. `peer_id` is a declaration,
        not a credential: the controller compares it against the identity the
        certificate proved and refuses a mismatch (ADR-0033).
      properties:
        peer_id:
          type: string
          description: The membership id this peer believes it holds.
      additionalProperties: false

    PeerAttachment:
      type: object
      required: [peer_id, name, public_key, controller, control_plane, principal]
      description: |
        A peer's attachment to a controller, as the controller records it.

        Every field is the controller's conclusion, derived from the client
        certificate. Nothing a caller sent is echoed back — including the
        declared `peer_id`, which is compared and then discarded.
      properties:
        peer_id:
          type: string
          description: The acting peer, derived from the certificate.
        name:
          type: string
          description: The acting peer's name in the controller's membership records.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: The pinned key, as the controller holds it.
        controller:
          type: string
          description: The answering controller's own peer id.
        control_plane:
          type: string
          enum: [controller-attached]
          description: |
            A Full Peer runs no control plane of its own (ADR-0029). Stated in
            the response so a peer that ever receives something else fails
            loudly rather than assuming.
        principal:
          type: string
          enum: [peer]
          description: |
            The kind of credential that was accepted. Never `admin`: a peer
            certificate authorises the peer surface, acting as that peer, and
            a peer reading `admin` here would have found a privilege
            escalation (ADR-0033).

    PeerRegistration:
      type: object
      required: [name, public_key]
      description: |
        What an operator asserts about another node.

        There is deliberately no variant of this shape without `public_key`. A
        registration carrying only a name and an endpoint would be a request to
        trust whatever answers at that address — trust on first use — and
        ADR-0012 pins keys rather than addresses.
      properties:
        name:
          type: string
          description: Unique within this instance.
        site: { type: string, description: The peer's failure domain (§35). }
        mode:
          type: string
          enum: [full, partial, cache, archive, compute]
          default: full
        endpoint:
          type: string
          description: |
            Where to reach the peer. NOT its identity: posting the same
            `public_key` with a different endpoint moves the peer, and its
            `id`, its `enrolled_at` and everything referring to it are
            unaffected.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: |
            Who the peer is — the exact string the other site's
            `heyarr peers list` prints. This is the pin ADR-0012 describes, and
            it is the only trust root in the inter-peer path.

    Replica:
      type: object
      required: [blob_hash, peer_id, state, bytes_present, updated_at]
      properties:
        blob_hash: { type: string }
        peer_id: { type: string }
        state: { type: string, enum: [present, pending, corrupt, missing] }
        bytes_present: { type: integer, format: int64 }
        verified_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, type, payload, state, priority, required_capability, run_after, attempts, max_attempts, created_at, updated_at]
      properties:
        id: { type: string }
        type: { type: string }
        payload: { type: object }
        state: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        priority: { type: integer, description: Lower runs first. }
        dedupe_key: { type: [string, "null"] }
        required_capability: { type: string }
        run_after: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        lease_owner: { type: [string, "null"] }
        lease_expires_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    Token:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    SystemInfo:
      type: object
      properties:
        build:
          type: object
          properties:
            version: { type: string }
            commit: { type: string }
            date: { type: string }
        peer:
          type: object
          properties:
            name: { type: string }
            site: { type: string }
        schema_version: { type: integer }
        drift:
          $ref: "#/components/schemas/DriftReport"
        database:
          $ref: "#/components/schemas/StorageInfo"
        cas:
          $ref: "#/components/schemas/StorageInfo"
        events:
          $ref: "#/components/schemas/EventsInfo"
        media:
          type: array
          description: |
            The external media toolchain THIS node resolved (ADR-0023). FFmpeg
            is optional: a node without it still scans, ingests and serves byte
            ranges, but probe and remux jobs stay pending until a worker that
            has it claims them.

            In a split-process deployment this describes the node answering the
            request, not the fleet — the worker that would claim a probe job may
            be another machine. `/api/v1/jobs` showing pending probes is the
            other half of that picture.
          items: { $ref: "#/components/schemas/ToolInfo" }
        auth_enabled: { type: boolean }

    DriftStatus:
      type: string
      enum: [unknown, current, behind, ahead, mismatch]
      description: |
        The outcome of one comparison.

        `unknown` means the comparison could not be MADE — nothing to compare
        against, or a version string that is not a version. It is distinct from
        `current` on purpose, and nothing may treat the two as equivalent: "we
        could not tell" reported as "fine" is the failure this object exists to
        stop.

        `ahead` is not good news. For the schema it is the state in which an
        older binary writes plausible rows against constraints a newer schema
        depends on (§49); for the build it usually means the expectation is the
        stale half.

        `mismatch` means the two builds are known to differ with no ordering
        between them — the same version tag built from different source, or two
        commits with no semantic version on either side. Different, distance
        unknown; never `current`.

    BuildIdentity:
      type: object
      description: A build — what it calls itself, and what it was built from.
      properties:
        version: { type: string }
        commit: { type: string }

    BuildDrift:
      type: object
      description: |
        How far the running build is from the expected one.

        At most one of the three distance fields is non-zero: the most
        significant semantic version component that differs. A distance spread
        across three numbers is one nobody can threshold, so `v1.4.2` expected
        against `v1.0.9` running reports one minor version behind rather than
        claiming to be four minors and minus seven patches behind. All three are
        zero unless `status` is `behind`.
      properties:
        status: { $ref: "#/components/schemas/DriftStatus" }
        expected: { $ref: "#/components/schemas/BuildIdentity" }
        actual: { $ref: "#/components/schemas/BuildIdentity" }
        major_behind: { type: integer }
        minor_behind: { type: integer }
        patch_behind: { type: integer }
        detail:
          type: string
          description: |
            Why a status is what it is, in a few words — chiefly why an
            `unknown` could not compare. For a human; nothing should branch on
            it.

    SchemaDrift:
      type: object
      description: |
        How many migrations separate this binary from its database.

        A count rather than a flag, because seven unapplied migrations and one
        are not the same operational problem: one is routine and the other wants
        a backup taken before it runs. At most one of the two counts is
        non-zero.
      properties:
        status: { $ref: "#/components/schemas/DriftStatus" }
        expected:
          type: integer
          format: int64
          description: The highest migration the comparison expects to exist.
        applied:
          type: integer
          format: int64
          description: |
            The migration version actually applied to this database. Zero is
            legitimate — a database that has never been migrated — and is
            reported as behind by the full distance.
        migrations_behind: { type: integer, format: int64 }
        migrations_ahead: { type: integer, format: int64 }
        detail: { type: string }

    DriftReport:
      type: object
      description: |
        Both drift checks, side by side and never merged.

        They drift independently and they fail differently. A binary that is
        current with its migrations unapplied is not a mild case of being behind
        — it is a build running against a schema it was never tested on — and
        reducing both to one "up to date" flag would let a current binary hide
        an un-migrated database.
      properties:
        build: { $ref: "#/components/schemas/BuildDrift" }
        schema: { $ref: "#/components/schemas/SchemaDrift" }

    EventsInfo:
      type: object
      description: |
        Where the event log currently is, so a client can follow the stream
        from *now* rather than replaying from sequence zero.
      properties:
        head:
          type: integer
          format: int64
          description: |
            The most recent sequence number, and a resume point: pass it as
            `?after=` on `/api/v1/events` to receive everything from here. An
            empty log reports 0, which is already what "everything" means.
        ok:
          type: boolean
          description: |
            False when the head could not be read, in which case `head` is
            meaningless. It is reported rather than 500ing because 0 is a
            legitimate head, so a client cannot otherwise tell "nothing has
            happened" from "we could not find out".

    ToolInfo:
      type: object
      properties:
        name:
          type: string
          description: The binary described, `ffprobe` or `ffmpeg`.
        available: { type: boolean }
        path:
          type: string
          description: Where it was found. Absent when unavailable.
        version:
          type: string
          description: What it reported, e.g. `7.0.2`. Absent when unavailable.
        detail:
          type: string
          description: |
            Why an unavailable tool is unavailable, in a few words — "not found
            on PATH", "did not report a version". Absent when available.

    BlobProbe:
      type: object
      properties:
        blob_hash: { type: string }
        container:
          type: string
          description: |
            ffprobe's `format_name` verbatim — a comma-separated list of every
            name the demuxer answers to, e.g. `mov,mp4,m4a,3gp,3g2,mj2`. Kept
            whole rather than reduced to one name, because which of those a
            file "is" is a question with no answer, and the planner matches by
            membership.
        format_long: { type: string }
        duration_seconds: { type: number, nullable: true }
        bitrate_bps:
          type: integer
          format: int64
          nullable: true
          description: Null when the container declared none — a Matroska file legitimately has none.
        streams:
          type: array
          items: { $ref: "#/components/schemas/ProbeStream" }
        bytes_read:
          type: integer
          format: int64
          description: What crossed the wire to answer this. §29's evidence.
        materialised:
          type: boolean
          description: |
            True when Range probing did not work and the whole blob was copied
            (§29's fallback). Counted rather than silent: a fallback nobody can
            see becomes the default without anyone noticing.
        probed_at: { type: string, format: date-time }

    ProbeStream:
      type: object
      properties:
        index: { type: integer }
        type:
          type: string
          description: video, audio, subtitle or data.
        codec: { type: string }
        profile: { type: string }
        level: { type: integer }
        width: { type: integer }
        height: { type: integer }
        frame_rate: { type: string }
        channels: { type: integer }
        sample_rate: { type: integer }
        bitrate_bps: { type: integer, format: int64 }
        language: { type: string }

    Publication:
      type: object
      description: |
        An asset that is one of §69's four containers, with what its own
        manifest declared.
      properties:
        asset_id: { type: string }
        edition_id: { type: string }
        work_id: { type: string }
        title: { type: string }
        blob_hash: { type: string }
        filename: { type: string }
        size: { type: integer, format: int64 }
        format:
          type: string
          enum: [epub, pdf, cbz, cbr]
        page_count:
          type: integer
          description: |
            Page images in a comic archive. **Absent when unread**, which is not
            the same as zero: an empty comic is a zero-page comic, and a PDF is
            a publication whose length Heyarr has not counted. Reading a PDF's
            page tree needs a PDF parser, and §69 says Heyarr does not render.
        chapter_count:
          type: integer
          description: |
            Spine items in an EPUB — its reading order, which is the closest
            thing an EPUB has to a length and is deliberately not called a page
            count. Absent when unread.
        content_url:
          type: string
          description: |
            The ordinary blob endpoint. Named here so the single-endpoint
            contract is visible in the response rather than only in ADR-0013.

    StartPlayback:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
          description: |
            Optional. Derived from the probe when omitted — watching when there
            is video, listening when there is not. Derived from the probe
            rather than the extension because a `.mkv` holding only audio is a
            legitimate thing, and calling it "watching" puts it in the wrong
            row of every continue-watching list.

    StartedPlayback:
      type: object
      properties:
        session_id: { type: string }
        plan: { $ref: "#/components/schemas/PlaybackPlan" }
        content_url:
          type: string
          description: The ordinary blob endpoint (ADR-0013).
        token:
          type: string
          description: |
            A short-lived `read` credential for that URL. **Not scoped to one
            blob** — see the endpoint description.
        expires_at: { type: string, format: date-time }

    RemuxRequest:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }

    PlanRequest:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }

    PlaybackPlan:
      type: object
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        decision:
          type: string
          enum: [direct, remux, transcode, unplayable]
        reasons:
          type: array
          description: |
            Why the decision is not DIRECT, or why nothing can be played. Empty
            for a clean DIRECT.
          items: { $ref: "#/components/schemas/PlanReason" }
        peer_id:
          type: string
          description: The replica chosen to serve from. Absent when unplayable.
        remote:
          type: boolean
          description: |
            The chosen replica is at another site. §31 prefers a local one, so
            an instance where this is usually true is one where replication is
            not working.

            **Unproven:** nothing has ever run against a second peer
            (ADR-0010), so this path is unit-tested against synthetic replicas
            and nothing more until Milestone 4.
        content_url:
          type: string
          description: |
            Where the bytes are, for a DIRECT plan. **Absent otherwise** — a
            REMUX or TRANSCODE plan has no bytes to point at yet, and offering
            the original would invite the client to play exactly what the plan
            just said it cannot.

    PlanReason:
      type: object
      properties:
        code:
          type: string
          enum:
            [no_replica, container_unsupported, video_codec_unsupported,
             audio_codec_unsupported, resolution_too_high, bitrate_too_high,
             hdr_unsupported, no_probe, remote_replica_only,
             device_declares_nothing]
          description: Stable. Clients branch on this, and a client branching on prose breaks when the prose improves.
        detail:
          type: string
          description: Prose for a human. May change.

    ConsumptionSession:
      type: object
      description: |
        One consumption of one asset by one device — watching, listening or
        reading (§67, ADR-0024).
      properties:
        id: { type: string }
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
        state:
          type: string
          enum: [created, playing, paused, stopped, completed]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: |
            **Absent** until something has been recorded — not a zero locator.
            Position zero is a real position, and a client cannot tell "at the
            very beginning" from "never played" if both render as 0.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the session first played. Null for one created and abandoned,
            which is what makes "nobody watched this" distinguishable from
            "someone watched two minutes".
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: When it reached a terminal state.

    SessionProgress:
      type: object
      description: |
        Where a session reached, as a **locator and a unit** — never a bare
        number. A page number is not a number of seconds, and storing both as
        "position" makes every reader guess which it has.
      properties:
        locator:
          type: string
          description: |
            A decimal offset for `seconds`, a decimal page number for `page`,
            or an `epubcfi(...)` expression for `cfi`. A CFI is opaque to
            Heyarr, which stores and serves publications and never renders
            them (§69).
        unit:
          type: string
          enum: [seconds, page, cfi]

    CreateConsumptionSession:
      type: object
      required: [asset_id, device_id, verb]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]

    SessionTransition:
      type: object
      required: [transition]
      properties:
        transition:
          type: string
          enum: [start, pause, resume, progress, stop, complete]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: Recorded with the transition. Usually sent with `progress`.

    Candidates:
      type: object
      required: [desired_item_id, candidates]
      properties:
        desired_item_id: { type: string }
        search_id:
          type: string
          description: |
            Groups these as the one search's answers they are. A different id
            from a previous read means a search has happened in between and
            this is a different set, not an update of the same one.
        selected:
          type: string
          description: |
            The provider's id for the chosen release. **Absent when nothing was
            acceptable** — and note that is not simply the first of
            `candidates`, which when everything was rejected is merely the
            least bad.
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }

    Candidate:
      type: object
      required: [candidate_id, provider, accepted, score, terminal, selected, reasons]
      properties:
        candidate_id:
          type: string
          description: |
            The **provider's** identity for the release, and what you name in a
            `select`. The storage row's own id is deliberately not on the wire:
            it identifies a row a re-search replaces, and a client holding one
            would be holding a handle to something that vanishes.
        provider: { type: string }
        title: { type: string }
        accepted:
          type: boolean
          description: Every gate held. A candidate that is not accepted is never acquired.
        score:
          type: integer
          description: |
            The sum of the preferences that landed. Meaningful only among
            accepted candidates: a rejected one's score is a number about
            something that will not be used.
        terminal:
          type: boolean
          description: Meets every terminal condition, so the upgrade workflow would stop here (§62).
        selected: { type: boolean }
        overridden:
          type: boolean
          description: A person chose this against the ranking (§60's manual override).
        override_detail:
          type: string
          description: What the scorer had chosen instead, and what each scored.
        reasons:
          type: array
          description: |
            Every rule that was considered, not only the ones that failed — a
            rule that ran silently is a rule nobody can confirm ran.
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          description: The gates that rejected this candidate. Absent when accepted.
          items: { $ref: "#/components/schemas/EvaluationReason" }

    Satisfaction:
      type: object
      required: [desired_item_id, state, content, placement]
      properties:
        desired_item_id: { type: string }
        state:
          type: string
          description: §64's derived name, so this response stands alone.
        content: { $ref: "#/components/schemas/ContentSatisfaction" }
        placement: { $ref: "#/components/schemas/PlacementSatisfaction" }
        upgrade: { $ref: "#/components/schemas/UpgradeEligibility" }

    UpgradeEligibility:
      type: object
      description: |
        Whether this want could be **improved** (§60) — a different question
        from either satisfaction axis. A want can be fully satisfied and still
        improvable, and that gap is the whole upgrade workflow:

        | state | meaning |
        |---|---|
        | not accepted | `MISSING`, keep searching — an *acquisition*, not an upgrade |
        | accepted, not terminal | satisfied **and** still improvable |
        | terminal | done; there is nothing left to want |
      required: [eligible, status, detail]
      properties:
        eligible:
          type: boolean
          description: Nothing about this want's state rules an upgrade out.
        status:
          type: string
          enum:
            [
              available,
              not_monitored,
              not_satisfied,
              terminal,
              no_better_candidate,
            ]
          description: |
            **Why** — an enumerated reason rather than a bare boolean, because
            "no upgrade" has four completely different meanings and an operator
            asking "why is this not upgrading" needs to know which.

            `not_monitored` outranks `terminal`: a want that is both reports
            the operator's decision, because "you told me to stop" is the more
            useful answer than "it happens to be perfect".

            `no_better_candidate` is the **normal** answer for a healthy
            library — eligible, with nothing better found. It is what an
            eligible want reports when nothing is on offer.
        detail:
          type: string

    ContentSatisfaction:
      type: object
      required: [satisfaction, assets]
      properties:
        satisfaction:
          type: string
          enum: [unknown, not_satisfied, satisfied]
        satisfied_by:
          type: string
          description: |
            The asset that satisfies — the **best** one, by the same ranking
            the search uses, so "what am I watching" and "what would I have
            acquired" cannot disagree.
        assets:
          type: array
          description: |
            Every asset considered, with its full §63 reasons. An asset that
            exists and was rejected appears here **with the rule that rejected
            it**, which is the whole point of this endpoint.
          items: { $ref: "#/components/schemas/AssetSatisfaction" }

    AssetSatisfaction:
      type: object
      required: [asset_id, accepted, score, terminal, reasons]
      properties:
        asset_id: { type: string }
        accepted: { type: boolean }
        score: { type: integer }
        terminal: { type: boolean }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          items: { $ref: "#/components/schemas/EvaluationReason" }

    PlacementSatisfaction:
      type: object
      required: [satisfaction, detail, unproven]
      properties:
        satisfaction:
          type: string
          enum: [unknown, not_satisfied, converging, satisfied, not_applicable]
          description: |
            `not_applicable` is for ADR-0020's `linked` assets, which have no
            blob and therefore nothing to replicate. Calling that `satisfied`
            would be vacuously true and a lie by construction.
        missing:
          type: array
          items: { type: string }
          description: |
            The peers that should hold the bytes and do not. `converging` with
            no list of what is missing is a status nobody can act on.
        detail: { type: string }
        unproven:
          type: boolean
          description: |
            **Always `true` in this milestone.** Nothing has ever run against a
            second peer (ADR-0010), so with a target set of one this axis is
            satisfied the moment content is, and `converging` is unreachable
            outside a test with a synthetic peer set.

            It is a response field rather than only a note in this document
            because a caveat the reader of the response never sees is a caveat
            that does not work. A client must not read `satisfied` here as
            evidence that replication works.

    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          description: |
            Absent makes this a notification, which is answered with `202` and
            no body rather than a result.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum: [initialize, tools/list, tools/call, ping]
        params:
          type: object
          description: |
            For `tools/call`: `{ "name": "...", "arguments": { ... } }`. The
            argument shape for each tool is its `inputSchema` from `tools/list`,
            and unknown fields are refused rather than ignored — an agent that
            misspelled one finds out instead of getting a cheerful empty result.

    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          description: |
            For `tools/call`, MCP's content envelope: a `content` array with a
            text block every client can render, plus `structuredContent`
            carrying the same value as JSON. Both, so an agent gets prose it can
            quote **and** a shape it can branch on rather than having to parse
            the prose.
        error: { $ref: "#/components/schemas/JSONRPCError" }

    JSONRPCError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            JSON-RPC 2.0 codes, plus one. `-32700` parse error, `-32600` invalid
            request, `-32601` method or tool not found, `-32602` invalid params,
            `-32603` internal error, and **`-32001` forbidden** — outside the
            reserved range because a refused scope is not a malformed request,
            and an agent that cannot tell "you may not do this" from "you asked
            wrongly" will retry the wrong one forever.
        message: { type: string }
        data:
          type: object
          description: |
            The actionable half. A refused scope names the tool and the scope it
            needs; a deferred §71 verb names the milestone that brings it.

    EvaluateRequest:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReleaseCandidate" }

    ReleaseCandidate:
      type: object
      description: One release a provider offered.
      required: [id]
      properties:
        id:
          type: string
          description: |
            Stable for a given release from a given provider, and the ranking's
            tie-break — so it must not be a position in a response. Two
            candidates sharing an id is a `400`, because it would make the
            ranking depend on the order they were sent in.
        title:
          type: string
          description: |
            What the indexer called it. **Never parsed** — attributes are
            extracted by the provider, and re-deriving them from the title at
            scoring time would be a second, invisible extraction.
        provider: { type: string }
        attributes:
          type: object
          description: |
            What could be determined about the release, keyed by attribute
            name. A key that is **absent** (or explicitly `null`) means "could
            not be determined", which is different from a zero value and is
            reported as `undetermined` rather than as a failure.

            A provider that cannot tell must leave the attribute out. HDR
            detection in Milestone 2 is a substring match on the ffprobe
            profile and is a recorded weakness; a release *title* is worse
            evidence, not better.
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
              - type: boolean
              - type: "null"

    Evaluation:
      type: object
      required: [quality_profile_id, ranked]
      properties:
        quality_profile_id: { type: string }
        ranked:
          type: array
          description: Every candidate, best first.
          items: { $ref: "#/components/schemas/RankedCandidate" }
        selected:
          type: string
          description: |
            The candidate that would be acquired. **Absent when none was
            acceptable** — and note this is not simply the first of `ranked`,
            which when everything was rejected is merely the least bad.

    RankedCandidate:
      type: object
      required: [id, accepted, score, terminal, reasons]
      properties:
        id: { type: string }
        title: { type: string }
        provider: { type: string }
        accepted:
          type: boolean
          description: |
            Whether every gate held. A candidate that is not accepted is never
            acquired, whatever it scored.
        score:
          type: integer
          description: |
            The sum of the preferences that landed. Meaningful only among
            accepted candidates: a rejected one's score is not a near miss, it
            is a number about something that will not be used.
        terminal:
          type: boolean
          description: |
            This candidate meets **every** terminal condition, so the upgrade
            workflow has nothing left to want (§62).

            A profile with no terminal rules is **never** terminal — vacuous
            truth over an empty set would turn "never stop looking" into "stop
            immediately". A rejected candidate is never terminal either.
        reasons:
          type: array
          description: Every rule that was considered, in the profile's own order.
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          description: The gates that rejected this candidate. Absent when accepted.
          items: { $ref: "#/components/schemas/EvaluationReason" }

    EvaluationReason:
      type: object
      required: [rule, section, result, detail]
      properties:
        rule:
          type: string
          description: |
            The rule's machine-readable identity, `<attribute>.<op>`. Clients
            branch on this; a client branching on prose is one that breaks when
            the prose improves.
        section:
          type: string
          enum: [accept, prefer, terminal]
        result:
          type: string
          enum: [pass, fail, bonus, penalty, miss, undetermined]
        score:
          type: integer
          description: The contribution, present only for preferences that landed.
        detail:
          type: string
          description: The prose half, for a human.

    DesiredItem:
      type: object
      description: |
        "This content should exist under these conditions" (§55) — the row that
        makes Heyarr more than a catalogue.

        It anchors to a **Work**, the semantic entity (§11), which exists
        whether or not any bytes do. Never to an Asset: an Asset is a file that
        exists by definition, and wanting a file you already have is not a
        coherent thing to say.
      required: [id, scope, work_id, quality_profile_id, monitor]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [work, edition]
          description: |
            How much of the work is wanted — the whole thing, or one edition of
            it (a season, a particular release, a language).

            **There is no `episode` scope, and that is a limitation rather than
            an omission.** §11 makes the *series* the Work and an edition the
            season, so an episode is an Asset — a file that exists — and there
            is no entity anywhere for an episode nobody has yet. Knowing which
            episodes *should* exist is what a metadata provider is for, and
            that is deferred out of Milestone 3.

            What this costs today, stated rather than papered over: with no
            metadata provider, content satisfaction for a series-scoped want is
            "an acceptable asset exists", **not** "every episode exists". A
            want for a series is not a completeness guarantee in this
            milestone.
        work_id:
          type: string
          description: Always set, even at edition scope.
        edition_id:
          type: string
          description: Present only at edition scope — absent, not null, at work scope.
        quality_profile_id: { type: string }
        monitor:
          type: boolean
          description: |
            "Keep looking for something better", which is **not** the same as
            wanting (§60 keeps both words). An unmonitored want that is
            satisfied is finished, terminal profile or not: the operator said
            "get me this", not "keep improving this". Running the upgrade
            workflow over unmonitored items is how *arr installations
            re-download libraries nobody asked them to touch.
        reason:
          type: string
          description: |
            Free text, never interpreted. It exists because a library
            accumulates wants and six months later nobody remembers why one is
            there.
        acquisition:
          $ref: "#/components/schemas/AcquisitionState"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcquisitionState:
      type: object
      description: |
        Where a want has got to (§64).

        §64 draws twelve boxes in a single column — `MISSING`, `SEARCHING`,
        `CANDIDATES_FOUND`, `SELECTED`, `QUEUED`, `DOWNLOADING`, `VERIFYING`,
        `INGESTING`, `AVAILABLE`, `CONTENT_SATISFIED`, `PLACEMENT_CONVERGING`,
        `FULLY_SATISFIED` — but they are **not twelve steps along one road**.
        They are a presentation of four independent facts, and this object
        carries all four alongside the name.

        Showing only `state` would reintroduce at the edge exactly the collapse
        the storage model exists to prevent: a client that can see
        `CONTENT_SATISFIED` but not which of §56's two questions was answered
        cannot tell "we have it" from "we have it everywhere".
      required: [state, phase, managed, content, placement]
      properties:
        state:
          type: string
          enum:
            [
              MISSING,
              SEARCHING,
              CANDIDATES_FOUND,
              SELECTED,
              QUEUED,
              DOWNLOADING,
              VERIFYING,
              INGESTING,
              AVAILABLE,
              CONTENT_SATISFIED,
              PLACEMENT_CONVERGING,
              FULLY_SATISFIED,
            ]
          description: §64's name, **derived** from the fields below and never stored.
        phase:
          type: string
          enum:
            [idle, searching, candidates_found, selected, queued, downloading, verifying, ingesting]
          description: |
            Where the acquisition pipeline is.

            There is deliberately **no `missing` or `available` phase**. Both of
            §64's names mean "nothing in flight" and differ only in whether
            Heyarr holds bytes — so with them as phases, a fruitless upgrade
            search returns to `MISSING` and reports a perfectly good library as
            empty.
        managed:
          type: boolean
          description: |
            Whether Heyarr holds bytes for this want. Independent of `phase`,
            because a want can be acquiring an **upgrade** while already
            holding a good copy.
        content:
          type: string
          enum: [unknown, not_satisfied, satisfied]
          description: |
            "Do we hold bytes the quality profile accepts?" (§56)

            `unknown` is distinct from `not_satisfied`: "nobody has looked" and
            "we looked and the answer is no" lead to different actions, and
            collapsing them makes a fresh want indistinguishable from one just
            found wanting.

            There is no `converging` here — no partial file half-satisfies a
            profile.
        placement:
          type: string
          enum: [unknown, not_satisfied, converging, satisfied, not_applicable]
          description: |
            "Are those bytes on every Full Peer that should hold them?" (§56)

            `not_applicable` is for ADR-0020's `linked` assets, which have no
            blob and therefore nothing to replicate. Calling that `satisfied`
            would be vacuously true and a lie by construction: `FULLY_SATISFIED`
            would then mean "one copy, on one disk, with no integrity
            guarantee".

            **UNPROVEN.** Nothing has ever run against a second peer
            (ADR-0010), so with a target set of one this axis is satisfied the
            moment content is, and `converging` is unreachable outside a test
            with a synthetic peer set. Milestone 4 proves it.
        detail:
          type: string
          description: Why the last pipeline move happened, when it was a failure.

    CreateDesired:
      type: object
      description: |
        Name the work by `work_id` **or** `work`, and the profile by
        `quality_profile_id` **or** `quality_profile`. Supplying both of a pair
        is a `400` rather than a silent precedence rule.
      properties:
        scope:
          type: string
          enum: [work, edition]
          default: work
        work_id: { type: string }
        edition_id:
          type: string
          description: Required at edition scope, refused at work scope.
        work:
          $ref: "#/components/schemas/WorkDescriptor"
        quality_profile_id: { type: string }
        quality_profile:
          type: string
          description: The profile's name, for when a person is typing this.
        monitor:
          type: boolean
          default: true
        reason: { type: string }

    WorkDescriptor:
      type: object
      description: |
        Content named semantically, whether or not it exists. Resolved through
        the same `(content_type, work_key)` get-or-create the scanner uses, so
        wanting something and later scanning it converge on one Work.
      required: [content_type, title]
      properties:
        content_type:
          type: string
          description: "`movie`, `series`, `music`, `book`, … (§12)."
        title: { type: string }
        year:
          type: integer
          description: |
            Optional, and part of the identity when present. A year in the
            title (`"Blade Runner (1982)"`) is understood too; an explicit year
            wins, because the caller said so.

    UpdateDesired:
      type: object
      description: An omitted field is left alone. The target cannot be changed.
      properties:
        quality_profile_id: { type: string }
        quality_profile: { type: string }
        monitor: { type: boolean }
        reason: { type: string }

    Providers:
      type: object
      required: [providers, capabilities]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }
        capabilities:
          type: array
          items: { type: string, enum: [indexer, download, metadata] }
          description: |
            What this node can therefore do, as a set — and therefore which
            jobs it can claim.

            Stated rather than left for a client to derive, because deriving it
            means knowing that a **disabled** provider contributes nothing, and
            a dashboard that got that wrong would report "indexing available"
            for a provider somebody switched off.

            Empty is a legitimate answer, not an error: it is exactly what
            ADR-0025 describes.

    ProviderStatus:
      type: object
      required: [name, capabilities, healthy, detail]
      properties:
        name:
          type: string
          description: |
            The operator's name for this provider, unique within an instance.
            It is what appears in routing, in health, and in a release
            candidate's `provider` field — so it is the operator's word rather
            than a generated identifier.
        capabilities:
          type: array
          items: { type: string, enum: [indexer, download, metadata] }
          description: |
            What this provider can do for us.

            **Empty when the provider is disabled in configuration.** That is
            how "configured and switched off" is distinguished from "not
            configured at all": the first appears here with nothing it can do,
            the second does not appear.

            `metadata` is declared and nothing implements it in this milestone
            — §84's list does not include metadata providers. It exists so that
            the first one is a change to configuration rather than a change to
            the registry.
        healthy:
          type: boolean
          description: Whether the last check found the provider usable.
        detail:
          type: string
          description: |
            What was observed, in a few words. A status with no reason is one
            nobody can act on, so this is always present.
        version:
          type: string
          description: |
            The API version the service reported.

            This is what replaces version **pinning** for a service Heyarr does
            not install (ADR-0026): not controlling the version does not mean
            ignoring it. A version outside the supported range is reported
            unhealthy naming both numbers, and is **never** a startup failure.
        checked_at:
          type: string
          format: date-time
          description: |
            When the last check ran. **Absent means never checked**, which is
            distinct from `healthy: false`.

    QualityProfile:
      type: object
      description: |
        A quality profile (§62). It says three different **kinds** of thing,
        not three degrees of one:

        | section | meaning |
        |---|---|
        | `accept` | a **gate**. Fail one and the candidate is rejected outright, whatever else it offers. |
        | `prefer` | a **score**. Never a gate — a candidate meeting no preference at all is still acceptable, merely worse. |
        | `terminal` | a **stop condition**. The point at which the upgrade workflow has nothing left to want. |

        Collapsing any two produces the *arr behaviour §61 rejects: a
        preference that silently rejects, or an upgrade loop with no ceiling
        that never terminates because "better" is unbounded.

        An **empty `terminal` and an absent one are the same thing** — "there
        is no condition under which this profile is finished", which is legal
        and means *never stop looking*. The seeded `archival` profile is
        exactly that.
      required: [id, name, accept, prefer, terminal]
      properties:
        id: { type: string }
        name:
          type: string
          description: Unique. This is what a DesiredItem names (§55).
        description: { type: string }
        accept:
          type: array
          description: Gates. Every one must pass.
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          description: Scored. None is required; each contributes its weight.
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          description: |
            Stop conditions. **All** must hold for a candidate to be terminal.
            Empty means this profile is never finished.
          items: { $ref: "#/components/schemas/QualityRule" }
        seeded:
          type: boolean
          description: |
            Came from Heyarr's defaults rather than from an operator. Seeding
            converges on the name and never overwrites, so an edited default
            stays edited — this is how you can tell you are looking at one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WriteQualityProfile:
      type: object
      description: |
        On `POST`, an omitted section is empty. On `PUT`, an omitted section is
        **left alone** and a section sent as `[]` is **cleared**.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        accept:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }

    QualityRule:
      type: object
      description: |
        One assertion about a release: an attribute, a comparison and an
        operand. The same shape serves all three sections — what differs is
        what a failure *means*, and that belongs to the section rather than to
        the rule. One rule type is what lets §63 report all three the same way.

        The attribute vocabulary is **closed**, so a rule can be validated when
        it is written rather than when it is evaluated. Adding an attribute is
        a code change, which is correct: something has to know how to extract
        it from a release, and an attribute nothing populates is a rule that
        silently never matches.
      required: [attribute, op, value]
      properties:
        attribute:
          type: string
          enum:
            [
              audio_channels,
              audio_codec,
              hdr,
              language,
              resolution,
              size_bytes,
              source,
              video_codec,
            ]
          description: |
            `resolution` is vertical lines (480, 720, 1080, 2160) rather than a
            label, because "4K", "2160p" and "UHD" are three spellings of one
            number.

            `source` is **not ordered**, even though there is an obvious
            quality ordering among `remux`, `bluray`, `web-dl` and the rest. An
            ordering here would be a second scoring system living outside
            `prefer`, invisible to §63's reasons — the opaque scoring §61
            rejects. Say "bluray beats webrip" with two preferences instead,
            and it appears in the explanation.
        op:
          type: string
          enum: [eq, neq, gte, lte, in, nin]
          description: |
            `gte` and `lte` are numbers only; `in` and `nin` are names only. A
            comparison that does not apply to the attribute's type is a `400`,
            as is a list operand with `eq` — which would otherwise validate and
            then silently match nothing.
        value:
          description: |
            A bare JSON value whose shape follows the attribute: a whole number,
            a name, a list of names (for `in`/`nin`), or a boolean. The kind is
            read from the JSON and then checked against the attribute, never
            coerced — so `"1080"` against `resolution` is a caught typo rather
            than a working rule.
          oneOf:
            - type: integer
            - type: string
            - type: boolean
            - type: array
              items: { type: string }
        weight:
          type: integer
          description: |
            The score contribution, meaningful **only** in `prefer`. May be
            negative — a penalty is a real thing to want. May not be zero: a
            preference that cannot affect the score is indistinguishable from
            an absent one, and keeping it means an operator believes something
            is being preferred when nothing is.

            A weight on an `accept` or `terminal` rule is a `400`, not an
            ignored field. It is the mistake this design most invites, and
            silently dropping it would leave an operator believing a gate is
            scoring.

    Device:
      type: object
      description: A registered device and the capabilities it declares (§68).
      properties:
        id: { type: string }
        device_key:
          type: string
          description: |
            The client's own stable identifier, and the idempotency key for
            registration. Not a credential and never checked as one.
        name: { type: string }
        platform:
          type: string
          description: Free text — `tvos`, `android`, `web`.
        profile: { $ref: "#/components/schemas/DeviceProfile" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: |
            When this device last registered. The only thing that makes a stale
            row identifiable later.

    DeviceProfile:
      type: object
      description: |
        What a device says it can play. A zero maximum means **no limit
        stated**, which is deliberately different from a limit of zero: a
        client that omits `max_bitrate_bps` is not claiming it can play
        nothing.
      properties:
        containers:
          type: array
          items: { type: string }
        video_codecs:
          type: array
          items: { type: string }
        audio_codecs:
          type: array
          items: { type: string }
        max_width: { type: integer }
        max_height: { type: integer }
        max_bitrate_bps: { type: integer, format: int64 }
        supports_hdr: { type: boolean }

    RegisterDevice:
      type: object
      required: [device_key, name]
      properties:
        device_key: { type: string }
        name: { type: string }
        platform: { type: string }
        profile: { $ref: "#/components/schemas/DeviceProfile" }

    StorageInfo:
      type: object
      properties:
        path: { type: string }
        ok: { type: boolean }

    Readiness:
      type: object
      properties:
        status: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
