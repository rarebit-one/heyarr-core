# The Heyarr JSON API (spec §77).
#
# This document is written by hand and kept honest by a test, not generated
# (ADR-0015). internal/controller/openapi_test.go walks the real router and
# asserts parity in both directions: a route that is served and not documented
# fails, and an operation documented here that is not served fails too.
#
# So: add a route, add it here. The test tells you the exact string to write —
# `go test -run TestRouteInventory -v ./internal/controller`.
#
# Paths are absolute rather than relative to a /api/v1 server URL, because
# /healthz, /readyz and /metrics are real routes that live outside it. With a
# prefixed server URL those three could not be written down at all, and the
# parity test would have to be taught to ignore them — which is the same thing
# as not checking them.
openapi: 3.1.0

info:
  title: Heyarr
  version: "1"
  summary: Headless content lifecycle, replication and consumption for homelabs.
  description: |
    Every error is an RFC 9457 problem document with a stable `type` URI. Clients
    branch on `type` — not on the title, not on the detail, and not on the HTTP
    status alone, which several different conditions share.

    Collections are paginated by keyset with an opaque cursor. `next_cursor` is
    absent on the last page, so "keep going while next_cursor is set" is the
    whole client loop. The cursor's contents are not a contract: it encodes the
    sort key of the last row returned, and a client that parses it breaks the
    first time a sort order changes.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8385
    description: The default loopback bind (ADR-0011).

security:
  - bearerAuth: []

tags:
  - name: content
    description: Works, editions, assets and the libraries they come from.
  - name: bytes
    description: Blob metadata. The bytes themselves are a separate contract (ADR-0013).
  - name: fabric
    description: Peers and replicas.
  - name: operations
    description: Jobs, events, credentials and system state.
  - name: policy
    description: Quality profiles — the standard desired state is measured against (§62).
  - name: desired
    description: What should exist, whether or not it does yet (§55).
  - name: providers
    description: The centralised registry of external services — indexers, download clients (§59).
  - name: mcp
    description: Semantic actions for agents, over JSON-RPC (§71, ADR-0019).
  - name: peer
    description: |
      The inter-peer surface. A SEPARATE listener with a separate credential:
      mutual TLS pinned to peer membership (§26, ADR-0012). No bearer token is
      accepted here and no peer certificate authenticates anything under
      /api/v1.
  - name: personal-state
    description: |
      Encrypted personal state (§38, §42, ADR-0049). A device pushes opaque
      spaces, wrapped keys and ciphertext changes; the server stores them and
      can read none of it. Fetching ciphertext needs `read`; storing it needs
      `write`; a wrapped key no token conveys is what turns ciphertext into
      plaintext, and only on an authorised device (Invariant 6).
  - name: compat
    description: |
      Compatibility adapters that let existing client ecosystems talk to Heyarr
      over their own protocols (§70), as read-only projections over the
      canonical model. OpenSubsonic for music is the first. Mounted outside
      /api/v1 with the protocol's own authentication, and exposing no personal
      state (§72).

paths:
  /healthz:
    get:
      tags: [operations]
      operationId: healthz
      summary: Liveness.
      description: |
        This process is running and its HTTP stack works. It checks nothing else
        on purpose: a liveness probe that fails because the database is busy
        causes a restart loop that makes the database busier.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [operations]
      operationId: readyz
      summary: Readiness.
      description: |
        Whether this process can actually serve requests. Deliberately free of
        anything an unauthenticated caller should not learn — no paths, no
        versions, no counts.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Prometheus metrics.
      description: |
        Authenticated exactly like the API and requiring `read`. Route names,
        library sizes and request patterns are not "just metrics".
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system:
    get:
      tags: [operations]
      operationId: getSystem
      summary: What this node is, what it is running, and how far that has drifted.
      description: |
        The `drift` object answers "how far behind is this instance", and it
        answers with a distance rather than a boolean. A deployment once ran 36
        commits and seven unapplied migrations behind `main`, across two whole
        milestones, and nothing reported it — every input to the check already
        existed and nothing compared them.

        The SCHEMA half needs nothing from the caller: a binary embeds its own
        migrations, so it already knows the highest version that exists and can
        compare that against what is applied. Pass `expected_schema` to compare
        against something else instead.

        The BUILD half cannot be answered alone — a binary has no idea what
        release was supposed to be deployed — so the expectation is supplied per
        request. Without it the build half reports `unknown`, which is
        deliberately not `current`: a check that has quietly stopped comparing
        must not look like a fleet that never drifts.
      parameters:
        - name: expected_version
          in: query
          schema: { type: string }
          description: |
            The version this instance was expected to be running, e.g. `v1.4.0`.
            Ordering is by semantic version when both sides carry one; otherwise
            `expected_commit` decides whether the builds are the same build.
        - name: expected_commit
          in: query
          schema: { type: string }
          description: |
            The commit this instance was expected to be built from. Matched by
            prefix, with a floor of seven characters, so an abbreviated stamp
            still matches its full form.
        - name: expected_schema
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            The schema version its database was expected to be at. Defaults to
            the highest migration THIS binary embeds. A value that is not a
            non-negative integer is rejected rather than ignored: falling back
            to the default would answer a question nobody asked and report
            `current` for it.
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works:
    get:
      tags: [content]
      operationId: listWorks
      summary: Page the catalog.
      description: |
        Ordered by `(sort_title, id)`. The id is in the sort key because
        sort_title is not unique, and a non-unique keyset boundary skips and
        repeats rows exactly as OFFSET does.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
          description: Restrict to one content type.
        - name: library_id
          in: query
          schema: { type: string }
          description: Works with at least one asset in this library.
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over `sort_title`.
      responses:
        "200":
          description: A page of works.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/works/{id}:
    get:
      tags: [content]
      operationId: getWork
      summary: One work.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/editions/{id}:
    get:
      tags: [content]
      operationId: getEdition
      summary: One edition.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The edition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/assets:
    get:
      tags: [content]
      operationId: listAssets
      summary: Page the files.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: library_id
          in: query
          schema: { type: string }
        - name: content_type
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [present, missing] }
          description: |
            `missing` is an asset whose source path has vanished. It is not a
            deletion: the catalog row and any blob both remain (ADR-0018).
      responses:
        "200":
          description: A page of assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/assets/{id}:
    get:
      tags: [content]
      operationId: getAsset
      summary: One asset.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [content]
      operationId: deleteAsset
      summary: Delete an asset. Requires `write`.
      description: |
        Logical, per ADR-0018. The asset stops existing; its blob does not. A
        later `gc_blobs` sweep reclaims blobs that no asset references, once a
        grace window has passed — which is what makes a mistaken delete
        reversible. Nothing is unlinked inside this request.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204":
          description: Deleted. No bytes were removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries:
    get:
      tags: [content]
      operationId: listLibraries
      summary: Page the libraries, each with its roots.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: content_type
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring match over the name.
      responses:
        "200":
          description: A page of libraries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [content]
      operationId: createLibrary
      summary: Create a library. Requires `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content_type]
              additionalProperties: false
              properties:
                name: { type: string }
                content_type: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/spaces:
    get:
      tags: [personal-state]
      operationId: listSpaces
      summary: The encrypted spaces this peer holds — metadata only (§38).
      description: |
        Returns each space's opaque id, structural kind and when the peer
        recorded it. There is no name, no member list and no key: those are
        encrypted state, never metadata a peer stores.
      responses:
        "200":
          description: The spaces this peer holds (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces:
                    type: array
                    items: { $ref: "#/components/schemas/EncryptedSpace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [personal-state]
      operationId: createSpace
      summary: Record a client-minted space and the wrapped copies of its key. Requires `write`.
      description: |
        The device mints the space id and space key together and seals the key
        for each recipient client-side; this stores the opaque space and the
        wrapped copies. The server holds a key it cannot open (ADR-0049).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind]
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: The client-minted opaque space id (a UUIDv7).
                kind:
                  type: string
                  enum: [personal, family, shared, research]
                wrapped_keys:
                  type: array
                  items: { $ref: "#/components/schemas/WrappedKeyInput" }
      responses:
        "201":
          description: The space, as recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptedSpace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/spaces/{id}/keys:
    get:
      tags: [personal-state]
      operationId: listSpaceWrappedKeys
      summary: The wrapped copies of a space's key — a device finds the one sealed for it.
      description: |
        Each entry names the recipient key the copy was sealed for and the
        opaque wrapped bytes. The peer holds these and no private key, so it
        cannot open any of them (Invariant 6).
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The wrapped keys for the space (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [space_id, wrapped_keys]
                properties:
                  space_id: { type: string }
                  wrapped_keys:
                    type: array
                    items: { $ref: "#/components/schemas/WrappedKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [personal-state]
      operationId: rewrapSpaceKeys
      summary: Re-wrap a space's key for the remaining recipients after a rotation. Requires `write`.
      description: |
        Replaces the wrapped copies of a space's key — the remaining recipients'
        copies now seal the NEW key minted by a rotation (§41, #361). Each copy is
        opaque; the peer upserts it and opens none. The revoked recipient's copy is
        deleted separately via DELETE /spaces/{id}/keys/{recipient}.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrapped_keys]
              additionalProperties: false
              properties:
                wrapped_keys:
                  type: array
                  items: { $ref: "#/components/schemas/WrappedKeyInput" }
      responses:
        "200":
          description: How many recipient copies were replaced.
          content:
            application/json:
              schema:
                type: object
                required: [rewrapped]
                properties:
                  rewrapped: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{id}/keys/{recipient}:
    delete:
      tags: [personal-state]
      operationId: revokeSpaceKey
      summary: Delete one recipient's wrapped copy of a space's key — revocation. Requires `admin`.
      description: |
        Deletes the wrapped copy sealed for one recipient (§41, ADR-0049, #361).
        After it, that recipient holds no copy of the key; combined with a rotation
        that re-keys for everyone else, the revoked device can read nothing
        encrypted from here on. Idempotent: deleting a copy already gone is a 204,
        not a 404.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - name: recipient
          in: path
          required: true
          description: The recipient key id ("x25519:<hex>"), URL-escaped.
          schema: { type: string }
      responses:
        "204":
          description: The wrapped copy is gone (or was already).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{id}/changes:
    get:
      tags: [personal-state]
      operationId: listSpaceChanges
      summary: A space's encrypted changes — ciphertext a device pulls to decrypt and merge (§42).
      description: |
        Every change is opaque: a content-addressed id, its causal parents, and
        ciphertext. The peer never decrypted any of it; the semantic merge is
        client-side.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The changes the peer holds for the space (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [space_id, changes]
                properties:
                  space_id: { type: string }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/EncryptedChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [personal-state]
      operationId: putSpaceChange
      summary: Store one encrypted change; the peer verifies its content-address. Requires `write`.
      description: |
        The peer re-derives the change's blake3 id over its space, parents and
        ciphertext and refuses a mismatch — it never trusts a claimed id
        (Invariant 1). It stores the ciphertext without decrypting it.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptedChange" }
      responses:
        "201":
          description: The id the peer verified and stored the change under.
          content:
            application/json:
              schema:
                type: object
                required: [change_id]
                properties:
                  change_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{id}/snapshot:
    get:
      tags: [personal-state]
      operationId: getSpaceSnapshot
      summary: The latest encrypted snapshot for a space — ciphertext (§44).
      description: |
        Returns the most recent snapshot the peer holds — a materialised CRDT
        state at a causal point, as ciphertext the peer never decrypted — so a
        joining device syncs a bounded snapshot plus the tail rather than the
        whole log. 404 when the space has no snapshot yet.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The latest snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptedSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{id}/snapshots:
    post:
      tags: [personal-state]
      operationId: putSpaceSnapshot
      summary: Push a materialised, encrypted snapshot. Requires `write`.
      description: |
        The device materialises the state and encrypts it under the space key;
        this stores the opaque snapshot after verifying its content-address
        (Invariant 1). The server never materialises it (§44).
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptedSnapshot" }
      responses:
        "201":
          description: The id the peer verified and stored the snapshot under.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id]
                properties:
                  snapshot_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/spaces/{id}/compact:
    post:
      tags: [personal-state]
      operationId: compactSpace
      summary: Drop the changes the latest snapshot subsumes and every replica holds. Requires `admin`.
      description: |
        Compacts the change log: drops changes the latest snapshot subsumes and
        that lie within the acknowledged frontier (the frontier every trusted Full
        Peer holds), so a change a partitioned peer still needs survives (§44).
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frontier]
              additionalProperties: false
              properties:
                frontier:
                  type: array
                  items: { type: string }
                  description: The acknowledged causal frontier every replica holds.
      responses:
        "200":
          description: How many changes were compacted.
          content:
            application/json:
              schema:
                type: object
                required: [dropped]
                properties:
                  dropped: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/state/replicate:
    post:
      tags: [personal-state]
      operationId: replicatePersonalState
      summary: Reconcile encrypted personal state to all trusted Full Peers now. Requires `admin`.
      description: |
        Runs one on-demand reconcile: for every local space, push its metadata,
        wrapped keys and the changes each Full Peer is missing, as ciphertext
        (§37, §45). Leaderless and idempotent — a converged fleet is a no-op — and
        an unreachable peer is recorded and retried next cycle, not an error.
      responses:
        "200":
          description: How many (peer, space) pairs converged and how many were deferred.
          content:
            application/json:
              schema:
                type: object
                required: [replicated, deferred]
                properties:
                  replicated: { type: integer }
                  deferred: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: This node replicates encrypted state to no peers.

  /api/v1/libraries/{id}:
    get:
      tags: [content]
      operationId: getLibrary
      summary: One library, with its roots.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/libraries/{id}/roots:
    post:
      tags: [content]
      operationId: createLibraryRoot
      summary: Add a root to a library. Requires `write`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string }
                ingest_mode:
                  type: string
                  enum: [reflink, hardlink, copy, link]
                  default: reflink
                  description: |
                    How ingest materialises bytes into the CAS (ADR-0014).
                    `link` catalogues files where they are and never copies them
                    (ADR-0020).
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRoot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/libraries/{id}/scan:
    post:
      tags: [content]
      operationId: scanLibrary
      summary: Enqueue a scan. Requires `write`.
      description: |
        One `scan_library` job per enabled root, because the scanner's job is
        root-scoped. A library with two roots therefore yields two jobs, and a
        client waiting on the scan must wait on all of them — waiting on the
        first only is how a CLI exits 0 with half the library unscanned.

        Enqueueing is idempotent while a scan of the same root is still live: a
        second request returns the running job rather than queueing a second
        walk of the same tree (ADR-0008).
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "202":
          description: Accepted; the jobs are queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_id: { type: string }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The library has no enabled roots, so there is nothing to scan.
            Returning 202 here would let a client believe a scan is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/blobs/{hash}:
    get:
      tags: [bytes]
      operationId: getBlob
      summary: Blob metadata.
      description: |
        Metadata only. The bytes are served by `/api/v1/blobs/{hash}/content`,
        which is deliberately a separate contract with four consumers
        (ADR-0013).
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: The blob record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/renderers:
    get:
      tags: [playback]
      operationId: listRenderers
      summary: List the renderers on this node's network (§68).
      description: >-
        Televisions, speakers and projectors that Heyarr can play to, found by
        SSDP on the local segment.


        An empty list means nothing ANSWERED, not that nothing is there. A
        screen in standby closes every listener and on some models leaves the
        network entirely, so a device that is switched off is indistinguishable
        from one that does not exist. Discovery is also multicast, so it does
        not cross a routed link: a controller on the far side of a VPN finds
        nothing at all.
      parameters:
        - name: refresh
          in: query
          required: false
          description: >-
            `true` searches again instead of reusing the cached sweep. A search
            takes several seconds, so this is for "I just switched it on".
          schema: { type: string }
      responses:
        '200':
          description: What answered.
        '401': { $ref: "#/components/responses/Unauthorized" }
  /api/v1/renderers/{udn}/status:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    get:
      tags: [playback]
      operationId: getRendererStatus
      summary: Report what a renderer is doing.
      description: >-
        Transport state and, when the device reports one, position. A renderer
        that answers no position is not broken — `NOT_IMPLEMENTED` is a legal
        answer and some devices give it forever.
      responses:
        '200':
          description: The renderer's state.
        '404':
          description: No renderer with that id answered.
        '502':
          description: The renderer did not answer.
  /api/v1/renderers/{udn}/play:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    post:
      tags: [playback]
      operationId: playOnRenderer
      summary: Plan a playback, mint a capability URL and push it to a renderer.
      description: >-
        One call, deliberately. Plan, mint and push always happen together, and
        a client made to orchestrate them is a client that can get the order
        wrong, hold a capability it never uses, or open a session for a
        playback it never started.


        The renderer's own `GetProtocolInfo` answer becomes the Device profile
        the planner decides against, so the file is judged on what that
        television said about itself rather than on what somebody typed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: { type: string }
      responses:
        '200':
          description: Playing.
        '409':
          description: >-
            Nothing to play from — most often a replica on another peer, since
            a capability is only valid at the peer that signed it (ADR-0040).
        '502':
          description: >-
            The renderer refused, with its own UPnP error. `714 Illegal
            MIME-type` and `701 Transition not available` are different
            problems and need different fixes, so the device's answer is
            passed through rather than flattened.
  /api/v1/renderers/{udn}/pause:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    post:
      tags: [playback]
      operationId: pauseRenderer
      summary: Hold position.
      responses:
        '200': { description: The renderer's state after pausing. }
        '502': { description: The renderer refused. }
  /api/v1/renderers/{udn}/resume:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    post:
      tags: [playback]
      operationId: resumeRenderer
      summary: Continue from where it was paused.
      description: >-
        This is UPnP's Play. There is no separate resume verb: Play from
        PAUSED_PLAYBACK continues, and Play from STOPPED restarts.
      responses:
        '200': { description: The renderer's state after resuming. }
        '502': { description: The renderer refused. }
  /api/v1/renderers/{udn}/stop:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    post:
      tags: [playback]
      operationId: stopRenderer
      summary: End playback and release the content.
      responses:
        '200': { description: The renderer's state after stopping. }
        '502': { description: The renderer refused. }
  /api/v1/renderers/{udn}/seek:
    parameters:
      - name: udn
        in: path
        required: true
        description: The renderer's UPnP UDN, from `GET /api/v1/renderers`.
        schema: { type: string }
    post:
      tags: [playback]
      operationId: seekRenderer
      summary: Jump to a position.
      description: >-
        `seconds` is an ABSOLUTE offset from the start, not a delta. It maps to
        UPnP's REL_TIME, which means the same thing despite its name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: { type: number, minimum: 0 }
      responses:
        '200': { description: The renderer's state after seeking. }
        '502': { description: The renderer refused. }
  /render/{capability}:
    parameters:
      - name: capability
        in: path
        required: true
        description: >-
          A signed, expiring, single-blob capability minted by
          `POST /api/v1/playback`. It IS the authority for this request — there
          is no other credential — so treat it as a secret.
        schema:
          type: string
    get:
      tags: [bytes]
      operationId: getRenderContent
      security: []
      summary: Serve one blob to a device that cannot present a credential.
      description: >-
        The renderer route of ADR-0040, and the only unauthenticated content
        path in Heyarr. It exists because a television, a speaker or a
        projector is handed a URL and told to fetch it: it cannot send an
        `Authorization` header, and `/api/v1/blobs/{hash}/content` therefore
        answers every such device with 401.


        This is NOT a second way to read the library. The capability in the
        path names ONE blob and expires, so a leaked URL discloses one title
        for one window rather than everything. It is mounted outside
        `/api/v1` deliberately — inside it, the bearer requirement would 401
        the very devices it exists for.


        Bytes, ranges and validators are identical to the blob endpoint: this
        route wraps that handler rather than reimplementing it. The one
        difference is `Content-Type`, which is the Asset's declared media type
        rather than `application/octet-stream`, because a DLNA renderer
        refuses the latter. The type is signed into the capability, so it
        cannot be altered in transit.


        A capability is only valid at the peer that signed it.
      responses:
        '200':
          description: The whole blob, typed as the Asset says.
          headers:
            Accept-Ranges:
              schema: { type: string, const: bytes }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The requested range.
          headers:
            Content-Range:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        '404':
          description: >-
            No content is available at this address. Every refusal is this
            response, byte for byte: an expired capability, one signed by
            another peer, a malformed one and a blob this peer does not hold
            are deliberately indistinguishable, so the route cannot be used as
            an oracle. The `instance` is a constant for the same reason — it
            would otherwise echo the capability back.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '416':
          description: The requested range lies outside the blob.
    head:
      tags: [bytes]
      operationId: headRenderContent
      security: []
      summary: Report size and range support to a renderer before it fetches.
      description: >-
        Identical to `get` in every header, with no body. Renderers routinely
        HEAD before they GET, and one that receives a 405 gives up without
        playing anything.
      responses:
        '200':
          description: The blob exists; `Content-Length` is its size.
          headers:
            Accept-Ranges:
              schema: { type: string, const: bytes }
        '404':
          description: See `get`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /render/{capability}/{name}:
    parameters:
      - name: capability
        in: path
        required: true
        description: As above.
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: >-
          A cosmetic trailing filename, ignored entirely. Some renderers will
          not issue a GET for a URL whose last segment looks like nothing they
          recognise. It is outside the signature because it decides nothing:
          both the media type and the bytes come from the capability.
        schema:
          type: string
    get:
      tags: [bytes]
      operationId: getRenderContentNamed
      security: []
      summary: As `/render/{capability}`, with a filename a renderer will accept.
      responses:
        '200':
          description: The whole blob.
        '206':
          description: The requested range.
        '404':
          description: See `/render/{capability}`.
    head:
      tags: [bytes]
      operationId: headRenderContentNamed
      security: []
      summary: As `/render/{capability}`, with a filename a renderer will accept.
      responses:
        '200':
          description: The blob exists.
        '404':
          description: See `/render/{capability}`.
  /pair/sessions/{session}/slots/{slot}:
    parameters:
      - name: session
        in: path
        required: true
        description: >-
          A rendezvous label the two devices agree on out of band (the old
          device generates it and shows it, in a QR or a short code, to the
          new one). It is NOT a secret — the pairing's security is the short
          authentication string the humans compare, not the obscurity of this
          id — and a URL-safe token of at most 128 characters.
        schema:
          type: string
      - name: slot
        in: path
        required: true
        description: >-
          One of the fixed handshake slots: `initiator_commit`,
          `responder_commit`, `initiator_reveal`, `responder_reveal`, `cert`
          or `abort`. Any other name is a 400.
        schema:
          type: string
          enum: [initiator_commit, responder_commit, initiator_reveal, responder_reveal, cert, abort]
    put:
      tags: [pairing]
      operationId: putPairSlot
      security: []
      summary: Post one value into a pairing handshake slot (§40, ADR-0022, ADR-0038).
      description: >-
        The device-pairing relay, and — with `render` — one of Heyarr's two
        unauthenticated surfaces. It exists because enrolment is PAIRING, not
        sharing (ADR-0022): a new device that is not yet enrolled has no
        credential to present, and the old device authorises it directly, with
        the server acting only as a dumb store-and-forward.


        Every value that crosses this relay is PUBLIC — a commitment (a hash),
        a public key, a session salt, or a signed enrolment cert — so a relay
        that read every byte would still learn nothing it could pair with
        (ADR-0038). The relay never joins two sessions, never inspects a value
        and vouches for nothing; the man-in-the-middle defence is the
        commit-before-reveal ordering and the short authentication string the
        two humans compare, neither of which this endpoint can see or affect.


        Slots are write-once: a second PUT of the same bytes is idempotent, a
        different value to a written slot is a 409. Sessions are in-memory,
        bounded and short-lived (a ten-minute TTL, a per-slot size cap, a cap
        on live sessions), which is the whole security surface of serving this
        without a credential — it grants no authority, so the only abuse is
        memory, and the bounds close it.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: The value was stored (or an identical value already was).
        '400':
          description: An unknown slot name or a malformed session id.
        '409':
          description: The slot already holds a different value; slots are write-once.
        '413':
          description: The value is larger than the per-slot cap.
        '429':
          description: Too many live pairing sessions; try again once some expire.
    get:
      tags: [pairing]
      operationId: getPairSlot
      security: []
      summary: Read one value from a pairing handshake slot.
      description: >-
        The other half of the relay: the peer polls the slot it is waiting on
        until it appears. Returns the opaque bytes another device posted, or a
        404 while the slot is still empty (which is the ordinary "keep
        waiting") or once the session has expired.
      responses:
        '200':
          description: The stored value.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: A malformed session id.
        '404':
          description: Nothing is stored at this slot yet, or the session has expired.
  /enrol:
    post:
      tags: [pairing]
      operationId: selfEnrolDevice
      security: []
      summary: A paired device enrols itself at this peer (ADR-0067, ADR-0068).
      description: >-
        The step after pairing. A device that holds its admitting membership op
        — a cert the user's genesis key signed for its key, or (ADR-0068) an
        `add` signed by any current member of the identity — presents that op
        and a fresh possession proof over it — the exact two halves of the
        `Device` credential — and is recorded under its pinned user, with no
        admin call to `/api/v1/identities/devices` in between.


        It is public because the device may not yet be known here and so
        cannot authenticate; it grants nothing because the op, evaluated with
        the identity's op log (voidbind-go ADR-0007), already proves a member
        vouched for the device and the proof proves the caller holds the key.
        Verification is the same code the `Device` scheme runs on every
        request: the op's user must be PINNED here (ADR-0032's gate holds — an
        unknown user's op is refused), the possession proof must be signed by
        the op's device key over this op and be fresh, and the membership
        evaluated over the ops this node holds plus `ops` must admit the
        device. A device admitted by a member this node has never met MUST
        send that member's admission in `ops` (or the `Voidbind-Membership`
        header), or its own admission cites a past the node cannot judge.
        The enrolled device authenticates at the READ floor; write remains an
        admin authorisation of the device key (ADR-0065).


        Under ADR-0068 the evaluation itself materialises the device's row
        (a member authenticates on first contact); what this route adds is
        the NAME and the created/existing answer. Idempotent on the device
        key: a re-submission returns the existing device with a 200. A
        REVOKED device is not re-enrolled, and an op naming a different user
        than the row holds is refused. Every refusal is the same opaque 401
        the `Device` scheme returns; the reason is logged, not disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                op:
                  type: string
                  description: >-
                    The device's admitting membership op token (a v3 `add`, or
                    a v1/v2 cert — the same slot). Exactly one of `op` and
                    `cert` is required; both is accepted when they are equal.
                cert:
                  type: string
                  description: >-
                    The ADR-0067 spelling of `op`, kept for clients that send a
                    user-signed cert; it carries a v3 op just as well.
                proof:
                  type: string
                  description: >-
                    A fresh possession proof over the op (the value after the
                    `~` in a `Device` credential): `{"v":2,"crt":base64url(sha256(op)),"iat","exp"}`
                    signed by the device key, `exp - iat` of 120 seconds.
                name:
                  type: string
                  description: A display name for the device; defaults to `device`.
                ops:
                  type: array
                  items: { type: string }
                  maxItems: 64
                  description: >-
                    Membership op tokens the device knows (ADR-0068), merged
                    into the evaluation exactly as the `Voidbind-Membership`
                    header is on an authenticated request. At most 64 in total
                    across body and header.
      responses:
        '201':
          description: The device was enrolled.
          headers:
            Location:
              schema: { type: string }
              description: The device's admin resource under `/api/v1/identities/devices/{key}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrolledDevice'
        '200':
          description: The device was already enrolled; this is its existing record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrolledDevice'
        '400':
          description: The body is not a single JSON object of the documented fields, is too large, or presents more than 64 ops.
        '401':
          description: >-
            The credential was rejected — for any reason (unpinned user, bad
            signature, expired add, an admission citing ops this node cannot
            see, a removed device, wrong or stale proof, revoked device). The
            detail is the same in every case.
  /membership/{usr}:
    parameters:
      - name: usr
        in: path
        required: true
        schema: { type: string }
        description: The identity — its genesis public key, `ed25519:<hex>`.
    get:
      tags: [pairing]
      operationId: getMembership
      security: []
      summary: The membership ops this node holds for an identity (ADR-0068).
      description: >-
        Every membership op token (voidbind-go ADR-0007: `add` / `remove`,
        signed by a member or by the genesis key) this node has recorded for
        the identity, oldest issued first. A device merges them with its own
        and evaluates; the node does not pre-chew a view, because a view is a
        function of the ops and the reader's clock. This is how a device
        learns that a member removed it, or another device, while it was
        offline. Public: an op carries its own authority and the node adds
        none by serving it; the identity's genesis key is not guessable, so
        there is nothing to enumerate.
      responses:
        '200':
          description: The recorded ops.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: "`usr` is not a rendered Ed25519 public key."
        '404':
          description: No such identity is pinned here.
    post:
      tags: [pairing]
      operationId: pushMembership
      security: []
      summary: Push membership ops to this node (ADR-0068).
      description: >-
        Records ops a device signed or learned — a `remove`, typically — so the
        node evaluates them from now on. The ops are evaluated merged with the
        log first and recorded only if EVERY one is structurally valid for
        this identity (parses, verifies under its signer, names this identity,
        cites ops the node can see): junk anywhere in the body is one opaque
        401 and nothing is written. A valid but ineffective op (an
        unauthorised signer, an outranked remove, a re-add of a removed
        device) IS recorded — it is part of the state — and evaluation is what
        decides it changes nothing. Idempotent by op hash. A device the
        evaluation removes is tombstoned in the node's view at once, exactly as
        an admin revocation is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 64
                  description: Membership op tokens.
      responses:
        '200':
          description: The ops were evaluated and the new ones recorded; the whole log follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: "The body is not a single JSON object of the documented fields, is too large, has no ops, or has more than 64; or `usr` is not a key."
        '401':
          description: At least one op was rejected. The detail is the same in every case; the reason is logged.
        '404':
          description: No such identity is pinned here.
  /pair/v1/sessions:
    post:
      tags: [pairing]
      operationId: createVoidbindPairSession
      security: []
      summary: Open a Voidbind pairing session (ADR-0066).
      description: >-
        The Voidbind relay — voidbind-go's `relay` protocol, which the
        `voidbind` CLI (`pair-initiate` / `pair-join`) and the phone client
        speak — mounted beside the legacy `/pair` relay so this node can be
        the rendezvous for its own devices. A Voidbind client is pointed at
        `<node>/pair` as its relay BASE (the client appends `/v1/...` itself,
        exactly as against a standalone `voidbind relay`) and lands here.


        Like `/pair` it is public and grants nothing: an in-memory, write-once,
        opaque blob store addressed by (session, role, type) that never parses
        a payload and holds no key. What crosses it is either public (two
        commitments, two revealed public keys) or ciphertext it cannot open
        (the enrolment cert, sealed to the new device's X25519 key). The
        initiator — the machine holding the user identity — opens the session
        and shares its id and a salt with the new device out of band (the
        invite QR).
      responses:
        '200':
          description: The session was opened.
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id:
                    type: string
                    description: The rendezvous label both devices dial; not a secret.
        '503':
          description: Too many live sessions; try again once some expire.
  /pair/v1/sessions/{id}/{role}/{type}:
    parameters:
      - name: id
        in: path
        required: true
        description: The session id returned when the session was opened.
        schema:
          type: string
      - name: role
        in: path
        required: true
        description: >-
          Whose slot: `initiator` (the existing, authorising device) or
          `responder` (the new device). Each role writes only its own slots
          and reads only the peer's.
        schema:
          type: string
          enum: [initiator, responder]
      - name: type
        in: path
        required: true
        description: >-
          The message slot: `commit` (a commitment over the keys about to be
          revealed), `reveal` (the revealed public keys, JSON), or `cert` (the
          sealed enrolment cert, initiator only).
        schema:
          type: string
          enum: [commit, reveal, cert]
    put:
      tags: [pairing]
      operationId: putVoidbindPairSlot
      security: []
      summary: Store one role's message in a Voidbind pairing session (ADR-0066).
      description: >-
        Write-once: a second PUT of a slot is a 409 whatever the value, so a
        confused or hostile participant cannot replace its own commitment
        after the peer has read it. The same per-message byte cap, live-session
        cap and ten-minute TTL as the legacy relay bound the abuse surface.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: The message was stored.
        '404':
          description: An unknown role or type, or no such (or an expired) session.
        '409':
          description: The slot is already written; slots are write-once.
        '413':
          description: The message is larger than the per-message cap.
    get:
      tags: [pairing]
      operationId: getVoidbindPairSlot
      security: []
      summary: Read one role's message from a Voidbind pairing session.
      description: >-
        The peer polls the slot it is waiting on until it appears. Returns the
        opaque bytes the named role stored, or a 404 while the slot is still
        empty (the ordinary "keep waiting") or once the session has expired.
      responses:
        '200':
          description: The stored message.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Not yet written, an unknown role or type, or no such session.
  /rest/{method}:
    parameters:
      - name: method
        in: path
        required: true
        description: >-
          The OpenSubsonic method, optionally with the legacy `.view` suffix
          (`ping`, `getArtists`, `getAlbumList2`, `getAlbum`, `stream`, …). The
          method vocabulary is the OpenSubsonic specification's, not Heyarr's —
          which is why this is one compatibility endpoint rather than forty
          hand-written operations.
        schema:
          type: string
      - name: u
        in: query
        required: true
        description: The Subsonic username. Carried for protocol compatibility; the credential is `p`.
        schema: { type: string }
      - name: p
        in: query
        description: >-
          The password a Subsonic client sends — for Heyarr, a bearer token
          (optionally `enc:<hex>`-encoded), mapped onto the same tokens and
          scopes the rest of the API uses. The salted-token pair (`t`+`s`) is
          NOT supported: Heyarr keeps tokens argon2id-hashed and never holds the
          plaintext to recompute the MD5, so it is refused with error 40.
        schema: { type: string }
      - name: f
        in: query
        description: Response format, `xml` (default) or `json`.
        schema: { type: string, enum: [xml, json] }
      - name: c
        in: query
        description: The client application name (protocol handshake).
        schema: { type: string }
      - name: v
        in: query
        description: The Subsonic protocol version the client speaks.
        schema: { type: string }
    get:
      tags: [compat]
      operationId: subsonicMethod
      security: []
      summary: The OpenSubsonic compatibility adapter (§70, M11).
      description: >-
        A read-only projection of Heyarr's server-readable catalogue onto the
        OpenSubsonic REST protocol, so an existing music client can browse the
        library and play from it without Heyarr owning a client. It is mounted
        outside `/api/v1` and authenticates in the protocol's own terms, for the
        same reason `render` and `pair` are: a Subsonic client cannot present a
        Heyarr bearer credential in an `Authorization` header.


        It exposes NO personal state. Playlists, play-counts, scrobbles and
        starred items are encrypted and opaque to the controller (Invariant 6,
        §72): the server holds no key, so it cannot serve them faithfully and
        must not fake them. They belong to a device-side Personal MCP (§73).
        History/starred list types return empty rather than a fabricated
        ranking, and the playlist methods are simply not served.


        `stream` and `download` resolve a track to a blob hash and delegate to
        the ordinary blob route (ADR-0013): Range, 206 and progressive partial
        serving are inherited, and the adapter neither reimplements byte serving
        nor reshapes the canonical model to suit the protocol (§70).
      responses:
        '200':
          description: >-
            For browse and handshake methods, the Subsonic response envelope in
            the requested format — always HTTP 200, with success or failure
            carried inside as `status`. For `stream`/`download`, the track's
            bytes.
          content:
            application/xml:
              schema: { type: string }
            application/json:
              schema: { type: object }
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: A byte range of a track (`stream`/`download` with a `Range` header).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    head:
      tags: [compat]
      operationId: subsonicMethodHead
      security: []
      summary: Headers for an OpenSubsonic method (chiefly `stream`/`download`).
      description: The HEAD counterpart, used by clients probing a track's size before streaming it.
      responses:
        '200':
          description: Headers only, no body.
  /opds:
    get:
      tags: [compat]
      operationId: opdsRoot
      security: []
      summary: The OPDS catalog root (§69, §70, M11).
      description: >-
        The OPDS 1.2 compatibility adapter for publications — the Atom profile
        real readers speak (KOReader, Foliate, Marvin, Chunky, Panels) — as a
        read-only projection of Heyarr's server-readable publication catalogue,
        so an existing reader can browse the library and download from it without
        Heyarr owning a client. This is the navigation feed: a menu whose one
        entry descends into the acquisition feed.


        Mounted outside `/api/v1` and authenticated with HTTP **Basic**, for the
        same reason `render`, `pair` and `rest` are outside it: an OPDS reader
        cannot present a Heyarr bearer credential in the group's scheme. The
        password a reader sends is a Heyarr bearer token, mapped onto the same
        tokens and `read` scope the rest of the API uses; a missing or bad
        credential is a real 401 with a `WWW-Authenticate: Basic` challenge.


        It exposes NO personal state: reading position, bookmarks and shelves are
        encrypted and opaque to the controller (Invariant 6, §72) and belong to
        a device-side Personal MCP (§73), not this adapter.
      responses:
        '200':
          description: The navigation feed, as OPDS 1.2 Atom XML.
          content:
            application/atom+xml:
              schema: { type: string }
        '401':
          description: No or bad credential; carries an HTTP Basic authentication challenge.
  /opds/publications:
    get:
      tags: [compat]
      operationId: opdsPublications
      security: []
      summary: The OPDS acquisition feed — every downloadable publication.
      description: >-
        One Atom entry per book, each carrying its title and author and an
        acquisition link per streamable format (EPUB, PDF, CBZ, …) with that
        format's media type. A publication is a book Work, a format is an
        Edition, the bytes are an Asset; the canonical model is not reshaped to
        suit OPDS (§70). Only formats backed by a blob are offered — a linked
        asset has no bytes (ADR-0020), so it is never advertised as acquirable.
      responses:
        '200':
          description: The acquisition feed, as OPDS 1.2 Atom XML.
          content:
            application/atom+xml:
              schema: { type: string }
        '401':
          description: No or bad credential; carries an HTTP Basic authentication challenge.
  /opds/download/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The edition (format) id an acquisition link points at.
        schema:
          type: string
    get:
      tags: [compat]
      operationId: opdsDownload
      security: []
      summary: Download one publication format.
      description: >-
        Resolves the edition to a blob hash and a server-known media type and
        delegates byte serving to the ordinary blob route (ADR-0013): Range and
        206 are inherited, not reimplemented, past the point where Basic auth has
        decided the caller may read.
      responses:
        '200':
          description: The publication's bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: A byte range (with a `Range` header).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: No or bad credential; carries an HTTP Basic authentication challenge.
        '404':
          description: No such publication, or the edition has no downloadable blob.
    head:
      tags: [compat]
      operationId: opdsDownloadHead
      security: []
      summary: Headers for a publication download (size before fetching).
      description: The HEAD counterpart, used by a reader probing a format's size.
      responses:
        '200':
          description: Headers only, no body.
  /dlna/description.xml:
    get:
      tags: [compat]
      operationId: dlnaDescription
      security: []
      summary: The DLNA/UPnP MediaServer device description (§70, #202).
      description: >-
        The root device document a UPnP control point — a television, a speaker
        — fetches first to learn this is a MediaServer and where its
        ContentDirectory service lives. Served unauthenticated, like the
        renderer and pairing routes, because the device that reads it has no
        credential to present. SSDP LAN advertisement is a tracked follow-up; a
        control point given this URL browses and plays without discovery.
      responses:
        '200':
          description: The UPnP device description XML.
          content:
            application/xml:
              schema: { type: string }
  /dlna/ContentDirectory.xml:
    get:
      tags: [compat]
      operationId: dlnaContentDirectorySCPD
      security: []
      summary: The ContentDirectory service description (SCPD).
      description: >-
        Describes the one action this service implements — Browse — and the
        arguments it takes, so a control point can build a request. A constant
        document; the service does not vary per instance.
      responses:
        '200':
          description: The UPnP service description XML.
          content:
            application/xml:
              schema: { type: string }
  /dlna/control/ContentDirectory:
    post:
      tags: [compat]
      operationId: dlnaBrowse
      security: []
      summary: The ContentDirectory SOAP control endpoint (Browse).
      description: >-
        Answers the SOAP Browse action over a read-only projection of the
        server-readable catalogue (§70): a folder per content type, its playable
        items inside. The reply is DIDL-Lite whose resource URLs are render
        capabilities (ADR-0040) — the device fetches bytes from the
        unauthenticated render route, which exists precisely because it has no
        Authorization header. Only assets the render route can serve become
        items; the model is never reshaped to suit UPnP. Browse is the only
        action implemented; another returns a SOAP UPnPError fault, not a 404.
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
      responses:
        '200':
          description: A BrowseResponse SOAP envelope carrying DIDL-Lite.
          content:
            text/xml:
              schema: { type: string }
        '500':
          description: A SOAP fault carrying a UPnP error code (e.g. 701 no such object, 401 invalid action).
          content:
            text/xml:
              schema: { type: string }
  /api/v1/blobs/{hash}/content:
    parameters:
      - name: hash
        in: path
        required: true
        description: The BLAKE3 digest that names the blob, as `blake3:<64 lowercase hex characters>`.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [bytes]
      operationId: getBlobContent
      summary: Serve a blob's bytes, whole or by range.
      description: >-
        The byte-serving contract of spec §28, and deliberately one endpoint
        with four consumers: direct playback, remote ffprobe (§29),
        replication, and HTTP web-seeding (§27). See ADR-0013 — it is not "the
        playback endpoint" and must not be tuned as one.


        The response carries a strong `ETag` derived from the content, and
        `Cache-Control: public, max-age=31536000, immutable`. Immutable caching
        is correct here rather than risky because the URL is the digest: this
        path can never mean different bytes. No `Last-Modified` is sent —
        a modification time is a property of one peer's copy, and two peers
        holding identical bytes must advertise identical validators.


        The media type is always `application/octet-stream`: the content store
        knows the digest and the length and nothing else. What the bytes mean
        is catalog metadata.
      parameters:
        - name: download
          in: query
          required: false
          description: >-
            `1`, `true` or `yes` adds `Content-Disposition: attachment`. The
            bytes, ranges and validators are identical either way.
          schema:
            type: string
      responses:
        '200':
          description: The whole blob.
          headers:
            ETag:
              description: '`"blake3-<hex digest>"`.'
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Cache-Control:
              schema: { type: string }
            Content-Disposition:
              description: Present only when `download` was requested.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The requested range or ranges.
          headers:
            Content-Range:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404':
          description: This peer holds no such blob. Ask another peer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '416':
          description: The requested range lies outside the blob.
          headers:
            Content-Range:
              description: '`bytes */<size>`.'
              schema: { type: string }
    head:
      tags: [bytes]
      operationId: headBlobContent
      summary: Report a blob's size and range support without transferring it.
      description: >-
        Identical to `get` in every header, with no body. This is how a remote
        prober or a replication client learns the length and confirms range
        support before it starts.
      responses:
        '200':
          description: The blob exists; `Content-Length` is its size.
          headers:
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Content-Length:
              schema: { type: integer, format: int64 }
        '206':
          description: The blob exists and the requested range is satisfiable.
          headers:
            Content-Range:
              schema: { type: string }
        '400': { $ref: "#/components/responses/BadRequest" }
        '401': { $ref: "#/components/responses/Unauthorized" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '416':
          description: The requested range lies outside the blob.

  /api/v1/peers:
    get:
      tags: [fabric]
      operationId: listPeers
      summary: Page the peers.
      description: |
        A paginated collection even though Milestone 1 has exactly one peer
        (ADR-0010). A client written against a single-object response would have
        to be rewritten for Milestone 4, and the ones that are not keep showing
        one peer.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: mode
          in: query
          schema: { type: string, enum: [full, partial, cache, archive, compute] }
      responses:
        "200":
          description: A page of peers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Peer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [fabric]
      operationId: createPeer
      summary: Enrol a peer, or move an existing member's endpoint.
      description: |
        Peer enrolment is operator-mediated and explicit (§26, ADR-0012). There
        is no discovery, no join token and no trust on first use: an operator
        reads the other node's public key out of `GET /api/v1/peers` at that
        site and posts it here, and the operator at the other site does the
        same in the other direction.

        The public key decides what this does. A key nobody holds is an
        enrolment and answers `201` with a `Location`. A key this instance
        already pins is the same peer, and the request may move its `endpoint`,
        `site` or `mode` — that answers `200`, because nothing was created and
        a client treating `201` as "a peer joined" would count it twice. A key
        already pinned to a peer with a DIFFERENT name is refused: a peer is
        its key, not its name.

        Admin, not write, and for a stronger reason than the token endpoints:
        membership is the only trust root in the inter-peer path, so a
        credential that could enrol a peer could hand a complete replica of the
        library to a machine of its choosing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeerRegistration" }
      responses:
        "201":
          description: The peer was enrolled.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "200":
          description: |
            The key was already a member. Its endpoint, site or mode may have
            moved; its identity did not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "400":
          description: |
            The public key is missing, or malformed — the wrong algorithm
            prefix, not lowercase hex, or not 32 bytes. Or the `endpoint` was
            given and cannot be dialled: a scheme other than `https` or
            `unix`, no host, a port that is not a number, or a path where an
            origin belongs.

            The endpoint is refused HERE rather than by whatever first tries to
            use it, because registration is idempotent on the key: a typo
            replaces a working endpoint, and the peer stays enrolled and looks
            healthy while being unreachable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            The key is registered to another peer, the name is taken by a peer
            with a different key, or the registration claimed to be this node
            and this node already exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: |
          The peer's id or its name. Both, because an operator holds whichever
          of the two they were shown, and a lookup that accepted only the id
          would send them to the list first — which is the step that gets
          skipped when the thing being looked up is about to be removed.
    get:
      tags: [fabric]
      operationId: getPeer
      summary: Show one peer.
      responses:
        "200":
          description: The peer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [fabric]
      operationId: deletePeer
      summary: Revoke a peer's membership.
      description: |
        ADR-0012: "Revocation is removing a membership record." There is no
        revocation list and no certificate to expire — the record IS the trust,
        so deleting it withdraws the trust.

        Membership is consulted on every request rather than at process start,
        so a removed peer stops being able to read bytes immediately, on the
        connection it is already holding open. The peer's `replicas` rows go
        with it: a peer this instance will not talk to is not a peer whose copy
        counts towards placement.

        It answers with the record it removed rather than `204`, so that "did I
        revoke the right peer?" is not a question answered by re-reading the
        list you just changed. This node cannot remove itself.
      responses:
        "200":
          description: The membership record that was revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The peer is this node, which cannot revoke itself.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/peers/{id}/reconcile:
    post:
      tags: [fabric]
      operationId: reconcilePeer
      summary: Ask for this peer's convergence to be re-examined.
      description: |
        §19, §57. **Enqueues** a `reconcile_peer` job; it does not run one.
        Reconciliation is a job (invariant 4, ADR-0002) and the worker that
        runs it may be another process, so this answers `202` rather than
        pretending to be the worker.

        The job diffs §19's desired blob set — for a Full Peer, the complete
        canonical Blob set — against what this peer's inventory reports, and
        enqueues `replicate_blob` for the difference. It emits the work and
        stops there; moving the bytes is a separate job.

        Deduped per peer, so asking repeatedly while a cycle is queued yields
        one job. Convergence also runs fabric-wide on a beat, so this is for
        impatience — a peer just enrolled, or just restored — rather than for
        correctness.

        `write` rather than `admin`, unlike enrolment and revocation: it
        changes nothing about who is trusted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The peer's id or its name, as for `GET /api/v1/peers/{id}`.
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  peer_id: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/replicas:
    get:
      tags: [fabric]
      operationId: listReplicas
      summary: Page the replicas.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [present, pending, corrupt, missing] }
        - name: peer_id
          in: query
          schema: { type: string }
        - name: blob_hash
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of replicas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Replica" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/blobs/{hash}/probe:
    get:
      tags: [content]
      operationId: getBlobProbe
      summary: What ffprobe said about a blob's bytes.
      description: |
        Hangs off the blob rather than the asset because a probe describes
        **bytes**, and bytes are identity: two assets sharing a blob share one
        probe (§29, invariant 1).

        A blob with no probe is **404, not an empty 200**. "We have not probed
        this" and "this has no streams" are different answers, and a client
        that cannot tell them apart cannot decide whether to wait — which is
        exactly the state every blob is in on a node with no ffprobe
        (ADR-0023).

        `bytes_read` and `materialised` are how the probe was obtained, exposed
        so §29 is auditable in a running deployment. An instance where every
        probe materialised is one where remote probing is silently not working,
        and the only other symptom is that it feels slow.
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobProbe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/publications:
    get:
      tags: [content]
      operationId: listPublications
      summary: Page publications — EPUB, PDF, CBZ and CBR.
      description: |
        Heyarr **stores and serves** publications; it does not render them
        (§69). Clients render.

        This is the catalog view: enough to tell an EPUB from a CBZ, and how
        long it is, without downloading it first. The bytes come from
        `/api/v1/blobs/{hash}/content` like everything else — ADR-0013 makes
        that one endpoint with several consumers, and a reader is another one,
        not another endpoint.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: format
          in: query
          schema:
            type: string
            enum: [epub, pdf, cbz, cbr]
      responses:
        "200":
          description: A page of publications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/publications/{id}:
    get:
      tags: [content]
      operationId: getPublication
      summary: One publication, by ASSET id.
      description: |
        Keyed by asset rather than blob. The metadata is stored against the
        blob because it describes the bytes, but a client holds an asset: one
        blob can be two assets with two filenames in two libraries, and "which
        publication" is a question about a *use* of the bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playback:
    post:
      tags: [playback]
      operationId: startPlayback
      summary: Plan, open a session, and return somewhere to play from.
      description: |
        The one call a client makes when someone presses play.

        **The controller stays out of the content data path (§32).** It returns
        a direct URL to the peer holding the replica; it does not proxy bytes.
        A controller that proxied would make playback's availability depend on
        its own, which is exactly the coupling §53's degraded-operation model
        exists to avoid — a Full Peer must keep streaming when the controller
        has gone.

        The URL is `/api/v1/blobs/{hash}/content`, unchanged. ADR-0013's
        consequences forbid "adding a player-shaped session token" to it, so
        playback gets no byte route, no auth scheme and no signed URL of its
        own — it gets a short-lived credential and the same endpoint
        replication and the BitTorrent web-seed use.

        **The credential is scoped to `read` and expires, but is not scoped to
        one blob.** A client holding one can read any blob until it expires.
        Per-blob scoping is a *grant* (§77's `/grants`), which is a later
        milestone with principals behind it; inventing a lesser version here
        would be a second authorisation model to reconcile with the real one.

        **Anything that is not DIRECT is a 409** carrying the planner's first
        reason, not a 501. The request is well-formed and the asset is real;
        what cannot happen is this pairing of asset and device. No session is
        opened — a session for a playback that cannot happen is state nobody
        will clean up, and it would appear in "continue watching" for something
        nobody watched. `POST /playback/plan` has the full rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartPlayback" }
      responses:
        "201":
          description: The session, the plan, and where to play from.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedPlayback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The plan is not DIRECT, or nothing holds the bytes. No session was
            opened.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/remux:
    post:
      tags: [playback]
      operationId: enqueueRemux
      summary: Queue a remux for an asset a device cannot take as it is (§10, §75).
      description: |
        Rewraps the encoded streams into a container the device declares. It
        does **not** re-encode: `-c copy` is the whole contract, and Milestone
        2 has no quality ladder, no HLS or DASH segmenting and no transcode.

        **Separate from `POST /playback` deliberately.** A remux is minutes of
        work and disk; starting one because a client asked what it could play
        would let a browsing client fill a disk. When to spend that is a policy
        question, and policy is §55's.

        Only a **REMUX** plan is actionable. A DIRECT plan needs no work, and a
        TRANSCODE plan would produce a remux that still does not play — a
        failure the client would discover only after waiting for it. Both are
        409.

        Returns the job. Poll `/jobs/{id}` or follow `job.*` on the event
        stream, then re-plan.

        The output is recorded as an **Asset** with role `derived` on the same
        Edition, so replication, integrity and garbage collection treat it like
        any other managed asset. That means it will be replicated and will be
        reclaimed when nothing references it — both correct, neither free.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemuxRequest" }
      responses:
        "202":
          description: The remux was queued.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  container: { type: string, enum: [mp4, mkv] }
                  asset_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The plan is not REMUX, so there is nothing useful to queue.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/playback/plan:
    post:
      tags: [playback]
      operationId: planPlayback
      summary: What should this device do with this asset? (§68)
      description: |
        DIRECT, REMUX, TRANSCODE — or `unplayable` when nothing holds the bytes.

        **It writes nothing and opens no session.** A client shows a "play"
        button by planning and opens a session when someone presses it; if
        planning created state, every hover would too.

        The `reasons` are the point. "Why is my television transcoding this" is
        the single most common question this class of software is asked, and a
        planner that answers only with a verb cannot answer it. Codes are
        stable strings because clients branch on them; `detail` is prose for a
        human and may change.

        **Media nothing has probed plans DIRECT**, with a `no_probe` reason
        saying the plan is a guess. The conservative-looking answer is
        TRANSCODE and it is wrong: a node with no probes is precisely a node
        with no ffprobe (ADR-0023), which cannot transcode either — so
        planning TRANSCODE there would make the entire library unplayable,
        while DIRECT makes most of it work and fails visibly when it does not.

        **A client that says what it can decode gets the leg (ADR-0069).**
        Send `client` — the containers, video and audio codecs it decodes and
        a height ceiling — instead of, or as well as, `device_id`, and the
        answer additionally carries `mode`, `url`, `mime`, `reason` and
        `source`:

        - `mode: direct` — fetch `url`, which is the ordinary blob endpoint.
        - `mode: stream` — fetch `url`, which is
          `GET /api/v1/playback/stream/{token}`: an on-the-fly fragmented MP4
          with the video copied where the client decodes it and the audio
          re-encoded to stereo AAC where it does not (the AC-3 and MP2
          cases), the whole thing re-wrapped when the container is the
          problem (AVI), and the video re-encoded and capped to `max_height`
          only when the client cannot decode the picture. `reason` says which.
        - `mode: unplayable` — no peer holds the bytes; `reason` is routing's.

        With `client`, media nothing has probed is **probed now** when this
        node has ffprobe and holds the bytes, and the result is cached in
        `blob_probes` exactly as a worker's probe would be. A stream is
        produced only by the node holding the replica; a controller routing
        to another peer answers `direct` on that peer and says why. A node
        with no ffmpeg answers `direct` with the reason and the note that it
        cannot repackage — the bytes and the truth, not a black player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playback/stream/{token}:
    get:
      tags: [playback]
      operationId: streamPlayback
      summary: The on-the-fly repackage a `stream` plan points at (ADR-0069).
      description: |
        Fragmented MP4 (`video/mp4`), produced by one ffmpeg per request from
        the blob the token names, written as it is made. The token is what
        `POST /playback/plan` returned in `url` for `mode: stream`: signed by
        this node, bound to the blob, to the repackage the planner decided
        (copy or re-encode, per stream, and the height cap), and to the
        **credential that asked for the plan** — present it with any other
        credential and it is refused. It is good for an hour from planning;
        the stream itself is not cut off at expiry, only its start is.

        **No ranges, no `Content-Length`, no seeking in v1.** The bytes do not
        exist until ffmpeg produces them, so a `Range` header is ignored and
        the response is a `200` with no length. A player treats this as a
        live, unseekable stream — Media3 does, given fragmented MP4 with no
        Range support. To seek, re-request with `?start=<seconds>`: a new
        request restarts ffmpeg with an input seek from that instant.

        The node runs at most `media.stream_concurrency` of these at once
        (default two — each is an ffmpeg, and one re-encoding video is a
        core). Past the cap the answer is `429` with `Retry-After`, never a
        queue: a client waiting on a stream that has not started is a black
        player. When the client disconnects, ffmpeg is killed at once.

        Every refusal of the token — bad signature, expired, another
        credential's, a blob this node does not hold — is the same opaque
        `404`; the reason goes to the log under a bounded label.

        Same authentication as everything else under `/api/v1`: `read` scope,
        Bearer or Device.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: start
          in: query
          required: false
          description: Restart the stream from this many seconds into the source.
          schema: { type: number, minimum: 0 }
      responses:
        "200":
          description: "Fragmented MP4, streamed. No `Content-Length`; `Accept-Ranges: none`."
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`no-store` — the bytes are produced per request."
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            The token does not verify, has expired, was planned for another
            credential, or names bytes this node does not hold. Deliberately
            one answer for all four.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Every stream slot on this node is in use. `Retry-After` is set.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/consumption/sessions:
    get:
      tags: [playback]
      operationId: listConsumptionSessions
      summary: Page consumption sessions, newest first.
      description: |
        `?state=resumable` is the **"continue watching"** query: every session
        that has not reached a terminal state, most recently touched first, for
        watching, listening and reading alike (§67).

        It is a named filter rather than `state=created,playing,paused` because
        "resumable" is the question clients actually ask, and spelling it as
        three states would put the state machine's shape into every client.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [resumable, created, playing, paused, stopped, completed]
        - name: asset_id
          in: query
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: createConsumptionSession
      summary: Open a consumption session.
      description: |
        One model covers watching, listening and reading (§67, ADR-0024). The
        session starts in `created` — a real state, not a formality: the gap
        between "I intend to watch this" and "bytes are moving" is where the
        planner runs, and collapsing it makes an abandoned plan
        indistinguishable from a playback that stalled instantly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumptionSession" }
      responses:
        "201":
          description: The session.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/consumption/sessions/{id}:
    get:
      tags: [playback]
      operationId: getConsumptionSession
      summary: One session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/consumption/sessions/{id}/transitions:
    post:
      tags: [playback]
      operationId: transitionConsumptionSession
      summary: Move a session through its state machine.
      description: |
        One endpoint rather than six (`/start`, `/pause`, `/resume`, …),
        because the state machine is one thing: six endpoints would each need
        to know the transition table, and the first one to disagree with it
        would be a session in a state the domain says is impossible.

        Every transition emits a `playback.session.*` event, inside the same
        transaction that wrote the row (invariant 7, ADR-0009).

        An illegal transition — resuming a completed session, progressing a
        stopped one — is **409**, not 400. The request is well-formed and would
        be legal against a different state, and a client cannot tell "you sent
        nonsense" from "you are out of date" if both are 400. Only the second
        is fixed by re-reading the session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionTransition" }
      responses:
        "200":
          description: The session after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The transition is illegal from the session's current state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/devices:
    get:
      tags: [playback]
      operationId: listDevices
      summary: Page the registered devices.
      description: Ordered by `(name, id)`.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [playback]
      operationId: registerDevice
      summary: Register a device, or update the one already registered.
      description: |
        An **upsert on `device_key`**, not a create. An app announces itself on
        every launch; if that created a row each time, this collection would
        fill with duplicates named "Living Room" and the playback planner would
        be choosing between four thousand copies of one television.

        `201` with a `Location` header the first time, `200` afterwards.

        A device here is a **capability profile, not an identity** (§68).
        Nothing in it is a credential and nothing is authenticated: Heyarr has
        no way to interrogate a television, so a client declares what it can
        play and Heyarr believes it. Device enrolment, keypairs and key
        recovery are ADR-0022 and Milestone 8.

        Codec and container names are lower-cased, trimmed and de-duplicated,
        so two clients spelling one capability differently converge rather than
        producing a planner that matches one device and not its identical twin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDevice" }
      responses:
        "200":
          description: The device already existed; its profile was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: A new device.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{id}:
    get:
      tags: [playback]
      operationId: getDevice
      summary: One device.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired:
    get:
      tags: [desired]
      operationId: listDesired
      summary: Page what should exist.
      description: |
        Ordered by `(created_at, id)`. A want has no name to sort by, and the
        interesting order is the order things were asked for.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: scope
          in: query
          schema: { type: string, enum: [work, edition] }
        - name: monitor
          in: query
          description: Only monitored, or only unmonitored, wants.
          schema: { type: string, enum: ["true", "false"] }
        - name: work_id
          in: query
          schema: { type: string }
        - name: quality_profile_id
          in: query
          schema: { type: string }
        - name: upgradable
          in: query
          description: |
            Which wants are in a state where an upgrade **could** happen — the
            listing question §71's `get_upgrade_candidates` asks.

            Answered from **state alone**: monitored, content satisfied, and
            holding bytes. It deliberately does not score anything, because
            whether a want has reached its profile's *terminal* condition needs
            the incumbent re-evaluated against the profile — a join and a
            scorer per row, which would run the evaluator hundreds of times to
            render one page.

            So this filter is the **cheap half** of eligibility and is a
            superset: a want that is monitored and satisfied but already
            terminal appears here. `GET /desired/{id}/satisfaction` reports the
            terminal test per want, and the `upgrade_scan` job applies it.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: A page of desired items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [desired]
      operationId: createDesired
      summary: Want something.
      description: |
        **A want must work when you have nothing.** That is the whole point of
        this endpoint and the requirement most easily lost: every fixture in
        this repository has assets, so a design that only works once something
        exists passes every test and fails the first real use.

        Name the work either by `work_id`, or — when it does not exist yet — by
        a `work` descriptor of content type, title and year. The descriptor
        resolves through the **same** `(content_type, work_key)` get-or-create
        the scanner uses, so wanting a film and later scanning it converge on
        one Work rather than producing two.

        Name the quality profile by `quality_profile_id` or by
        `quality_profile` (its name) — a person writing this by hand knows
        `living-room`, not a UUID. A profile is **required**: "this should
        exist", with no statement of what would count as existing, cannot be
        evaluated (§56).

        `monitor` defaults to **true**. Wanting something and then silently
        never looking for anything better is the surprising default.

        Two wants over the same target with **different** profiles are legal
        and are the point (§61 — never one version per title): the living-room
        copy and the phone-sized copy are two wants. The same target with the
        same profile is one want written twice, and is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDesired" }
      responses:
        "201":
          description: The want.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That content is already wanted under that profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}:
    get:
      tags: [desired]
      operationId: getDesired
      summary: One desired item.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The want.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [desired]
      operationId: updateDesired
      summary: Change the conditions, the monitoring or the note.
      description: |
        An omitted field is left alone.

        **The target cannot be changed.** Repointing a want at different
        content is not an edit, it is a different want, and allowing it would
        make the acquisition history attached to this row describe something
        else. Delete it and want the other thing.

        A request that changes nothing emits no event.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDesired" }
      responses:
        "200":
          description: The want as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new profile would duplicate an existing want.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [desired]
      operationId: deleteDesired
      summary: Stop wanting something.
      description: |
        Physical, matching quality profiles and for the same reason: a want is
        a statement of intent, not bytes. ADR-0018's logical-delete stance
        exists to stop shared, expensive, unrecoverable bytes being unlinked
        inline, and none of that applies here — an operator who says they no
        longer want something should find it gone.

        The `desired.removed` event carries the target, not only the row id, so
        the log still says what was wanted after the row is gone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: No longer wanted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/candidates:
    get:
      tags: [desired]
      operationId: listCandidates
      summary: What the last search found, and why each release was judged so.
      description: |
        §63 says evaluation is deterministic and **inspectable**. This is the
        inspectable half: an evaluation that lived in memory for two hundred
        milliseconds is deterministic and cannot answer "why did it pick that
        release, last Tuesday, at 3am".

        The **rejections matter more than the acceptance**. A search that found
        twelve releases and took none of them leaves twelve explained refusals
        here, because a want that simply goes quiet is the failure mode §60
        keeps explainable rejection reasons to avoid.

        It reads what the last search **stored**, and deliberately does not
        re-search or re-score. Re-running the scorer would answer a different
        question — what would be decided *now* — and that substitution is
        exactly what makes an audit trail worthless.

        Ordered best first, by the same total order the scorer ranks by:
        accepted above rejected, then score descending, then the provider's
        candidate id. The listing and the selection therefore cannot disagree
        about which is best.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The candidates, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/search:
    post:
      tags: [desired]
      operationId: searchDesired
      summary: Look for releases that would satisfy this want, now.
      description: |
        §60's **manual search** — the same job the schedule runs, triggered by
        a person, with the results visible whether or not anything was
        acceptable.

        **Enqueues** a job; it does not run one. A search is a job (invariant
        4, ADR-0002) and the worker that runs it may be another process, so
        this answers `202` rather than pretending to be the worker — and rather
        than holding a request open across a provider round trip an indexer may
        take thirty seconds to refuse.

        Deduped per want, so asking repeatedly while one is queued yields one
        job. Per want rather than globally: two wants should be searched
        concurrently, and collapsing them would make a library of two hundred
        wants take two hundred sequential searches to make one pass.

        On a node with **no indexer** the job stays *pending and visible*
        rather than failing (ADR-0025) — it is work waiting for a capability,
        not work that went wrong.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/select:
    post:
      tags: [desired]
      operationId: selectCandidate
      summary: Take this release, whatever the ranking says.
      description: |
        §60's **manual override**, and it is a different feature from manual
        search: a search asks what is out there, an override says which one to
        take.

        It **records that it was an override**, and what the scorer had chosen
        instead. An override that left no trace would look exactly like an
        ordinary selection, and "why did it take that one" would then have no
        answer — which is the property §60's deterministic scoring exists to
        give.

        ### It refuses a candidate the profile rejected

        A `409`, deliberately. The gates in §62 are the operator's own
        statement of what is acceptable, and an override that could ignore them
        would quietly turn `accept` into a suggestion. Wanting something
        outside the profile is perfectly expressible — by **changing the
        profile**, which is visible and durable, rather than by a one-off that
        leaves the profile saying something nobody means.

        Naming the candidate the scorer already chose is a selection rather
        than an override, and is not recorded as a disagreement: putting a
        departure in the audit trail that never happened is its own kind of
        wrong.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id]
              properties:
                candidate_id:
                  type: string
                  description: |
                    The **provider's** id for the release, as returned by
                    `/candidates`.
      responses:
        "200":
          description: The chosen candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No candidate with that id for this want — it may have been
            superseded by a later search.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: That candidate was rejected by the quality profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}/acquisitions:
    post:
      tags: [desired]
      operationId: adoptAcquisition
      summary: Adopt bytes that have already arrived (§65).
      description: |
        "These bytes are here, they answer this want, take them."

        §65 lists many ways bytes arrive, and a polled download client is only
        the ordinary one. A client Heyarr does **not** poll is an ordinary
        situation too: a transfer that finished before Heyarr knew about it,
        something fetched by hand, or a client the registry has no integration
        for.

        The pipeline afterwards is **identical** to the polled path — the same
        verification, the same ingest job, the same §64 edges. The only thing
        that differs is who noticed the transfer had finished.

        `local_path` is where the bytes are **in a namespace Heyarr can open**,
        not the download client's. Path mapping is the poller's job and there
        is no client here to map from.

        This is deliberately **not an upload**: Heyarr is told where the bytes
        already are rather than receiving them. An upload is a different §65
        source with a different shape, and conflating them would put a
        multi-gigabyte body on an endpoint whose whole job is a path.

        Answers `202`: the hash and the ingest are a job, because hashing a
        large file is real work and the worker that does it may be another
        process (invariant 4).

        Adopting the same transfer twice is harmless — the acquisition is keyed
        on `(provider, external_id)` and the ingest job is deduped per want.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id, local_path]
              properties:
                provider:
                  type: string
                  description: |
                    What produced the bytes. Free text: this endpoint exists
                    precisely for clients the registry does not know about.
                external_id:
                  type: string
                  description: |
                    That producer's identifier — an infohash, a job id. It is
                    what makes adopting the same transfer twice idempotent
                    rather than duplicative.
                external_name: { type: string }
                local_path:
                  type: string
                  description: Where the bytes are, in Heyarr's own namespace.
      responses:
        "202":
          description: Queued for verification and ingest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  phase: { type: string }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That want already has an acquisition in flight.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/desired/{id}/satisfaction:
    get:
      tags: [desired]
      operationId: getSatisfaction
      summary: Why a want is, or is not, satisfied.
      description: |
        The acquisition state on a `DesiredItem` says **what** the answer is.
        This says **why** — and it is what makes "I have this film, why does
        Heyarr say it is missing" answerable, which is the question this axis
        gets asked most often.

        It **reconciles** rather than reading a cached answer, for the same
        reason the evaluation endpoint scores rather than replays: an
        explanation that might be minutes stale is one nobody can trust while
        they are looking at a file they can see on disk.

        Per want rather than inlined on the listing, because a page of fifty
        wants would carry fifty evaluations of several rules each.

        ### The two axes are evaluated separately (§56)

        Content asks "do we hold bytes the quality profile accepts?" — and
        **existing is not satisfying**: a 480p rip under a 1080p-minimum
        profile is content *present* and content *not satisfied*. Conflating
        them makes the upgrade workflow unreachable.

        Placement asks "are those bytes on every Full Peer that should hold
        them?", and it is asked only of **the bytes that satisfy** — asking it
        of a rejected copy would report a want as fully satisfied because the
        wrong file is well replicated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Both axes, with reasons.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Satisfaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desired/{id}/reconcile:
    post:
      tags: [desired]
      operationId: reconcileDesired
      summary: Ask for this want to be re-examined.
      description: |
        **Enqueues** a job; it does not run one. Reconciliation is a job
        (invariant 4, ADR-0002) and the worker that runs it may be another
        process, so this answers `202` rather than pretending to be the worker.

        Deduped per want, so asking repeatedly while one is queued yields one
        job. Reconciliation also runs on a beat and when a want is created, so
        this is for impatience rather than for correctness.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired_item_id: { type: string }
                  job_id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/followed-sources:
    get:
      tags: [desired]
      operationId: listFollowedSources
      summary: List every followed source.
      description: |
        A followed source is a standing subscription that archives everything a
        source emits (§55, M12). Each entry carries the derived counts a person
        actually wants — how many items its feed has yielded, and how many are
        archived — plus when it was last polled, when it is due next, and whether
        its feed adapter is healthy.
      responses:
        "200":
          description: Every followed source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  followed_sources:
                    type: array
                    items: { $ref: "#/components/schemas/FollowedSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [desired]
      operationId: createFollowedSource
      summary: Follow a source.
      description: |
        Subscribe to a source and archive everything it emits, forever — a
        **standing subscription**, distinct from `POST /desired` (`want_content`),
        which gets one thing once.

        **Source-agnostic (#396).** There is no `source`, `provider` or
        `feed_type` field. Give a content intent (which series) and an identity
        (a `url`, or an explicit `tvdb_id`); the system **infers** the type. Phase
        1 implements `tv_series` only — anything else is refused with a message
        that says so, rather than being stored and never polled.

        The series work is resolved exactly as `want_content` resolves a work: an
        existing `work_id`, or a `title` (and optional `year`) that
        get-or-creates the series work, so a follow and a later scan converge on
        one work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowSourceRequest" }
      responses:
        "201":
          description: The source is now followed; its first poll has been queued.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowedSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/followed-sources/{id}:
    delete:
      tags: [desired]
      operationId: deleteFollowedSource
      summary: Stop following a source.
      description: |
        Stops future polls. `keep_archive` defaults to `true` — it keeps every
        item and asset already archived. Removing the archive (`keep_archive=false`)
        is not implemented in Phase 1 and is refused rather than silently ignored.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: keep_archive
          in: query
          description: Keep what was already archived. Defaults to true; false is refused in Phase 1.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "204": { description: Unfollowed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/search:
    post:
      tags: [content]
      operationId: searchContent
      summary: Find a work by what it is.
      description: |
        A content-intent search over the library's works, by title and/or content
        type (§55, #396). **No source parameter**: the question is what a work IS,
        not which service to ask. It matches the normalised `sort_title` a scan
        records, so "the conversation" finds "The Conversation".

        A `POST` under the read floor, because the intent travels in a body — the
        same reasoning as `POST /quality-profiles/{id}/evaluate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                content_type: { type: string }
                limit: { type: integer }
      responses:
        "200":
          description: The works that matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items: { $ref: "#/components/schemas/WorkSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: The calling credential's own authority.
      description: |
        A caller's own identity and effective authority (ADR-0061, M12) — the one
        endpoint a browser/TV client reads to decide whether to show management UI
        and, when it may not yet, which device key an operator must authorise.

        A web-login session (ADR-0053) is read-only by default, so `POST`/`DELETE
        /followed-sources` 403 from it. The interim path to write is a
        **follow-management grant**: an operator authorises the session's approving
        `device_key`, and the session then carries `write`. A client drives it as:
        read `/session` → if `can_write` is false, show `device_key` and prompt the
        operator → operator issues `POST /session/management-grants` → read
        `/session` again, now `can_write`. Device-cert enrolment (ADR-0048) is the
        eventual convergence that binds authority to the surface itself.

        A read under the router's read floor; every authenticated caller may read
        its own identity.
      responses:
        "200":
          description: This caller's identity and authority.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/session/management-grants:
    get:
      tags: [session]
      operationId: listManagementGrants
      summary: The devices authorised to manage followed sources.
      description: |
        Every follow-management grant (ADR-0061) — the approving device keys an
        operator has authorised to hold `write` in their web-login sessions.
        Listing a credential operation's state is an **admin** action, like listing
        tokens.
      responses:
        "200":
          description: The authorised devices, newest grant first.
          content:
            application/json:
              schema:
                type: object
                required: [management_grants]
                properties:
                  management_grants:
                    type: array
                    items: { $ref: "#/components/schemas/ManagementGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [session]
      operationId: createManagementGrant
      summary: Authorise a device to manage followed sources.
      description: |
        The operator's explicit consent step (ADR-0061): authorise a specific
        approving `device_key` so every web-login session that device approves
        carries `write`. This is the interim, non-gated path a trusted personal
        device takes to manage followed sources before device-cert enrolment
        (ADR-0048) converges the surface.

        Idempotent: re-granting an already authorised device updates its note
        rather than failing. Issuing a grant elevates a device's authority, so it
        is an **admin** action, like minting a token.

        The default — no grant — is read-only, so a shared surface (a TV) stays
        read-only until its approver is explicitly authorised. The sharp edge is
        honest and recorded in ADR-0061: the grant follows the approving device,
        not the surface.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementGrantRequest" }
      responses:
        "201":
          description: The device is authorised.
          headers:
            Location:
              description: The created grant.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/session/management-grants/{device_key}:
    delete:
      tags: [session]
      operationId: deleteManagementGrant
      summary: Revoke a device's follow-management authorization.
      description: |
        Remove a device's `write` authorization (ADR-0061). Its web-login sessions
        return to the read floor on their next request — the grant lookup is per
        request, so revocation is not deferred to a token expiry. An **admin**
        action; a revoke of a device that was never granted is a 404, not a silent
        success.
      parameters:
        - name: device_key
          in: path
          required: true
          description: The approving device key to revoke ("ed25519:<hex>").
          schema: { type: string }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: What external services are configured, and whether they work.
      description: |
        §59 centralises provider configuration. Content types do not maintain
        separate registries — a new provider kind is a new **capability** here,
        never a second registry (§61, §83).

        ### Why this endpoint exists

        A node with no indexer and no download client is a **supported, tested
        configuration** (ADR-0025): it scans, ingests, catalogues, verifies,
        serves ranges and plays, and search and acquire jobs sit *pending and
        visible* rather than failing. The cost of that design is that "why is
        nothing being acquired?" has an entirely legitimate answer which is
        invisible unless something reports it. This is that report.

        ### No credential is ever returned

        Not the API key, not an endpoint with credentials embedded in it, not a
        length-preserving hint. What an operator needs is which provider, what
        it can do, and whether it works.

        ### Health is observed, not asserted

        `healthy` is what the last check **found**, by exercising the provider
        — a provider that reported itself healthy because it was configured
        would be advertising something it might not deliver, and work would
        route to it and then fail.

        An **absent `checked_at` means never checked**, which is deliberately
        distinct from `healthy: false`: "nobody has looked" and "we looked and
        it is broken" lead to different actions. The same distinction §56's
        satisfaction axes make.

        Health is read from the database rather than from the answering
        process's memory, because under ADR-0002 the worker that ran the check
        may be another machine.
      responses:
        "200":
          description: Every configured provider, and what this node can therefore do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/capabilities:
    get:
      tags: [providers]
      operationId: listCapabilities
      summary: Which nodes in the fleet can do what, proven by execution.
      description: |
        The fleet-wide capability view (§6, §75, ADR-0040).

        ### Why this is not `/api/v1/system`

        `/api/v1/system` describes **the node answering the request**. The
        toolchain that decides whether a transcode runs is the one on the
        *worker* that claims the job, and in a split-process deployment
        (ADR-0002) that is another machine. ADR-0023 named this gap in its own
        consequences and deferred it; this closes it.

        ### A capability here was PROVEN, never parsed

        `ffmpeg -encoders` will happily **list** a hardware AV1 encoder on
        silicon that cannot encode AV1, then fail at runtime with `No capable
        devices found` — while the same device decodes AV1 fine. Encode and
        decode support are asymmetric per hardware generation and the asymmetry
        is not derivable from anything FFmpeg prints.

        So a `probe` capability means a worker really encoded a handful of
        frames from a synthetic source to a null sink with that encoder, and the
        process exited successfully. Nothing else produces one.

        ### Advertisements NARROW, and they expire

        A capability that stops passing stops being advertised — without the
        binary changing and without a restart, because a device can be claimed
        by another process or broken by a kernel update. An advertisement that
        could only grow would lie after the first driver update.

        Every advertisement carries an `expires_at` and is filtered out once it
        passes: a worker that dies cannot tidy up after itself, and a power cut
        is exactly the death that skips a shutdown hook.

        ### `?capability=` is an EXACT match

        `ffmpeg` is a prefix of `ffmpeg.encoder.hevc`. A prefix match would
        answer "which nodes can encode AV1" with every node that merely has
        FFmpeg installed, which is the failure this whole mechanism exists to
        prevent.
      parameters:
        - name: capability
          in: query
          required: false
          schema: { type: string }
          description: |
            Return only workers holding exactly this capability string. The
            vocabulary is dotted and hierarchical — `ffmpeg`,
            `ffmpeg.encoder.hevc`, `ffmpeg.encoder.av1.vaapi` — and the match is
            equality on the whole string, never a prefix.
      responses:
        "200":
          description: Every live advertisement, and the union across the fleet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp:
    post:
      tags: [mcp]
      operationId: mcpRPC
      summary: MCP, as JSON-RPC 2.0 over a single endpoint.
      description: |
        Model Context Protocol (§71, ADR-0019). One route, because MCP
        multiplexes over JSON-RPC methods rather than over paths.

        Mounted here rather than on a server of its own so it inherits this
        API's middleware chain, request correlation and `read` scope floor. The
        **per-tool scope check** turns that floor into a contract: an MCP
        session is not a new trust domain, and a `read` token calling
        `want_content` is refused with JSON-RPC code `-32001`.

        ### Methods

        | method | does |
        |---|---|
        | `initialize` | handshake; returns protocol version, server info and instructions |
        | `tools/list` | the tool surface, each with its hand-written input schema and required scope |
        | `tools/call` | invoke one tool |
        | `ping` | keepalive |

        A request with no `id` is a notification and is answered with `202` and
        an empty body, per JSON-RPC — some clients treat a reply to one as a
        protocol violation.

        ### What is deliberately absent

        MCP's value is **semantic actions over desired state, not a second read
        API** (ADR-0019). There are no `resources` or `prompts` capabilities and
        no `list_works`-style tools: an agent that wants to browse should use
        this document's own endpoints.

        Four verbs §71 names are **absent rather than stubbed** —
        `search_releases`, `acquire_release`, `play_content` and
        `transfer_playback`. Asking for one returns `-32601` with the milestone
        that brings it, so an agent learns to wait rather than to retry. A tool
        answering "not implemented" would be a published vocabulary with a hole
        in it, which is exactly what ADR-0019 waited to avoid.

        `sync_peer` was the fifth. It was deferred because the peer model held
        exactly one peer and there was nothing to synchronise with; Milestone 4
        stood up a second Full Peer, so it ships.

        ### §72

        Controller-side MCP holds no key for encrypted personal state.
        Playlists, ratings, reading positions and history are **not reachable
        here** and no tool exposes them — asserted by enumerating the
        registered surface, not by review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JSONRPCRequest" }
      responses:
        "200":
          description: The JSON-RPC response. Tool failures are errors INSIDE this envelope, not HTTP statuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "202": { description: A notification was accepted. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /peer/v1/identity:
    get:
      tags: [peer]
      operationId: getPeerIdentity
      summary: Report the peer identity this node derived from the client certificate.
      description: |
        The peer the SERVER worked out, from the certificate presented on this
        connection and the membership record pinning its key. Nothing in the
        request asserts an identity and nothing is echoed back.

        That is the whole reason the route exists. "The request returned 200"
        is not evidence that pinning happened — a server that authenticated
        nobody would also return 200 — so an acceptance assertion needs a value
        it can compare against the id enrolment returned. This is that value.

        It is served on the peer listener (`peer.listen`), which is off by
        default: a deployment with one peer has no fabric to serve and needs no
        certificate configuration of any kind.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The caller's membership record, as this node resolved it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerIdentity" }
        "401":
          description: |
            No client certificate was presented. Behind the real listener this
            is unreachable — the handshake is refused before a request exists —
            and it is documented because the router refuses independently of
            the listener it is mounted on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The presented key is not a member. It is the same answer for a key
            that was never enrolled and a key that was revoked a moment ago:
            after removal there is nothing left to tell them apart, which is
            what "revocation is removing a membership record" means.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/reachback:
    get:
      tags: [peer]
      operationId: getPeerReachback
      summary: Report whether this node can reach the peer that is asking.
      description: |
        The RETURN leg of a pairing (#186, ADR-0040).

        Replication needs traffic in both directions and the two flows run
        opposite ways: a peer PUSHES its inventory to the controller, and a
        destination PULLS bytes from a source (ADR-0030). On a one-way network
        exactly one of them runs the wrong way, whichever node is the
        destination, and replication deadlocks silently — a controller that was
        never told a peer holds a blob correctly emits no work for it.

        A node cannot observe the return direction for itself: an attempt that
        never leaves the other machine leaves no trace here. So it asks, and
        `heyarr peers add` consults this route to refuse a one-way pairing at
        enrolment rather than leaving it to surface weeks later.

        The request carries NOTHING. The address dialled is the answering
        node's own membership record for the caller — never a target the caller
        supplied, which would make every member a blind port scanner — and it
        is also the address the return flows would really use.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: |
            What the answering node observed. `unknown` is an ordinary answer,
            not a failure: a node with no endpoint recorded for the caller has
            nowhere to dial back to, and the caller must draw no conclusion
            from it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerReachback" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/attachment:
    get:
      tags: [peer]
      operationId: getPeerAttachment
      summary: Report this peer's attachment to the controller.
      description: |
        A Full Peer is controller-attached: it runs no control plane and gets
        its scheduling, authorisation and read routing from the controller
        (ADR-0029). This is how it confirms which controller it is attached to
        and what that controller records it as.

        Every field is derived from the client certificate and the membership
        record pinning its key (ADR-0033). There is no request body and no path
        parameter, so nothing here can be influenced by the caller.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The caller's attachment, as this controller records it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerAttachment" }
        "401":
          description: |
            No client certificate was presented. Behind the real listener this
            is unreachable — the handshake is refused before a request exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/attach:
    post:
      tags: [peer]
      operationId: attachPeer
      summary: Attach to the controller, declaring which peer this node believes it is.
      description: |
        The body carries a DECLARED `peer_id`. It is not a credential and it is
        never the acting identity: the controller derives the acting peer from
        the client certificate, compares the declaration against it, and
        refuses a mismatch with 403 (ADR-0033).

        The declaration is worth sending anyway. A peer restored from another
        site's configuration, or pointed at the wrong data directory, finds out
        on its first request rather than after an inventory report has landed
        under somebody else's id.

        It writes nothing. Attaching is a peer confirming what the controller
        already holds; enrolment is an operator action on the admin surface,
        and no peer credential can reach it.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeerAttachRequest" }
      responses:
        "200":
          description: The caller's attachment, as this controller records it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerAttachment" }
        "400":
          description: |
            The body is not a JSON object, or carries no `peer_id`. The
            declaration is required and is never defaulted to the certificate's
            identity: a body that may be omitted is a body that stops being
            compared.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The presented key is not a member, or the declared `peer_id` is not
            the peer this connection authenticated as. Peer A cannot act as
            peer B.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/inventory:
    post:
      tags: [peer]
      operationId: reportPeerInventory
      summary: Report what this peer's content store actually holds.
      description: |
        `replicas` is what the CONTROLLER believes. A peer's inventory is what
        is on its DISK. Until a second Full Peer exists those two cannot
        disagree — every writer of `replicas` resolves the self peer first, so
        no row has ever described another machine — and this route is where
        they get the chance to.

        Disk reality wins (§21). The controller folds the report into
        `replicas` as a cache of peer-reported reality: additions, changes,
        and — the half that gets discovered late — **removals as `missing`,
        never as deleted rows**. An inventory that could only add replicas
        converges on a table that never shrinks and always claims the library
        is safer than it is, and that table is what garbage collection consults
        before deleting what it believes is a surplus copy.

        The acting peer is derived from the client certificate. `peer_id` in
        the body is a DECLARATION: it is compared against the certificate and a
        mismatch is refused with 403 (ADR-0033). A peer reports its own
        inventory and only its own.

        ### full vs incremental

        The two differ in what they assert about a blob they do NOT mention:

        * a **full** report names everything the peer holds, so an unmentioned
          blob is positively asserted absent — the row becomes `missing` and
          its `reported_at` advances, because the peer confirmed that blob by
          excluding it. This is the drift corrector: it is the only shape that
          can say "and nothing else".
        * an **incremental** report asserts nothing about an unmentioned blob.
          The row is untouched and its `reported_at` does not advance. A loss
          is communicated with an explicit `missing` entry.

        Both shapes of the same reality produce the same `replicas` state.

        Reporting is idempotent (invariant 9): two identical consecutive
        reports change nothing and emit no events.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryReport" }
      responses:
        "200":
          description: What folding the report into `replicas` did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryOutcome" }
        "400":
          description: |
            The body is not an inventory report, carries no `peer_id`, names an
            unparseable blob hash or an unreportable state, or lists one blob
            twice.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The presented key is not a member, the declared `peer_id` is not
            the peer this connection authenticated as, or the authenticated
            peer has no catalog row to hang replicas from.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            This node has no catalog to record reports in. It answers rather
            than accepting silently: a 200 would tell the peer its inventory
            landed when nothing happened at all.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/catalog/snapshot:
    get:
      tags: [peer]
      operationId: getCatalogSnapshot
      summary: Fetch this peer's materialised catalog snapshot.
      description: |
        A Full Peer keeps a local materialised read snapshot of the
        controller's catalogue so that it has something trustworthy to serve
        from when the controller is not reachable (§52, §53). This is where it
        comes from.

        **The peer is the certificate's, always.** There is no peer id in the
        path, the query or a body. A snapshot is a complete description of the
        library's organisation, and a route that let a caller name a different
        peer would both hand that peer's snapshot to any member and advance
        that peer's version — so the real peer's next incremental refresh would
        skip everything in between (ADR-0033).

        **What it contains:** libraries, library roots, works, editions, blobs
        and assets. Artwork references and known device access leases are §52
        "potential contents" and are not here: leases are §54 and Milestone 7,
        and there is no lease model yet.

        **What it is not:** independently writable control state. The peer
        materialises this into a SEPARATE database file with one writer and
        read handles that cannot write; nothing a peer sends here writes
        control state, and nothing it holds locally is control state
        (ADR-0029, Invariant 5).

        **Staleness is reported, not implied.** Every snapshot carries the
        controller it came from, a monotonic version and when the catalogue was
        read. A stale answer presented as current is worse than an unavailable
        one, which is the whole shape of §53's "conservative rather than
        unavailable".
      security:
        - peerCertificate: []
      parameters:
        - name: holding
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            The snapshot version this peer already has. Zero, or omitted, means
            it has none — which is also what a peer whose snapshot store was
            lost reports, and both correctly produce a full rebuild.

            It is a CLAIM, not a credential. A peer claiming a version this
            controller never issued gets a full rebuild rather than an
            argument: the conservative answer to "we disagree about what you
            have" is to send everything.
        - name: full
          in: query
          schema: { type: string, enum: ["true"] }
          description: |
            Force the full rebuild even when an incremental refresh would be
            legal. It is the drift corrector — the same escape hatch M4-07
            gives inventory reporting — for when the snapshot and the catalogue
            disagree and nobody can say why.
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSnapshot" }
        "400":
          description: "`holding` is not a non-negative integer."
  /peer/v1/control-backup:
    post:
      tags: [peer]
      operationId: pushControlBackup
      summary: Push a backup of your OWN control plane to this peer (§50).
      description: |
        A peer pushes a signed backup of its own control plane to the peers
        that trust it, so that losing its disk is survivable (§50, ADR-0046).
        Push, not pull: the bytes are the pusher's own small state, so ADR-0030's
        "never carry content bytes" does not apply, and pushing moves the backup
        structurally opposite the pulled catalog snapshot — one more way the two
        artefacts cannot be confused.

        **The source is the certificate's, always.** The manifest names the
        source peer, and this node refuses a backup whose named source is not the
        peer pushing it (ADR-0044 Q2): a peer may push only what it can sign as
        itself, never another peer's control plane under its own name.

        **Verified before it is stored.** The manifest signature is checked
        against the pusher's pinned key, and the snapshot digest against its
        bytes; a backup that fails either is rejected and nothing is stored. What
        lands is inert — held in its own directory and never opened as a control
        plane (Invariant 5, ADR-0044 Q5).

        The manifest travels in the `X-Heyarr-Control-Backup` header (base64 JSON);
        the request body is the snapshot database bytes.
      security:
        - peerCertificate: []
      parameters:
        - name: X-Heyarr-Control-Backup
          in: header
          required: true
          schema: { type: string }
          description: The base64-encoded JSON manifest of the pushed backup.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The backup was verified and stored.
          content:
            application/json:
              schema:
                type: object
                required: [generation]
                properties:
                  generation: { type: integer, format: int64 }
        "400":
          description: The pushed backup was rejected (bad signature, digest mismatch, or a source that is not the caller).
        "503":
          description: This node does not hold control-plane backups for peers.
    get:
      tags: [peer]
      operationId: listHeldControlBackups
      summary: What this peer holds of YOUR control plane (§50).
      description: |
        Reports the generations this node holds of the CALLING peer's control
        plane, newest first — the fact the pusher checks its own belief against
        (ADR-0046). The peer is the certificate's; there is no id in the path or
        query.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The generations held for the calling peer.
          content:
            application/json:
              schema:
                type: object
                required: [source, generations, latest]
                properties:
                  source: { type: string }
                  generations:
                    type: array
                    items: { type: integer, format: int64 }
                  latest: { type: integer, format: int64 }
        "503":
          description: This node does not hold control-plane backups for peers.
  /peer/v1/control-backup/{generation}:
    get:
      tags: [peer]
      operationId: downloadControlBackup
      summary: Fetch a generation of YOUR own backup this peer holds (§51).
      description: |
        A recovering node fetches its own control-plane backup that this peer
        holds, to rebuild its control plane (§51, M7-04, `recover --from-peer`).
        The source is the certificate's, so a peer can download only ITS OWN
        backups. The manifest is in the `X-Heyarr-Control-Backup` response header
        (base64 JSON); the body is the snapshot database bytes. Generation `0`
        means the latest held.
      security:
        - peerCertificate: []
      parameters:
        - name: generation
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: The generation to fetch; 0 for the latest held.
      responses:
        "200":
          description: The backup bundle — manifest in the header, snapshot in the body.
          headers:
            X-Heyarr-Control-Backup:
              schema: { type: string }
              description: The base64-encoded JSON manifest.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: The generation is not a non-negative integer.
        "404":
          description: No such backup is held for the calling peer.
        "503":
          description: This node does not hold control-plane backups for peers.
  /peer/v1/leases:
    get:
      tags: [peer]
      operationId: listAccessLeases
      summary: This peer's access leases, for a sibling to cache (§54, ADR-0048).
      description: |
        Returns the signed access-lease tokens this peer has issued and that are
        still live — unrevoked, and unexpired on this peer's clock — so a sibling
        can cache them and, once this peer is unreachable, still answer a read on
        whose authority (§53, §54, #285).

        **The tokens carry their own authority.** Each is a capability grant
        (ADR-0048) signed by this peer's identity key; a fetching peer verifies
        it against the key it already pinned for this one (ADR-0012), never
        against the connection that served it — a lease served by A stays A's
        signed statement however it travelled (the ADR-0043 caution). Serving
        them to a member therefore discloses nothing a member could not be
        granted, which is why the route needs no authorisation beyond membership.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The signed tokens of this peer's active leases (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [leases]
                properties:
                  leases:
                    type: array
                    items: { type: string }
        "503":
          description: This node issues no access leases to cache.

  /peer/v1/state/{space}/heads:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    get:
      tags: [peer]
      operationId: peerStateHeads
      summary: A space's causal heads, offered for incremental sync (§42, §44, ADR-0049).
      description: |
        Returns the space's causal frontier — the change ids no other change
        names as a parent. A sibling offers its own heads and pulls only what it
        is missing beneath them, never a full-log replay (the resumable sync a
        phone needs, §46). A head is an opaque change id; nothing here is
        decrypted (Invariant 6). This is a SEPARATE protocol from CAS sync (§44)
        that shares this listener and its mTLS authentication.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The space's causal heads (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [space_id, heads]
                properties:
                  space_id: { type: string }
                  heads:
                    type: array
                    items: { type: string }
        "404":
          description: This peer does not hold that encrypted space.
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/state/{space}/changes:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    get:
      tags: [peer]
      operationId: peerStateChanges
      summary: The opaque changes a caller is missing — ciphertext only (§42, §44).
      description: |
        Serves the space's encrypted changes. A caller may offer its known heads
        as repeated `have` query parameters; only the changes it is missing
        beneath this peer's frontier are then returned (pure DAG reachability, no
        decryption). With no `have`, the whole set is served. Every change is
        opaque: a content-addressed id, its causal parents, and ciphertext the
        peer never decrypted.
      security:
        - peerCertificate: []
      parameters:
        - name: have
          in: query
          required: false
          description: A causal head the caller already holds; repeat for each.
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: The changes the caller is missing (possibly empty), as ciphertext.
          content:
            application/json:
              schema:
                type: object
                required: [space_id, changes]
                properties:
                  space_id: { type: string }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [space_id, change_id, ciphertext]
                      properties:
                        space_id: { type: string }
                        change_id: { type: string }
                        parents:
                          type: array
                          items: { type: string }
                        ciphertext: { type: string, format: byte }
        "404":
          description: This peer does not hold that encrypted space.
        "503":
          description: This node keeps no encrypted personal state to sync.
    post:
      tags: [peer]
      operationId: peerStateChangePush
      summary: Accept one opaque change; the peer verifies its content-address (§42, Invariant 1).
      description: |
        Accepts one encrypted change from a sibling. The peer re-derives the
        change's blake3 id over its space, parents and ciphertext and refuses a
        mismatch (it never trusts a claimed id), then stores the ciphertext
        without decrypting it. Idempotent on the id.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_id, change_id, ciphertext]
              properties:
                space_id: { type: string }
                change_id: { type: string }
                parents:
                  type: array
                  items: { type: string }
                ciphertext: { type: string, format: byte }
      responses:
        "200":
          description: The id the peer verified and stored the change under.
          content:
            application/json:
              schema:
                type: object
                required: [change_id]
                properties:
                  change_id: { type: string }
        "400":
          description: The change is malformed or its id does not match its bytes.
        "404":
          description: This peer does not hold that encrypted space.
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/state/{space}/snapshot:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    get:
      tags: [peer]
      operationId: peerStateLatestSnapshot
      summary: The newest opaque snapshot a space holds — ciphertext only (§44).
      description: |
        Offers the latest encrypted snapshot this peer holds for a space, so a
        replicating sibling can seed a bounded snapshot + tail rather than the
        whole change log. The snapshot is opaque: a content-addressed id, its
        causal frontier, and ciphertext the peer never decrypted. 404 when the
        space is held but has no snapshot yet, or is not held at all.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The latest snapshot, as ciphertext.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedSnapshot"
        "404":
          description: This peer holds no snapshot for that space (or does not hold the space).
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/state/{space}/snapshots:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    post:
      tags: [peer]
      operationId: peerStateSnapshotPush
      summary: Accept one opaque snapshot; the peer verifies its content-address (§44, Invariant 1).
      description: |
        Accepts one encrypted snapshot from a sibling. The peer re-derives the
        snapshot's blake3 id over its space, frontier and ciphertext and refuses a
        mismatch, then stores the ciphertext without decrypting it. Idempotent on
        the id.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedSnapshot"
      responses:
        "200":
          description: The id the peer verified and stored the snapshot under.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id]
                properties:
                  snapshot_id: { type: string }
        "400":
          description: The snapshot is malformed or its id does not match its bytes.
        "404":
          description: This peer does not hold that encrypted space.
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/state/{space}:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    post:
      tags: [peer]
      operationId: peerStatePutSpace
      summary: Replicate a space's identity to a Full Peer (§37, §45).
      description: |
        A replicating sibling records a space's opaque id and its structural kind
        on this peer, so a Full Peer holds the whole encrypted space alongside the
        wrapped keys and changes. Idempotent; a space already held is a no-op.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [personal, family, shared, research]
      responses:
        "204":
          description: The space is recorded (or was already held).
        "400":
          description: The kind is unknown.
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/state/{space}/keys:
    parameters:
      - name: space
        in: path
        required: true
        description: The opaque space id (a UUIDv7).
        schema: { type: string }
    post:
      tags: [peer]
      operationId: peerStatePutWrappedKey
      summary: Replicate a wrapped copy of a space's key to a Full Peer (§41, §45).
      description: |
        A replicating sibling pushes one recipient's sealed copy of a space's key.
        The bytes are opaque — the peer holds them and cannot open them.
        Idempotent per (space, recipient); a re-push replaces the copy.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, wrapped]
              additionalProperties: false
              properties:
                recipient:
                  type: string
                  description: The recipient encryption key this copy is sealed for (x25519:<hex>).
                wrapped:
                  type: string
                  format: byte
                  description: The opaque sealed bytes (base64).
      responses:
        "204":
          description: The wrapped key is stored (or replaced).
        "400":
          description: The recipient or wrapped bytes are empty.
        "404":
          description: This peer does not hold that encrypted space.
        "503":
          description: This node keeps no encrypted personal state to sync.

  /peer/v1/blobs/{hash}/content:
    parameters:
      - name: hash
        in: path
        required: true
        description: The BLAKE3 digest that names the blob, as `blake3:<64 lowercase hex characters>`.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [peer]
      operationId: getPeerBlobContent
      summary: Serve a blob's bytes to a pinned peer, whole or by range.
      description: |
        **The byte-carrying hop.** This is the connection a replica actually
        travels over: the destination opens it, reads these bytes and verifies
        them against its own expectation (§21, ADR-0030). The controller is not
        on this path and there is no route anywhere that would put it there —
        no redirect, no proxy, no "just for the first sync" special case (§32).
        The controller schedules and authorises; it never carries bytes.

        It is the **same handler** as `/api/v1/blobs/{hash}/content`, which
        ADR-0013 called out in advance: blob serving is a contract, not an
        endpoint, and a replication-specific copy would be a second range
        implementation to keep in step. Ranges, the strong `ETag`, immutable
        caching and flat memory use are therefore identical here.

        What differs is the credential, which is why this is a separate route
        rather than the same one. The client API authenticates a bearer token
        (ADR-0011) and a peer holds none; this surface authenticates a pinned
        Ed25519 key in a client certificate (ADR-0012). Membership **is** the
        authorisation: a pinned member may read any blob this deployment holds,
        because a Full Peer's desired blob set is the complete canonical set
        (§19) and denying it individual blobs would be vacuous.

        The source makes no decision about what the destination needs. It
        serves an ordinary blob read.
      security:
        - peerCertificate: []
      parameters:
        - name: download
          in: query
          required: false
          description: >-
            `1`, `true` or `yes` adds `Content-Disposition: attachment`. The
            bytes, ranges and validators are identical either way.
          schema:
            type: string
      responses:
        "200":
          description: The whole blob.
          headers:
            ETag:
              description: >-
                `"blake3-<hex digest>"`. A destination never verifies against
                this: it hashes what arrives and compares against the digest it
                asked for. Trusting the validator would be trusting the source
                with extra steps (invariant 1).
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range or ranges.
          headers:
            Content-Range:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        "400":
          description: The path is not a `blake3:<64 hex>` digest.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member of this fabric.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: |
            This peer holds no such blob. Distinct from 503: a destination
            reads this as "try another source".
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "416":
          description: The requested range lies outside the blob.
          headers:
            Content-Range:
              description: '`bytes */<size>`.'
              schema: { type: string }
        "503":
          description: |
            This node has no content store behind its peer surface, so it is
            not serving bytes at all. Distinct from 404: there is nothing here
            to try again for.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    head:
      tags: [peer]
      operationId: headPeerBlobContent
      summary: Report a blob's size and range support without transferring it.
      description: >-
        Identical to `get` in every header, with no body. §28 makes it part of
        the contract every peer advertises.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The blob exists; `Content-Length` is its size.
          headers:
            ETag:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, const: bytes }
        "400":
          description: The path is not a `blake3:<64 hex>` digest.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member of this fabric.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: This peer holds no such blob.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: This node has no content store behind its peer surface.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/blobs/{hash}/manifest:
    parameters:
      - name: hash
        in: path
        required: true
        description: >-
          The BLAKE3 digest that names the BLOB, as `blake3:<64 lowercase hex
          characters>`. A manifest is looked up by the identity of the bytes it
          describes and is never itself an address, so there is deliberately no
          route anywhere that names a manifest by its own digest (ADR-0034).
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [peer]
      operationId: getPeerBlobManifest
      summary: Describe a blob's chunk sequence to a pinned peer.
      description: |
        **A description, not a negotiation.** The destination fetches what the
        source stored and decides for itself what to do about it (§20, §21,
        ADR-0030). This route is never told what the destination holds, is
        never asked what it should send, and computes no difference: there is
        no request body, no query parameter, and no response field that varies
        with the caller, so two peers asking about one blob get byte-identical
        answers. Anything else would make the source a participant in a
        decision it cannot verify, and would put the destination's inventory on
        the wire for no reason.

        **Asking never generates.** There is no manifest-on-demand here and
        there will not be. A `GET` that chunked a blob to answer would be a
        remote denial of service with a polite name — one request naming a
        20 GB blob, and the source reads 20 GB off its disks. §16 makes
        chunking lazy and ADR-0034 makes a manifest discardable at any moment,
        so "there is no manifest" is a legitimate, permanent state and the
        `404` below is the **answer**. A destination that receives it pulls the
        blob whole from `/peer/v1/blobs/{hash}/content`, which is exactly
        Milestone 4's behaviour and is always correct.

        **The credential is the same one.** Mounted beside the content route,
        on the same mTLS trust root (ADR-0012), with no new credential and no
        per-blob capability: a pinned member may already read the bytes this
        manifest describes, so refusing it the description would be theatre.

        **The digest names the manifest.** `digest` is the manifest's own
        content address, so a destination can check it received the manifest
        the source has. It is not an alias for the blob, nothing resolves it to
        bytes, and the destination still verifies the whole-object digest
        itself on any transfer that follows (ADR-0034).

        **`chunks` is a sequence, not a set.** The order is the data: a set of
        individually valid chunks assembled in the wrong order is a set of
        valid chunks and the wrong file. `digest` covers the chunk digests in
        index order for exactly that reason, so a shuffled array produces a
        response the destination rejects rather than one it reassembles
        wrongly.
      security:
        - peerCertificate: []
      responses:
        "200":
          description: The stored manifest, its chunks in index order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerBlobManifest" }
        "400":
          description: The path is not a `blake3:<64 hex>` digest.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member of this fabric.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: |
            Two distinct answers, told apart by the problem document's `type`
            URI — never by its prose, which is expected to be reworded — and
            the destination takes a different action on each.

            `.../problems/no-chunk-manifest`: this node **holds** the blob and
            has no chunk manifest for it. Asking does not produce one. Pull
            these bytes whole from this same source.

            `.../problems/not-found`: this node holds no such blob at all.
            There is nothing to read here whole or in chunks; try another
            source.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            This node has no content store behind its peer surface, so it is
            not serving bytes at all and has no manifests to describe them
            with. Matches the content route: distinct from 404 because there is
            nothing here to try again for.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/blobs/{hash}/pieces:
    parameters:
      - name: hash
        in: path
        required: true
        description: >-
          The BLAKE3 digest that names the blob, as `blake3:<64 lowercase hex
          characters>`. Pieces are not addressable and never will be: a piece
          is a transport detail with a session's lifetime, not a name for bytes
          (ADR-0041), so there is deliberately no route that names one.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
    get:
      tags: [peer]
      operationId: getPeerBlobPieces
      summary: Report which pieces of a blob this node holds.
      description: |
        **The question replication could never ask.** Every other route here
        answers about a blob held WHOLE — the inventory lists them, the content
        route serves them, the manifest describes them. A peer holding part of
        a blob was indistinguishable from one holding none of it, so two peers
        both still fetching the same blob had nothing to say to each other and
        the only available shape was `Internet → A`, then `A → B` (§23).

        This is the third answer: *I have some of it, and here is which.*

        **Asking never computes.** The piece geometry is derived from the
        blob's SIZE, which this node already knows, so answering never reads a
        byte of content. That is what makes the route safe behind a credential
        any pinned member holds — the same reasoning ADR-0034 applies to
        refusing manifest-on-demand, arriving at the opposite conclusion
        because the cost here is genuinely zero.

        **The answer is a claim, not evidence.** A peer saying it holds a piece
        is a peer saying so. The destination verifies every piece it receives
        against that piece's hash, and the whole object against its BLAKE3
        digest before it becomes a blob (invariant 1). A peer that overstates
        wastes one request and is walked past, exactly as a source that serves
        bytes it cannot back is walked past by repair (ADR-0036).

        **The credential is the same one.** Mounted beside the content and
        manifest routes on the same mTLS trust root (ADR-0012), with no new
        credential and no per-blob capability: a pinned member may already read
        these bytes, and telling it which of them are here reveals nothing it
        could not discover by asking for them.
      responses:
        "200":
          description: |
            What this node holds of the blob. `available` carries the blob's
            SIZE so that a peer computing a different geometry is refused
            rather than half-believed: two peers requesting pieces whose
            boundaries they do not share produce bytes that fail verification
            for a reason nobody could diagnose (ADR-0043).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeerBlobPieces" }
        "400":
          description: The path is not a `blake3:<64 hex>` digest.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member of this fabric.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: |
            This node holds no part of the blob and has no transfer of it in
            progress. Distinct from a `200` carrying an empty `available`,
            which would mean a transfer that has landed nothing yet — the
            difference between *never heard of it* and *fetching, nothing yet*,
            which are different things to a session choosing sources.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            This node has no content store behind its peer surface, so it holds
            no pieces to report. Matches the content and manifest routes:
            distinct from 404 because there is nothing here to try again for.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /peer/v1/blobs/{hash}/pieces/{index}:
    parameters:
      - name: hash
        in: path
        required: true
        description: The BLAKE3 digest that names the blob.
        schema:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
      - name: index
        in: path
        required: true
        description: >-
          The piece's index in the division the blob's size implies, as
          reported by the availability route. Indices are meaningful only
          within that geometry and are not names for bytes (ADR-0041).
        schema: { type: integer, minimum: 0 }
    get:
      tags: [peer]
      operationId: getPeerBlobPiece
      summary: Serve one piece of a blob, held whole or in part.
      description: |
        **Why this is a route and not a `Range` header.** ADR-0042 said
        fetching a piece would be a ranged `GET` against the existing content
        route, and for a blob held WHOLE that is exactly right. It does not
        work for a blob held in PART, which is the case §23 exists for. The
        content route promises the blob: a strong `ETag` naming the
        whole-object digest, a `Content-Length` that is the blob's length, and
        a `404` meaning *this peer does not have it*. A node holding a third of
        the bytes can honour none of those, and making it try would mean either
        lying about the `ETag` or inventing partial-content semantics on a
        route whose contract is deliberately simple (ADR-0013).

        So this route is the one way a piece is fetched, from a whole blob and
        a partial one alike, and the content route is left exactly as it is for
        the whole-blob pulls replication already does.

        **The bitset gates it.** A piece the availability record does not claim
        is refused even when the staging file happens to have bytes at that
        offset, because a partial's length is a high-water mark: bytes may be
        present at an offset whose piece was never completed. This is the one
        place where believing the bitset wrongly sends bad bytes to somebody
        else rather than failing locally (ADR-0043).

        **No validator.** A piece is not addressable, so an `ETag` would be a
        cache key for a thing with a session's lifetime, and a peer that cached
        it would later serve a piece of a geometry that no longer applies.
      responses:
        "200":
          description: The piece's bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: The hash is not a `blake3:<64 hex>` digest, or the index is not a non-negative integer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No client certificate was presented.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: The presented key is not a member of this fabric.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: |
            This node does not hold that piece — it knows nothing of the blob,
            or its availability does not claim that index, or the index is past
            the end of the blob's division. All three are the same answer to
            the caller: try another peer, or ask again later. This is the
            ordinary answer while two peers converge, not a fault.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: This node has no content store behind its peer surface.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles:
    get:
      tags: [policy]
      operationId: listQualityProfiles
      summary: Page the quality profiles.
      description: Ordered by `name`, which is unique.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of quality profiles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [policy]
      operationId: createQualityProfile
      summary: Author a quality profile.
      description: |
        A **create, not an upsert**. Device registration is an upsert because a
        television announces itself on every launch and nobody chose to do it;
        a profile is authored deliberately, and silently replacing one because
        the name matched would discard whatever it said before. A name
        collision is a `409`.

        Rules are validated here, at write time — an attribute that does not
        exist, an ordering comparison on a codec name, or a weight on a gate is
        a `400` naming the section and the rule. That is deliberate: a mistake
        in a profile should be reported to whoever wrote the profile, not
        turned into a rejection reason attached to every candidate for the next
        six months.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "201":
          description: The profile.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A profile with that name already exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles/{id}:
    get:
      tags: [policy]
      operationId: getQualityProfile
      summary: One quality profile.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [policy]
      operationId: updateQualityProfile
      summary: Replace a quality profile's rules.
      description: |
        A section the request **omits** is left alone; a section sent as `[]`
        is **cleared**. Those are different intentions, and collapsing them
        would make "clear this profile's terminal rules" and "forget to send
        them" the same request.

        A request that changes nothing emits no event. A client that re-sends
        its whole configuration on every start would otherwise turn the event
        stream into a heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteQualityProfile" }
      responses:
        "200":
          description: The profile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new name is already taken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [policy]
      operationId: deleteQualityProfile
      summary: Delete a quality profile.
      description: |
        Physical, not logical — a deliberate departure from ADR-0018's stance
        for *content*. ADR-0018 is about bytes: deleting an asset must not
        unlink blobs inline because bytes are expensive, shared and
        unrecoverable. A profile is a page of configuration, cheap to retype
        and referenced by nothing but desired state, and a soft-deleted one
        would have to be filtered out of every read path forever to avoid an
        operator seeing a profile they deleted.

        A profile still referenced by desired state is refused with `409`
        rather than cascaded: deleting the standard by which desire is
        measured, and leaving the desire, would make satisfaction unanswerable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Still referenced by desired state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/quality-profiles/{id}/evaluate:
    post:
      tags: [policy]
      operationId: evaluateCandidates
      summary: Score release candidates against a profile, and explain every answer.
      description: |
        §63: evaluation is **deterministic and inspectable**. This endpoint is
        what makes the second half true — an evaluation you can only reach
        through a background job is not inspectable, because "why did it pick
        that release, last Tuesday, at 3am" cannot be answered by re-running
        something that has since moved on.

        It **writes nothing**. A `POST` because the body carries the
        candidates, not because it changes anything — the same reasoning as
        `/playback/plan` — and it needs only `read`.

        Hand it candidates and it answers with the same values the search job
        will get, which makes a profile testable *before* it is used in anger.

        ### The reasons are the deliverable

        Every rule that was considered produces a reason, not only the ones
        that failed — a rule that ran silently is a rule nobody can confirm
        ran. §61 lists opaque scoring among the things Heyarr avoids, and a
        score with no reasons is exactly that.

        | result | meaning |
        |---|---|
        | `pass` | an `accept` or `terminal` rule held |
        | `fail` | an `accept` rule did not hold — **this gate rejected the candidate**, and nothing else uses this word |
        | `bonus` / `penalty` | a `prefer` rule landed, contributing its (possibly negative) weight |
        | `miss` | a `prefer` rule did not land, or a `terminal` condition was not reached. **Not** a rejection |
        | `undetermined` | the provider could not determine the attribute |

        `undetermined` is deliberately not `fail`. "This release is 720p and
        you wanted 1080p" and "nobody could tell what resolution this is" are
        different situations, and an operator seeing the second knows to look
        at the provider rather than at the release. An undetermined **gate**
        still rejects — a gate that cannot be shown to hold must not pass, or a
        profile saying "1080p minimum" quietly accepts a release nobody could
        measure.

        ### The ranking is a total order

        Accepted candidates rank above rejected ones (a rejected candidate's
        score is a number about something that will not be used); then by score
        descending; then by **candidate id ascending**, which is a stable key
        that does not depend on the order the candidates were supplied in.

        Without that last tie-break two equally good releases swap places
        between runs and the upgrade workflow churns between them forever — a
        bug that presents as bandwidth.

        `selected` is a separate field rather than "the first of `ranked`"
        because the first element is not necessarily acceptable: when
        everything was rejected it is merely the least bad, and acquiring it
        would be exactly what §62's gates exist to prevent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: Every candidate, ranked and explained.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs:
    get:
      tags: [operations]
      operationId: listJobs
      summary: Page the job queue.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: state
          in: query
          schema: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/jobs/{id}:
    get:
      tags: [operations]
      operationId: getJob
      summary: One job.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{id}/retry:
    post:
      tags: [operations]
      operationId: retryJob
      summary: Put a finished job back on the queue. Requires `write`.
      description: |
        An operator action: something was wrong and has been fixed. Only a
        succeeded, failed or dead job may be retried; a pending or leased one is
        a 409, because "retry" on a job that is already running would mean
        running it twice.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The job, back in `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/events:
    get:
      tags: [operations]
      operationId: streamEvents
      summary: The event stream (server-sent events).
      description: |
        A live SSE feed of §76 events, preceded by everything after `after`.

        Reconnection is gapless: a client that saw sequence N reconnects with
        `?after=N` and receives everything since, with no hole and no duplicate.
        The subscription is opened before the catch-up read — the other order
        leaves a window in which committed events are in neither half, and both
        halves look complete on their own.

        Each frame carries `id: <seq>`, so a browser `EventSource` resumes on
        its own via `Last-Event-ID`, which this endpoint honours when `after` is
        absent.

        A slow consumer is dropped rather than backpressured (ADR-0009). When
        that happens the stream emits one `heyarr.stream.gap` event carrying
        `resume_after` and `dropped`, and closes. Reconnect with
        `?after=resume_after`. Closing silently would be indistinguishable from
        a network blip, and a client cannot tell "refill" from "carry on".

        Resume from the highest sequence number you have seen. Under concurrent
        writes a straggler may arrive slightly out of order; nothing is ever
        delivered twice.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: Deliver everything with a sequence number greater than this.
        - name: types
          in: query
          schema: { type: string }
          description: |
            Comma-separated event types. Each is an exact name (`job.failed`) or
            a trailing-`*` namespace prefix (`job.*`).
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/identities/users:
    get:
      tags: [operations]
      operationId: listIdentityUsers
      summary: Every pinned user identity. Requires `admin`.
      description: |
        The device-identity trust root (§40, ADR-0048): the user public keys
        this node has pinned, against which a device's enrolment cert is
        verified. Reading it is `admin` because the list is a map of who may
        authenticate as a principal on this node. It carries no secret and no
        cert — a user identity's private key is the person's and never enters
        the server (ADR-0032).
      responses:
        "200":
          description: The pinned user identities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operations]
      operationId: enrolUser
      summary: Pin a user identity. Requires `admin`.
      description: |
        The out-of-band pin ADR-0032 requires: an operator reads a user's public
        key from `heyarr identity show` and posts it here. Nothing that user
        signs is honoured until this pin exists — "a key issued and immediately
        honoured" must stay unspellable, so pinning is a deliberate human act,
        not something a device can assert about itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              additionalProperties: false
              properties:
                public_key:
                  type: string
                  description: The user's public key, `ed25519:<64 hex characters>`.
                name: { type: string }
      responses:
        "201":
          description: The pinned user identity.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/identities/users/{key}:
    delete:
      tags: [operations]
      operationId: revokeIdentityUser
      summary: Unpin a user identity. Requires `admin`.
      description: |
        Revocation is removing the pin (ADR-0012's shape, applied to a user). It
        cascades to the user's devices: a device authenticates only as its user,
        and a device with no user authenticates as nobody. Returns the record it
        removed rather than 204, so an operator can see exactly which key stopped
        being trusted.
      parameters: [{ $ref: "#/components/parameters/publicKey" }]
      responses:
        "200":
          description: The unpinned user identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/identities/users/{key}/devices:
    get:
      tags: [operations]
      operationId: listIdentityDevices
      summary: A user's enrolled devices. Requires `admin`.
      description: |
        The device keys this user has vouched for. The enrolment cert is not on
        the wire: authentication re-verifies the presented cert against the
        pinned user key rather than trusting a stored copy, so the stored token
        is an implementation detail, not a field a client reads.
      parameters: [{ $ref: "#/components/parameters/publicKey" }]
      responses:
        "200":
          description: The user's enrolled devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/identities/devices:
    post:
      tags: [operations]
      operationId: enrolDevice
      summary: Enrol a device under the user its cert names. Requires `admin`.
      description: |
        The cert is the whole request: it names its own user and device keys and
        is verified against the pinned user key before anything is written, so a
        device cannot be enrolled under a user who did not sign for it, and a
        cert naming an unpinned user is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert]
              additionalProperties: false
              properties:
                cert:
                  type: string
                  description: The user-signed enrolment cert, as `heyarr identity enrol` produced.
                name: { type: string }
      responses:
        "201":
          description: The enrolled device.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/identities/devices/{key}:
    delete:
      tags: [operations]
      operationId: revokeIdentityDevice
      summary: Revoke a device. Requires `admin`.
      description: |
        A tombstone, unlike a user revoke: the row stays and `revoked_at` is set,
        so a re-presented cert for the key is refused rather than silently
        re-enrolled, and the revocation is auditable.
      parameters: [{ $ref: "#/components/parameters/publicKey" }]
      responses:
        "200":
          description: The revoked device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tokens:
    get:
      tags: [operations]
      operationId: listTokens
      summary: Every credential. Requires `admin`.
      description: |
        Not paginated: the number of tokens is the number of integrations an
        operator has set up, and unlike the catalog nothing writes to this table
        while it is being read.
      responses:
        "200":
          description: The credentials. Never any secret material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [operations]
      operationId: createToken
      summary: Mint a credential. Requires `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name: { type: string }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [read, write, admin] }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: |
            The credential and its secret. The secret is returned exactly once
            and is not recoverable: only its argon2id hash was stored.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{id}:
    get:
      tags: [operations]
      operationId: getToken
      summary: One credential. Requires `admin`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [operations]
      operationId: revokeToken
      summary: Revoke a credential. Requires `admin`.
      description: |
        Logical: the row stays and `revoked_at` is set. An audit trail that
        deletes the thing being audited is not one. Revoking twice is a 409, so
        a script cannot mistake "already revoked" for "revoked something just
        now".
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The revoked credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque scoped token (ADR-0011), presented as `Authorization: Bearer
        heyarr_…`. The header is the only place a credential is accepted: a
        `?token=` parameter would write it into every proxy log, browser history
        and Referer header between the client and here.

        Scopes are ordered — `admin` implies `write` implies `read`. Every
        route under /api/v1 requires at least `read`.

    peerCertificate:
      type: mutualTLS
      description: |
        A self-signed X.509 certificate carrying this peer's Ed25519 public
        key, pinned against the controller-issued membership record
        (ADR-0012). There is no CA and no PKI: the certificate proves
        possession of a key, and membership decides whether that key may
        speak. Both ends pin, so the dialler authenticates the listener by
        exactly the same rule.

        It is checked twice — during the handshake, and again on every request
        the connection carries. Revocation is deleting the membership record,
        and there is no revocation list to fall back on, so the freshness of
        that second lookup is the mechanism.

        This credential is accepted ONLY on /peer/v1, and a bearer token is
        never accepted there. A connection presenting no client certificate is
        refused during the handshake, not with a status code.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    publicKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: |
        A rendered Ed25519 public key, `ed25519:<64 hex characters>` — a user
        key on the user routes, a device key on the device route. The ":" is a
        legal path character and no key contains a "/".
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        An opaque position from a previous page's `next_cursor`. It is scoped to
        one collection: a cursor from `/works` is rejected by `/jobs` rather
        than being read as a position in a different sort order.
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Values above the maximum are clamped, not rejected.

  responses:
    BadRequest:
      description: The request is malformed or semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No credential, or one that was rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: A valid credential that does not carry the required scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        No such resource. Never an empty 200: a client cannot tell "no such
        work" from "a work with nothing in it" if both are 200, and it is the
        difference between retrying and giving up.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request contradicts current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    SelfEnrolledDevice:
      type: object
      description: A device as this peer now knows it, after self-enrolment (ADR-0067).
      required: [device_key, name, user, admitted_by, enrolled_at, expires_at]
      properties:
        device_key:
          type: string
          description: The device's Ed25519 signing key, `ed25519:<hex>`.
        encryption_key:
          type: string
          description: The device's X25519 encryption key, `x25519:<hex>`, when the cert binds one.
        name:
          type: string
        user:
          type: string
          description: The pinned user the device is enrolled under, `ed25519:<hex>`.
        enrolled_at:
          type: string
          format: date-time
        admitted_by:
          type: string
          description: >-
            The hash (`sha256:<hex>`) of the op that admitted the device — what
            the device cites as its own admission (ADR-0068).
        expires_at:
          type: string
          format: date-time
          description: When the admitting op expires; any member may re-add the device before then.
    Membership:
      type: object
      description: An identity's membership op log as this node holds it (ADR-0068).
      required: [usr, ops]
      properties:
        usr:
          type: string
          description: The identity's genesis public key, `ed25519:<hex>`.
        ops:
          type: array
          items: { type: string }
          description: Every recorded op token, oldest issued first. Empty is `[]`, never null.
        recorded:
          type: integer
          description: On a push, how many of the posted ops this node had not seen. Absent on a GET.
    EncryptedSpace:
      type: object
      description: |
        A personal-state space as the peer holds it (§38, §39). Opaque id,
        structural kind, and when the peer recorded it — never a name.
      required: [id, kind, created_at]
      additionalProperties: false
      properties:
        id: { type: string, description: The opaque space id (a UUIDv7). }
        kind:
          type: string
          enum: [personal, family, shared, research]
        created_at: { type: string, format: date-time }
    WrappedKeyInput:
      type: object
      description: One recipient's sealed copy of a space key, as pushed at create time.
      required: [recipient, wrapped]
      additionalProperties: false
      properties:
        recipient:
          type: string
          description: The recipient encryption key this copy is sealed for (x25519:<hex>).
        wrapped:
          type: string
          format: byte
          description: The opaque sealed bytes (base64). The peer cannot open them.
    WrappedKey:
      type: object
      description: A stored wrapped copy of a space key.
      required: [recipient, wrapped, created_at]
      additionalProperties: false
      properties:
        recipient: { type: string }
        wrapped: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    EncryptedChange:
      type: object
      description: |
        One opaque CRDT change (§42, §44). Content-addressed by the blake3 digest
        of its space, parents and ciphertext; the peer verifies the id and never
        decrypts the ciphertext.
      required: [space_id, change_id, ciphertext]
      additionalProperties: false
      properties:
        space_id: { type: string }
        change_id: { type: string, description: "blake3:<hex> over space, parents and ciphertext." }
        parents:
          type: array
          items: { type: string }
        ciphertext:
          type: string
          format: byte
          description: The encrypted change (base64), opaque to the peer.

    EncryptedSnapshot:
      type: object
      description: |
        A materialised CRDT state at a causal point (§44), encrypted under the
        space key. Content-addressed by the blake3 digest of its space, frontier
        and ciphertext; the peer verifies the id and never decrypts it.
      required: [space_id, snapshot_id, ciphertext]
      additionalProperties: false
      properties:
        space_id: { type: string }
        snapshot_id: { type: string, description: "blake3:<hex> over space, frontier and ciphertext." }
        frontier:
          type: array
          items: { type: string }
          description: The causal heads this snapshot materialises; the tail begins after them.
        ciphertext:
          type: string
          format: byte
          description: The encrypted materialised state (base64), opaque to the peer.

    Problem:
      type: object
      description: RFC 9457. Clients branch on `type` and nothing else.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlates the response with the server log line.

    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          description: Absent on the last page.

    Work:
      type: object
      required: [id, content_type, work_key, title, sort_title, attributes, created_at, updated_at]
      properties:
        id: { type: string }
        content_type: { type: string }
        work_key:
          type: string
          description: Normalised identity, so a rescan converges on the same work.
        title: { type: string }
        sort_title: { type: string }
        year: { type: [integer, "null"] }
        attributes:
          type: object
          description: |
            Per-content-type fields. They live here rather than as columns so
            that registering a fourth content type is not a migration.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Edition:
      type: object
      required: [id, work_id, label, edition_type, attributes, created_at]
      properties:
        id: { type: string }
        work_id: { type: string }
        label: { type: string }
        edition_type: { type: string }
        language: { type: [string, "null"] }
        attributes: { type: object }
        created_at: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, edition_id, source_class, role, identification_source, created_at, updated_at]
      properties:
        id: { type: string }
        edition_id: { type: string }
        library_id: { type: [string, "null"] }
        source_class:
          type: string
          enum: [managed, linked, vault]
        blob_hash:
          type: [string, "null"]
          description: |
            Null for a `linked` asset, which has no blob at all — not a mutable
            one, not a special one, none (ADR-0020). That is what keeps blob
            immutability absolute.
        source_path: { type: [string, "null"] }
        role: { type: string }
        filename: { type: [string, "null"] }
        mime: { type: [string, "null"] }
        identification_source: { type: string }
        missing_since:
          type: [string, "null"]
          format: date-time
          description: Set when the source path vanished. Not a deletion.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Blob:
      type: object
      required: [hash, size, chunked, chunk_manifest, first_seen_at]
      properties:
        hash:
          type: string
          description: "`blake3:<64 hex>` — the canonical byte identity (ADR-0005)."
        size: { type: integer, format: int64 }
        mime: { type: [string, "null"] }
        chunked:
          type: boolean
          description: >-
            Compatibility only: true exactly when `chunk_manifest` is
            `present`. It was a stored column from Milestone 1 until migration
            00029 and was `false` on every row in every deployment, because
            nothing ever wrote it. It is now computed, and it is kept rather
            than removed because it is a required field and dropping it would
            break every client that reads it. It cannot express the third state
            §16 needs, so do not branch on it — read `chunk_manifest`.
          deprecated: true
        chunk_manifest:
          type: string
          enum: [present, not_required, undecided]
          description: >-
            Whether these bytes have a chunk manifest (§15, §16, ADR-0034).
            `present` — one exists. `not_required` — a decision was recorded
            that these bytes will never need one; §16 allows that small blobs
            never do. `undecided` — nobody has decided yet. The last two are
            what a single boolean could not tell apart, and they are the two a
            replication decision branches on. Reading this field never causes a
            manifest to be generated.
        first_seen_at: { type: string, format: date-time }

    Library:
      type: object
      required: [id, name, content_type, enabled, created_at, roots]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        roots:
          type: array
          items: { $ref: "#/components/schemas/LibraryRoot" }

    LibraryRoot:
      type: object
      required: [id, library_id, path, ingest_mode, enabled, created_at]
      properties:
        id: { type: string }
        library_id: { type: string }
        path: { type: string }
        ingest_mode: { type: string, enum: [reflink, hardlink, copy, link] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    Peer:
      type: object
      required: [id, name, site, mode, is_self, created_at, enrolled_at, health, last_seen_at, snapshot]
      properties:
        id: { type: string }
        name: { type: string }
        site: { type: string, description: The failure domain this peer is in. }
        mode: { type: string, enum: [full, partial, cache, archive, compute] }
        endpoint:
          type: [string, "null"]
          description: |
            Where to reach the peer — an `https` origin, or a `unix://`
            socket path — or null when no endpoint is recorded. A
            bare `host:port` given at registration is stored as
            `https://host:port`. Not its identity.
        public_key:
          type: [string, "null"]
          description: |
            The peer's Ed25519 identity as `ed25519:<64 lowercase hex>` — the
            same algorithm-prefixed shape as a blob digest, so the two are not
            confused in a terminal. Null for a peer that has not established an
            identity yet (ADR-0012).

            This is the PUBLIC half, and it is what another site needs in order
            to enrol this peer. The private key is never exposed here or
            anywhere else in the API: it is a 0600 file in the data directory
            that the API layer does not read.
          pattern: "^ed25519:[0-9a-f]{64}$"
        is_self: { type: boolean }
        created_at: { type: string, format: date-time }
        enrolled_at:
          type: string
          format: date-time
          description: |
            When this peer was admitted to the fabric (M4-04). For the self
            peer it equals `created_at`. Revocation is deletion (ADR-0012), so
            a peer removed and re-enrolled comes back with a new `id` and a new
            `enrolled_at` — which is what makes this the answer to "has
            membership changed?" rather than a copy of `created_at`.
        health:
          type: string
          enum: [unknown, reachable, unreachable]
          description: |
            Whether this peer is reachable (§31, §32, M4-10).

            It is OBSERVED, not declared. A peer is `reachable` because it
            answered something recently — an inventory report, a served range,
            or a cheap probe when nothing else has happened — and there is no
            endpoint through which a peer can assert its own health.

            `unreachable` means SILENCE past the window, not a failed request.
            A peer that answered a request with a 500 is `reachable`: a 500
            proves a process is listening, and the question here is whether
            anything is there. `unknown` is a peer nothing has ever heard from,
            and it is deliberately not a synonym for reachable — an unprobed
            peer has not been shown to be up.

            Health is advisory for reads and does not affect membership: an
            unreachable peer is skipped as a read source, and still accrues the
            replication work it is owed.
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this peer last answered anything, or null if it never has.

            It ships beside `health` rather than instead of it because
            "unreachable" on its own is a status nobody can act on: it does not
            say whether to go and restart something or to wait twenty seconds.
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/PeerSnapshot"
            - type: "null"
          description: |
            The peer's materialised catalog snapshot (§52, M4-13), or `null`
            when this controller has never issued it one.

            Explicitly nullable rather than an omitted key, and never a zero
            object. "This peer holds a snapshot of an empty library" and "this
            peer holds no snapshot" are different answers — in Milestone 7 one
            means the library is empty and the other means the peer cannot help
            you — and a client that had to tell them apart by inspecting a row
            count would eventually get it wrong during an outage, which is the
            only time it matters.

    PeerSnapshot:
      type: object
      required: [controller_id, version, generated_at, kind, rows, content_digest, age_seconds]
      description: |
        What a peer's catalog snapshot is a fact ABOUT: which controller, which
        version, and how old (§52, §53).
      properties:
        controller_id:
          type: string
          description: |
            The controller whose catalogue this is. Recorded even though there
            is exactly one controller (ADR-0029), because a snapshot restored
            from another deployment's backup (§51, §82) has to be recognisable
            as somebody else's.
        version:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic per peer, allocated by the controller — the single writer
            is the only place monotonicity can actually be guaranteed
            (ADR-0003). It starts at 1; there is no version 0, because absent
            is the absence of a snapshot rather than a snapshot numbered zero.
        generated_at:
          type: string
          format: date-time
          description: |
            When the controller READ the catalogue — not when the peer applied
            it, and not when a row was last written.
        kind:
          type: string
          enum: [full, incremental]
          description: |
            Which path produced this one. A full rebuild is the drift
            corrector, and "when did this peer last take the slow, safe path?"
            is an operational question that is unanswerable if the two are
            indistinguishable after the fact.
        rows:
          type: integer
          format: int64
          minimum: 0
          description: How many rows it carries, across every covered table.
        content_digest:
          type: string
          description: |
            A fingerprint of the CONTENTS, excluding the metadata — so an
            incremental refresh and a full rebuild of the same catalogue state
            can be shown to be identical, which they are.
        age_seconds:
          type: number
          format: double
          description: |
            How old the snapshot is, measured against the CONTROLLER's clock,
            which is the only clock that can say how stale its own catalogue
            read is. It may be negative if the reader's clock is behind; that
            is reported as measured rather than clamped, because an operator
            who sees a negative age has learned something true.

    PeerBlobPieces:
      type: object
      description: |
        What one node holds of a blob, whole or in part (§23, ADR-0042,
        ADR-0043).

        It is a CLAIM and never evidence. Every piece a destination receives is
        verified against that piece's hash, and the whole object against its
        BLAKE3 digest before it becomes a blob (invariant 1), so a node that
        overstates costs one wasted request and cannot cause a wrong blob.
      required:
        - blob_hash
        - available
      properties:
        blob_hash:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
          description: >-
            The blob asked about, echoed so a response cannot be mistaken for
            one about a different blob if it is logged or cached.
        available:
          type: string
          description: |
            The availability, as `<blob size in bytes>:<lowercase hex bitset>`,
            one bit per piece in index order.

            The SIZE is what is on the wire, and neither the piece count nor
            the piece length is. The count cannot be implied by the bitset's
            width — a bitset for 20 pieces and one for 21 are both three bytes
            — and the count in turn does not determine the piece length: 1024
            pieces is a 256 MiB blob at 256 KiB pieces and equally an 8 GiB
            blob at 8 MiB pieces. The size determines both, by the same
            deterministic rule both peers already run, so the reader derives
            the geometry rather than believing a claimed one, and a peer
            describing a division this node would not compute is refused
            (ADR-0043).

            An empty string means this node holds none of it yet — a transfer
            in progress that has landed nothing. A node that knows nothing
            about the blob answers `404` instead.
          example: "3145728:ff0f"

    PeerBlobManifest:
      type: object
      description: |
        One blob's chunk sequence, as a source describes it to a pinned peer
        (§15, §16, ADR-0034).

        It is an optimisation and never an identity. It is keyed by
        `blob_hash`, the ADR-0005 whole-object digest of the bytes it
        describes, and it is never the key of anything: nothing resolves
        `digest` to bytes, and two blobs with identical chunk sequences are
        still two blobs.
      required:
        - blob_hash
        - digest
        - algorithm
        - params
        - covered_size
        - chunk_count
        - generated_at
        - chunks
        - served_by
      properties:
        blob_hash:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
          description: The whole-object digest of the blob this manifest describes.
        digest:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
          description: |
            The manifest's OWN content address, so a destination can verify it
            received the manifest the source has. It names the manifest. It is
            not an alias for the blob, it does not appear in `blobs`, and
            nothing may resolve it to bytes (ADR-0034).

            It covers the blob hash, the chunker parameters and the chunk
            digests **in index order**, which is what makes it detect a
            reordered manifest at all.
        algorithm:
          type: string
          description: >-
            The chunker that produced it, e.g. `fastcdc`. Stored rather than
            assumed: a manifest computed under another algorithm describes the
            same bytes and shares none of the same boundaries.
        params:
          type: object
          description: >-
            The chunker settings, on the wire for the same reason `algorithm`
            is. A destination whose defaults have moved has to be able to tell
            that what it was handed is not comparable with what it would
            compute.
          required: [min, avg, max]
          properties:
            min: { type: integer, description: Minimum chunk size in bytes. }
            avg: { type: integer, description: Target average chunk size in bytes; a power of two. }
            max: { type: integer, description: Maximum chunk size in bytes. }
        covered_size:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The end offset of the last chunk. A manifest is internally
            consistent without being complete for a given blob; comparing this
            against the blob's size is the caller's question to ask.
        chunk_count:
          type: integer
          minimum: 0
          description: >-
            How many chunks `chunks` carries. A destination that receives a
            different number has a truncated response rather than a tampered
            manifest, and the two are reported differently.
        generated_at:
          type: string
          format: date-time
          description: When the source produced this manifest, in UTC.
        chunks:
          type: array
          description: |
            The chunk **sequence**, in index order. Not a set: the order is the
            data, because a set of individually valid chunks assembled in the
            wrong order is a set of valid chunks and the wrong file, and the
            per-chunk digests cannot see it.

            An empty array is valid and is what an empty blob has.
          items:
            type: object
            required: [offset, length, digest]
            properties:
              offset:
                type: integer
                format: int64
                minimum: 0
                description: >-
                  Where this chunk starts in the blob. Carried even though it
                  is derivable from the preceding lengths, because a receiver
                  that recomputed it could not see a gap — it would have just
                  filled it in.
              length:
                type: integer
                format: int64
                minimum: 1
                description: How many bytes this chunk covers. Never zero.
              digest:
                type: string
                pattern: '^blake3:[0-9a-f]{64}$'
                description: >-
                  The BLAKE3 digest of this chunk's bytes. It is a place to
                  fetch bytes from, never an identity for a blob.
        served_by:
          type: string
          description: >-
            The answering node's own peer id, so a destination can tell which
            end of the fabric replied. It is the only field about anything
            other than the manifest, and it is about the SOURCE — there is no
            field describing the caller, because the source formed no opinion
            about the caller.
    CatalogSnapshot:
      type: object
      required: [meta, libraries, library_roots, works, editions, blobs, assets]
      description: |
        One snapshot payload: metadata, rows, and — for an incremental refresh
        — the complete id set of each covered table.

        **Why an incremental payload carries every id.** Deletion. A payload of
        "rows that changed since T" says nothing about rows that stopped
        existing, and a snapshot that silently keeps a deleted work forever is
        not fresh, it is haunted. Shipping every id is cheaper than tombstones
        in the control plane and has a property they do not: an incremental
        refresh and a full rebuild of the same catalogue state converge on
        identical contents.
      properties:
        meta:
          $ref: "#/components/schemas/CatalogSnapshotMeta"
        libraries:
          type: array
          items: { type: object }
          description: Library organisation.
        library_roots:
          type: array
          items: { type: object }
        works:
          type: array
          items: { type: object }
          description: The semantic content spine (§11).
        editions:
          type: array
          items: { type: object }
        blobs:
          type: array
          items: { type: object }
          description: |
            Byte identities and their shape (§13, ADR-0005) — never the bytes.
            Those are the CAS's, and the peer already holds them in full (§80).
        assets:
          type: array
          items: { type: object }
          description: Assets and their blob mappings.
        ids:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            The complete id set per covered table, present only on an
            incremental payload. A full payload does not need it: its rows ARE
            the complete set.

            An ABSENT set and an EMPTY one mean opposite things here — keep
            everything, keep nothing — so the peer refuses an incremental
            payload that omits a table rather than guessing.

    CatalogSnapshotMeta:
      type: object
      required: [controller_id, version, generated_at, kind, watermark]
      properties:
        controller_id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        generated_at: { type: string, format: date-time }
        kind: { type: string, enum: [full, incremental] }
        watermark:
          type: string
          format: date-time
          description: |
            The high-water mark the NEXT incremental refresh asks from. A
            separate field from `generated_at` because the source selects rows
            AT OR AFTER it: re-sending a row costs one redundant upsert, while
            excluding one that changed in the same instant costs a snapshot
            that is silently missing it.

    PeerIdentity:
      type: object
      required: [peer_id, name, public_key, served_by, speaks]
      description: |
        The identity the answering node derived from the client certificate on
        the connection, plus which node answered.

        Every field here is the SERVER's conclusion. A caller cannot influence
        any of it, which is the property that makes this endpoint worth having:
        comparing `peer_id` against the id enrolment returned is an assertion
        that pinning happened, and a 200 alone is not.
      properties:
        peer_id:
          type: string
          description: The caller's membership id, as this node resolved it.
        name:
          type: string
          description: The caller's name in this node's membership records.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: |
            The pinned key, so a caller can compare it against the one it
            enrolled. The public half, as everywhere else in this API.
        served_by:
          type: string
          description: The answering node's own peer id.
        speaks:
          type: array
          items:
            type: string
          description: |
            What the ANSWERING node's peer surface will actually do, so a
            caller can tell a piece peer from a web seed before asking either
            of them for anything (§27, ADR-0042).

            `blob-content` is the ranged content route every serving node has
            had since M4-09 — the byte channel a web seed is. `piece-exchange`
            is the availability and piece routes; its ABSENCE is what makes a
            member a web seed.

            Derived from what the answering server was built with rather than
            from what was configured, so it cannot claim a capability whose
            routes refuse. A reader that meets a name it does not know must
            ignore it, and one that meets a missing name must not conclude the
            peer is broken — this list grows.

    PeerReachback:
      type: object
      required: [result, target, detail]
      description: |
        Whether the answering node can reach the caller (#186, ADR-0040).
      properties:
        result:
          type: string
          enum: [reachable, unreachable, unknown]
          description: |
            `reachable` — something answered at `target`, whatever it answered.
            `unreachable` — an attempt was made and nothing answered.
            `unknown` — no attempt was made, because this node holds no
            endpoint for the caller or serves no prober. A caller must not read
            `unknown` as a fault: it is the absence of evidence, and refusing
            an enrolment on it would refuse every peer that is simply off.
        target:
          type: string
          description: |
            The address this node tried, read out of its own membership record
            for the caller. Empty when no attempt was made. A caller learns
            from it whether the address recorded for it here is still its own.
        detail:
          type: string
          description: A human-readable explanation, empty when reachable.

    PeerAttachRequest:
      type: object
      required: [peer_id]
      description: |
        What a Full Peer declares when it attaches. `peer_id` is a declaration,
        not a credential: the controller compares it against the identity the
        certificate proved and refuses a mismatch (ADR-0033).
      properties:
        peer_id:
          type: string
          description: The membership id this peer believes it holds.
      additionalProperties: false

    PeerAttachment:
      type: object
      required: [peer_id, name, public_key, controller, control_plane, principal]
      description: |
        A peer's attachment to a controller, as the controller records it.

        Every field is the controller's conclusion, derived from the client
        certificate. Nothing a caller sent is echoed back — including the
        declared `peer_id`, which is compared and then discarded.
      properties:
        peer_id:
          type: string
          description: The acting peer, derived from the certificate.
        name:
          type: string
          description: The acting peer's name in the controller's membership records.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: The pinned key, as the controller holds it.
        controller:
          type: string
          description: The answering controller's own peer id.
        control_plane:
          type: string
          enum: [controller-attached]
          description: |
            A Full Peer runs no control plane of its own (ADR-0029). Stated in
            the response so a peer that ever receives something else fails
            loudly rather than assuming.
        principal:
          type: string
          enum: [peer]
          description: |
            The kind of credential that was accepted. Never `admin`: a peer
            certificate authorises the peer surface, acting as that peer, and
            a peer reading `admin` here would have found a privilege
            escalation (ADR-0033).

    InventoryEntry:
      type: object
      required: [blob_hash, state]
      description: One blob, as the reporting peer's disk has it.
      properties:
        blob_hash:
          type: string
          description: The canonical digest. Identity is the hash and nothing else (ADR-0005).
        state:
          type: string
          enum: [present, corrupt, missing]
          description: |
            A subset of `replicas.state` on purpose. `pending` is a
            controller-side fact — a transfer it scheduled and is waiting for —
            and a peer reporting it would be asserting something about the
            controller's plans rather than about its own disk.

            `corrupt` is a quarantined blob: bytes the peer still HAS and
            cannot serve (ADR-0018). It is reported rather than omitted,
            because omitting it reports the blob as gone and invites a
            replacement transfer over the evidence, while reporting it present
            leaves the controller believing in a copy nothing can read.
        bytes_present:
          type: integer
          format: int64
          default: 0
          description: How many bytes the peer holds. 0 for anything not `present`.
        verified_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this peer last confirmed the bytes hash to their own name, if
            it ever has. Absent rather than "now" when the peer has no
            verification record: collecting an inventory reads a directory, it
            does not re-hash a library, and stamping the collection time here
            would manufacture verification evidence out of a directory listing.

            A report that carries no `verified_at` never CLEARS the one the
            controller already holds.
      additionalProperties: false

    InventoryReport:
      type: object
      required: [peer_id, mode, observed_at]
      description: What a peer sends the controller about its own store.
      properties:
        peer_id:
          type: string
          description: |
            A DECLARATION, not a credential. The controller derives the acting
            peer from the client certificate, compares this against it, and
            refuses a mismatch (ADR-0033).
        mode:
          type: string
          enum: [full, incremental]
          description: |
            What this report asserts about a blob it does not mention: a full
            report asserts absence, an incremental report asserts nothing.
        observed_at:
          type: string
          format: date-time
          description: |
            When the PEER looked at its disk, on the peer's clock. The gap
            between this and the controller's receipt is how stale the report
            already was when it arrived.
        entries:
          type: array
          items: { $ref: "#/components/schemas/InventoryEntry" }
          description: |
            The inventory. A full report with no entries is a peer that holds
            nothing — a legitimate and important thing to be able to say, and
            an implementation that read the empty set as "nothing to report"
            would let a wiped peer keep its replicas forever.
      additionalProperties: false

    InventoryOutcome:
      type: object
      required: [report_id, peer_id, mode, entries, added, changed, removed, unknown, observed_at, received_at]
      description: |
        What folding one report into `replicas` did. Counts, not rows: the
        per-blob facts are durable in `replicas`, which is where anything
        wanting the detail must look.
      properties:
        report_id: { type: string, description: The receipt row this report was recorded as. }
        peer_id:
          type: string
          description: |
            The peer the CONTROLLER acted on, derived from the certificate. A
            peer comparing it against what it sent is asserting that its report
            landed under its own identity.
        mode: { type: string, enum: [full, incremental] }
        entries: { type: integer, description: How many the report carried. }
        added: { type: integer, description: Replica rows this report created. }
        changed:
          type: integer
          description: Existing rows whose state or byte count changed, excluding those moved to `missing`.
        removed:
          type: integer
          description: |
            Rows this report moved to `missing`, by an explicit `missing` entry
            or by absence from a full report. Counted apart from `changed`
            because it is the only direction that makes the library less safe.
        unknown:
          type: integer
          description: |
            Entries naming a blob this controller has no row for. Not an error:
            a peer restored from a newer catalog legitimately holds bytes this
            controller has not learned about, and there is no `blobs` row to
            reference.
        observed_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }

    PeerRegistration:
      type: object
      required: [name, public_key]
      description: |
        What an operator asserts about another node.

        There is deliberately no variant of this shape without `public_key`. A
        registration carrying only a name and an endpoint would be a request to
        trust whatever answers at that address — trust on first use — and
        ADR-0012 pins keys rather than addresses.
      properties:
        name:
          type: string
          description: Unique within this instance.
        site: { type: string, description: The peer's failure domain (§35). }
        mode:
          type: string
          enum: [full, partial, cache, archive, compute]
          default: full
        endpoint:
          type: string
          description: |
            Where to reach the peer. NOT its identity: posting the same
            `public_key` with a different endpoint moves the peer, and its
            `id`, its `enrolled_at` and everything referring to it are
            unaffected.

            Given as an origin — `https://host:port` — or as a bare
            `host:port`, which is normalised to `https://host:port`: the
            inter-peer path is mutually authenticated TLS (ADR-0012), so there
            is exactly one scheme to guess, and `http://` is refused rather
            than upgraded. A `unix:///path/to.sock` socket is accepted for a
            peer on this host. Anything nothing could dial — no host, a port
            that is not a port, an unknown scheme, a path where an origin
            belongs — is a `400`, refused here rather than by whatever first
            tries to dial it. The stored value is the normalised one: what
            `GET /api/v1/peers` returns can be posted straight back.

            Omitted or empty is legitimate and means "not known yet": a peer
            may be enrolled by its key before anyone knows where it will live.
        public_key:
          type: string
          pattern: "^ed25519:[0-9a-f]{64}$"
          description: |
            Who the peer is — the exact string the other site's
            `heyarr peers list` prints. This is the pin ADR-0012 describes, and
            it is the only trust root in the inter-peer path.

    Replica:
      type: object
      required: [blob_hash, peer_id, state, bytes_present, updated_at]
      description: |
        One peer's holding of one blob (§8) — what the CONTROLLER believes,
        cached from what the holding peer last reported about its own disk
        (M4-07).
      properties:
        blob_hash: { type: string }
        peer_id: { type: string }
        state: { type: string, enum: [present, pending, corrupt, missing] }
        bytes_present: { type: integer, format: int64 }
        verified_at:
          type: [string, "null"]
          format: date-time
          description: When these bytes were last re-hashed and matched their own name.
        reported_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the holding peer last confirmed this row in an inventory
            report — null if no peer ever has.

            Distinct from `verified_at`, and the difference is the point: a
            peer can afford to confirm it still holds a blob far more often
            than it can afford to read it, so the two decay at different rates.
            A row nobody has confirmed recently is a fact about the past
            whatever its `state` says, and garbage collection reads this before
            deleting what it believes is a surplus copy.
        updated_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, type, payload, state, priority, required_capability, run_after, attempts, max_attempts, created_at, updated_at]
      properties:
        id: { type: string }
        type: { type: string }
        payload: { type: object }
        state: { type: string, enum: [pending, leased, succeeded, failed, dead] }
        priority: { type: integer, description: Lower runs first. }
        dedupe_key: { type: [string, "null"] }
        required_capability: { type: string }
        run_after: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        lease_owner: { type: [string, "null"] }
        lease_expires_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    Token:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    IdentityUser:
      type: object
      description: |
        A pinned user identity (§40, ADR-0048): the trust root a device's
        enrolment cert is verified against. Carries no secret and no cert — the
        pin is the public key.
      required: [id, principal_id, public_key, name, enrolled_at]
      properties:
        id: { type: string }
        principal_id: { type: string }
        public_key:
          type: string
          description: The pinned key, `ed25519:<64 hex characters>`.
        name: { type: string }
        enrolled_at: { type: string, format: date-time }

    IdentityDevice:
      type: object
      description: |
        A device key a user has vouched for (§40, ADR-0048, ADR-0068). The
        admitting op token is deliberately absent: authentication evaluates
        the presented op against the identity's op log rather than trusting a
        stored copy. Its provenance is present: who admitted the device, and
        which op.
      required: [id, user_id, device_key, name, admitted_by, admitting_op, enrolled_at, expires_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        device_key:
          type: string
          description: The device's key, `ed25519:<64 hex characters>`.
        encryption_key:
          type: string
          description: |
            The device's X25519 encryption key, `x25519:<hex>`, when its
            admission bound one — the recipient a space key is wrapped for
            (ADR-0049), and what `heyarr device revoke` re-keys away from.
        name: { type: string }
        admitted_by:
          type: string
          description: |
            The signer of the device's admitting op: the identity's genesis key
            (`ed25519:<hex>`, equal to the user's key) for a cert-era or
            first-device admission, or the key of the member device that
            admitted it (ADR-0068). Empty only for a row whose op no longer parses.
        admitting_op:
          type: string
          description: The hash (`sha256:<hex>`) of the admitting op.
        enrolled_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: The admitting op's expiry, for listing and pruning.
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set once revoked — by the admin (`DELETE`), or by a member's remove
            op the evaluation honoured; the row is kept so a re-presented op is refused.

    SystemInfo:
      type: object
      properties:
        build:
          type: object
          properties:
            version: { type: string }
            commit: { type: string }
            date: { type: string }
        peer:
          type: object
          properties:
            name: { type: string }
            site: { type: string }
        schema_version: { type: integer }
        drift:
          $ref: "#/components/schemas/DriftReport"
        database:
          $ref: "#/components/schemas/StorageInfo"
        cas:
          $ref: "#/components/schemas/StorageInfo"
        events:
          $ref: "#/components/schemas/EventsInfo"
        media:
          type: array
          description: |
            The external media toolchain THIS node resolved (ADR-0023). FFmpeg
            is optional: a node without it still scans, ingests and serves byte
            ranges, but probe and remux jobs stay pending until a worker that
            has it claims them.

            In a split-process deployment this describes the node answering the
            request, not the fleet — the worker that would claim a probe job may
            be another machine. `/api/v1/jobs` showing pending probes is the
            other half of that picture.
          items: { $ref: "#/components/schemas/ToolInfo" }
        auth_enabled: { type: boolean }

    DriftStatus:
      type: string
      enum: [unknown, current, behind, ahead, mismatch]
      description: |
        The outcome of one comparison.

        `unknown` means the comparison could not be MADE — nothing to compare
        against, or a version string that is not a version. It is distinct from
        `current` on purpose, and nothing may treat the two as equivalent: "we
        could not tell" reported as "fine" is the failure this object exists to
        stop.

        `ahead` is not good news. For the schema it is the state in which an
        older binary writes plausible rows against constraints a newer schema
        depends on (§49); for the build it usually means the expectation is the
        stale half.

        `mismatch` means the two builds are known to differ with no ordering
        between them — the same version tag built from different source, or two
        commits with no semantic version on either side. Different, distance
        unknown; never `current`.

    BuildIdentity:
      type: object
      description: A build — what it calls itself, and what it was built from.
      properties:
        version: { type: string }
        commit: { type: string }

    BuildDrift:
      type: object
      description: |
        How far the running build is from the expected one.

        At most one of the three distance fields is non-zero: the most
        significant semantic version component that differs. A distance spread
        across three numbers is one nobody can threshold, so `v1.4.2` expected
        against `v1.0.9` running reports one minor version behind rather than
        claiming to be four minors and minus seven patches behind. All three are
        zero unless `status` is `behind`.
      properties:
        status: { $ref: "#/components/schemas/DriftStatus" }
        expected: { $ref: "#/components/schemas/BuildIdentity" }
        actual: { $ref: "#/components/schemas/BuildIdentity" }
        major_behind: { type: integer }
        minor_behind: { type: integer }
        patch_behind: { type: integer }
        detail:
          type: string
          description: |
            Why a status is what it is, in a few words — chiefly why an
            `unknown` could not compare. For a human; nothing should branch on
            it.

    SchemaDrift:
      type: object
      description: |
        How many migrations separate this binary from its database.

        A count rather than a flag, because seven unapplied migrations and one
        are not the same operational problem: one is routine and the other wants
        a backup taken before it runs. At most one of the two counts is
        non-zero.
      properties:
        status: { $ref: "#/components/schemas/DriftStatus" }
        expected:
          type: integer
          format: int64
          description: The highest migration the comparison expects to exist.
        applied:
          type: integer
          format: int64
          description: |
            The migration version actually applied to this database. Zero is
            legitimate — a database that has never been migrated — and is
            reported as behind by the full distance.
        migrations_behind: { type: integer, format: int64 }
        migrations_ahead: { type: integer, format: int64 }
        detail: { type: string }

    DriftReport:
      type: object
      description: |
        Both drift checks, side by side and never merged.

        They drift independently and they fail differently. A binary that is
        current with its migrations unapplied is not a mild case of being behind
        — it is a build running against a schema it was never tested on — and
        reducing both to one "up to date" flag would let a current binary hide
        an un-migrated database.
      properties:
        build: { $ref: "#/components/schemas/BuildDrift" }
        schema: { $ref: "#/components/schemas/SchemaDrift" }

    EventsInfo:
      type: object
      description: |
        Where the event log currently is, so a client can follow the stream
        from *now* rather than replaying from sequence zero.
      properties:
        head:
          type: integer
          format: int64
          description: |
            The most recent sequence number, and a resume point: pass it as
            `?after=` on `/api/v1/events` to receive everything from here. An
            empty log reports 0, which is already what "everything" means.
        ok:
          type: boolean
          description: |
            False when the head could not be read, in which case `head` is
            meaningless. It is reported rather than 500ing because 0 is a
            legitimate head, so a client cannot otherwise tell "nothing has
            happened" from "we could not find out".

    ToolInfo:
      type: object
      properties:
        name:
          type: string
          description: The binary described, `ffprobe` or `ffmpeg`.
        available: { type: boolean }
        path:
          type: string
          description: Where it was found. Absent when unavailable.
        version:
          type: string
          description: What it reported, e.g. `7.0.2`. Absent when unavailable.
        detail:
          type: string
          description: |
            Why an unavailable tool is unavailable, in a few words — "not found
            on PATH", "did not report a version". Absent when available.

    BlobProbe:
      type: object
      properties:
        blob_hash: { type: string }
        container:
          type: string
          description: |
            ffprobe's `format_name` verbatim — a comma-separated list of every
            name the demuxer answers to, e.g. `mov,mp4,m4a,3gp,3g2,mj2`. Kept
            whole rather than reduced to one name, because which of those a
            file "is" is a question with no answer, and the planner matches by
            membership.
        format_long: { type: string }
        duration_seconds: { type: number, nullable: true }
        bitrate_bps:
          type: integer
          format: int64
          nullable: true
          description: Null when the container declared none — a Matroska file legitimately has none.
        streams:
          type: array
          items: { $ref: "#/components/schemas/ProbeStream" }
        bytes_read:
          type: integer
          format: int64
          description: What crossed the wire to answer this. §29's evidence.
        materialised:
          type: boolean
          description: |
            True when Range probing did not work and the whole blob was copied
            (§29's fallback). Counted rather than silent: a fallback nobody can
            see becomes the default without anyone noticing.
        probed_at: { type: string, format: date-time }

    ProbeStream:
      type: object
      properties:
        index: { type: integer }
        type:
          type: string
          description: video, audio, subtitle or data.
        codec: { type: string }
        profile: { type: string }
        level: { type: integer }
        width: { type: integer }
        height: { type: integer }
        frame_rate: { type: string }
        channels: { type: integer }
        sample_rate: { type: integer }
        bitrate_bps: { type: integer, format: int64 }
        language: { type: string }

    Publication:
      type: object
      description: |
        An asset that is one of §69's four containers, with what its own
        manifest declared.
      properties:
        asset_id: { type: string }
        edition_id: { type: string }
        work_id: { type: string }
        title: { type: string }
        blob_hash: { type: string }
        filename: { type: string }
        size: { type: integer, format: int64 }
        format:
          type: string
          enum: [epub, pdf, cbz, cbr]
        page_count:
          type: integer
          description: |
            Page images in a comic archive. **Absent when unread**, which is not
            the same as zero: an empty comic is a zero-page comic, and a PDF is
            a publication whose length Heyarr has not counted. Reading a PDF's
            page tree needs a PDF parser, and §69 says Heyarr does not render.
        chapter_count:
          type: integer
          description: |
            Spine items in an EPUB — its reading order, which is the closest
            thing an EPUB has to a length and is deliberately not called a page
            count. Absent when unread.
        content_url:
          type: string
          description: |
            The ordinary blob endpoint. Named here so the single-endpoint
            contract is visible in the response rather than only in ADR-0013.

    StartPlayback:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
          description: |
            Optional. Derived from the probe when omitted — watching when there
            is video, listening when there is not. Derived from the probe
            rather than the extension because a `.mkv` holding only audio is a
            legitimate thing, and calling it "watching" puts it in the wrong
            row of every continue-watching list.

    StartedPlayback:
      type: object
      properties:
        session_id: { type: string }
        plan: { $ref: "#/components/schemas/PlaybackPlan" }
        content_url:
          type: string
          description: |
            The ordinary blob endpoint (ADR-0013), on the peer routing selected
            (§32) — **never the controller**, which stays out of the content
            data path. Absolute when the source is another peer, so the client
            connects to that peer directly; relative when the source is this
            node, which is the origin the client is already talking to
            (ADR-0029).

            Bounded by the credential below, which expires. It is deliberately
            NOT scoped to one blob: per-blob scoping is a grant (§77) and §54's
            lease shape is the real answer, arriving in M7 alongside degraded
            authorisation. Revisit when the first peer class arrives whose
            access is a strict subset of the canonical set (§6, §19) — the same
            trigger ADR-0030 records.
        token:
          type: string
          description: |
            A short-lived `read` credential for that URL. **Not scoped to one
            blob** — see the endpoint description.
        expires_at: { type: string, format: date-time }

    RemuxRequest:
      type: object
      required: [asset_id, device_id]
      properties:
        asset_id: { type: string }
        device_id: { type: string }

    PlanRequest:
      type: object
      required: [asset_id]
      properties:
        asset_id: { type: string }
        device_id:
          type: string
          description: |
            A registered device. Required unless `client` is given; when both
            are given the device's profile decides and `client` decides the leg.
        client:
          allOf: [{ $ref: "#/components/schemas/ClientCapabilities" }]
          description: |
            What the caller can decode (ADR-0069). Present, the answer carries
            the leg — `mode`, `url`, `mime`, `reason`, `source` — and
            `device_id` may be omitted.

    ClientCapabilities:
      type: object
      description: |
        A client's decoders, in ffprobe's codec vocabulary (`h264`, `hevc`,
        `av1`, `vp9`, `aac`, `ac3`, `eac3`, `opus`, `mp3`, `mp2`) and the
        ordinary container names (`mp4`, `mkv`, `webm`, `avi`). A client that
        declares nothing at all is handed the bytes.
      properties:
        containers:
          type: array
          items: { type: string }
        video:
          type: array
          items: { type: string }
        audio:
          type: array
          items: { type: string }
        max_height:
          type: integer
          minimum: 0
          description: The tallest picture the client will take. Zero or absent means no limit.
      example:
        containers: [mp4, mkv, webm]
        video: [h264, hevc, vp9, av1]
        audio: [aac, opus, mp3, eac3]
        max_height: 1080

    PlaybackSource:
      type: object
      description: What the probe found — the first video and audio stream.
      properties:
        container: { type: string, description: "ffprobe's format_name, verbatim." }
        video: { type: string }
        audio: { type: string }
        width: { type: integer }
        height: { type: integer }

    PlaybackPlan:
      type: object
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        decision:
          type: string
          enum: [direct, remux, transcode, unplayable]
        reasons:
          type: array
          description: |
            Why the decision is not DIRECT, or why nothing can be played. Empty
            for a clean DIRECT.
          items: { $ref: "#/components/schemas/PlanReason" }
        peer_id:
          type: string
          description: The replica chosen to serve from. Absent when unplayable.
        remote:
          type: boolean
          description: |
            The chosen replica is at another site. §31 prefers a local one, so
            an instance where this is usually true is one where replication is
            not working.

            **The unproven note this carried is retired (M4-11, M4-14).** It
            said nothing had ever run against a second peer; one exists now, and
            §32's source selection routes against it — the same client with and
            without a local replica is routed two different ways, and the
            cross-site answer records that it fell back.

            Read `routing` rather than this flag when you want to know why. This
            is the planner's own summary of the source it was handed; `routing`
            is the decision, with the peers it rejected and the reason for each.
        content_url:
          type: string
          description: |
            Where the bytes are, for a DIRECT plan — on the peer `routing`
            selected, not on the controller. **Absent otherwise** — a REMUX or
            TRANSCODE plan has no bytes to point at yet, and offering the
            original would invite the client to play exactly what the plan just
            said it cannot.
        routing:
          allOf: [{ $ref: "#/components/schemas/RoutingDecision" }]
          description: |
            Which peer this read was routed to, and why not the others (§32).
            Present on every plan **including a refusal** — especially on a
            refusal. "Unavailable" with nothing after it cannot tell a peer that
            is down from a peer that never had the bytes, and those have
            different fixes.
        mode:
          type: string
          enum: [direct, stream, unplayable]
          description: |
            The leg, present only when the request carried `client`
            (ADR-0069). `direct` — fetch `url`, the ordinary blob endpoint.
            `stream` — fetch `url`, the on-the-fly repackage. `unplayable` —
            nothing holds the bytes.
        url:
          type: string
          description: |
            What to fetch for `mode`: `/api/v1/blobs/{hash}/content` for
            direct, `/api/v1/playback/stream/{token}` for stream. Relative,
            like `content_url`; for a direct plan on another peer it is
            absolute on that peer.
        mime:
          type: string
          description: "`video/mp4` for a stream; the asset's declared type for direct."
        reason:
          type: string
          description: |
            One sentence saying why the mode is not a clean direct — e.g.
            `audio ac3 not decodable by client`, `container avi not playable
            by client; audio mp2 not decodable by client`, `video 2160p
            exceeds client max_height 1080 (transcoding video)`. Empty for a
            clean direct. The same facts are in `reasons` as stable codes.
        source:
          allOf: [{ $ref: "#/components/schemas/PlaybackSource" }]
          description: What the probe found, when anything has probed the bytes.

    RoutingDecision:
      type: object
      description: |
        The controller's source selection (§31, §32).

        §32 lists six inputs. Three are implemented — site locality,
        availability, health — and three are not: latency and bandwidth need
        measurement infrastructure that does not exist, and transcode
        capability is #112's unbuilt fleet advertisement. So this is an
        **ordered preference that reports its reasons**, not a score with three
        terms stubbed: same-site first, then this node, with latency appending
        an element when it arrives rather than forcing every coefficient to be
        re-decided at once.
      properties:
        peer_id:
          type: string
          description: The selected source. **Absent when routing refused.**
        reason:
          allOf: [{ $ref: "#/components/schemas/RoutingReason" }]
          description: Why that peer won. Absent when routing refused.
        rejected:
          type: array
          description: |
            Every peer considered and not selected, each with **every** reason
            it was not. A peer that is both unreachable and holds a corrupt
            replica has two problems, and naming one of them produces a second
            question after the first fix does not help.
          items: { $ref: "#/components/schemas/RoutingRejection" }

    RoutingRejection:
      type: object
      properties:
        peer_id: { type: string }
        name: { type: string }
        site: { type: string }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/RoutingReason" }

    RoutingReason:
      type: object
      properties:
        code:
          type: string
          enum:
            [site_local, cross_site_fallback,
             no_replica, replica_not_usable, peer_unhealthy,
             peer_has_no_endpoint, site_local_preferred, another_source_chosen]
          description: |
            Stable. An operator's runbook and a client's branch both key on it.

            `site_local` and `cross_site_fallback` are selections; the rest are
            rejections. `site_local_preferred` and `another_source_chosen` are
            rejections **with no fault in them** — the peer was eligible and
            lost the ordered preference, which is how an operator sees that the
            fallback existed before it was needed.
        detail:
          type: string
          description: Prose for a human. May change.

    PlanReason:
      type: object
      properties:
        code:
          type: string
          enum:
            [no_replica, container_unsupported, video_codec_unsupported,
             audio_codec_unsupported, resolution_too_high, bitrate_too_high,
             hdr_unsupported, no_probe, remote_replica_only,
             device_declares_nothing]
          description: Stable. Clients branch on this, and a client branching on prose breaks when the prose improves.
        detail:
          type: string
          description: Prose for a human. May change.

    ConsumptionSession:
      type: object
      description: |
        One consumption of one asset by one device — watching, listening or
        reading (§67, ADR-0024).
      properties:
        id: { type: string }
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]
        state:
          type: string
          enum: [created, playing, paused, stopped, completed]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: |
            **Absent** until something has been recorded — not a zero locator.
            Position zero is a real position, and a client cannot tell "at the
            very beginning" from "never played" if both render as 0.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the session first played. Null for one created and abandoned,
            which is what makes "nobody watched this" distinguishable from
            "someone watched two minutes".
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: When it reached a terminal state.

    SessionProgress:
      type: object
      description: |
        Where a session reached, as a **locator and a unit** — never a bare
        number. A page number is not a number of seconds, and storing both as
        "position" makes every reader guess which it has.
      properties:
        locator:
          type: string
          description: |
            A decimal offset for `seconds`, a decimal page number for `page`,
            or an `epubcfi(...)` expression for `cfi`. A CFI is opaque to
            Heyarr, which stores and serves publications and never renders
            them (§69).
        unit:
          type: string
          enum: [seconds, page, cfi]

    CreateConsumptionSession:
      type: object
      required: [asset_id, device_id, verb]
      properties:
        asset_id: { type: string }
        device_id: { type: string }
        verb:
          type: string
          enum: [watch, listen, read]

    SessionTransition:
      type: object
      required: [transition]
      properties:
        transition:
          type: string
          enum: [start, pause, resume, progress, stop, complete]
        progress:
          allOf:
            - $ref: "#/components/schemas/SessionProgress"
          description: Recorded with the transition. Usually sent with `progress`.

    Candidates:
      type: object
      required: [desired_item_id, candidates]
      properties:
        desired_item_id: { type: string }
        search_id:
          type: string
          description: |
            Groups these as the one search's answers they are. A different id
            from a previous read means a search has happened in between and
            this is a different set, not an update of the same one.
        selected:
          type: string
          description: |
            The provider's id for the chosen release. **Absent when nothing was
            acceptable** — and note that is not simply the first of
            `candidates`, which when everything was rejected is merely the
            least bad.
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }

    Candidate:
      type: object
      required: [candidate_id, provider, accepted, score, terminal, selected, reasons]
      properties:
        candidate_id:
          type: string
          description: |
            The **provider's** identity for the release, and what you name in a
            `select`. The storage row's own id is deliberately not on the wire:
            it identifies a row a re-search replaces, and a client holding one
            would be holding a handle to something that vanishes.
        provider: { type: string }
        title: { type: string }
        accepted:
          type: boolean
          description: Every gate held. A candidate that is not accepted is never acquired.
        score:
          type: integer
          description: |
            The sum of the preferences that landed. Meaningful only among
            accepted candidates: a rejected one's score is a number about
            something that will not be used.
        terminal:
          type: boolean
          description: Meets every terminal condition, so the upgrade workflow would stop here (§62).
        selected: { type: boolean }
        overridden:
          type: boolean
          description: A person chose this against the ranking (§60's manual override).
        override_detail:
          type: string
          description: What the scorer had chosen instead, and what each scored.
        reasons:
          type: array
          description: |
            Every rule that was considered, not only the ones that failed — a
            rule that ran silently is a rule nobody can confirm ran.
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          description: The gates that rejected this candidate. Absent when accepted.
          items: { $ref: "#/components/schemas/EvaluationReason" }

    Satisfaction:
      type: object
      required: [desired_item_id, state, content, placement]
      properties:
        desired_item_id: { type: string }
        state:
          type: string
          description: §64's derived name, so this response stands alone.
        content: { $ref: "#/components/schemas/ContentSatisfaction" }
        placement: { $ref: "#/components/schemas/PlacementSatisfaction" }
        upgrade: { $ref: "#/components/schemas/UpgradeEligibility" }

    UpgradeEligibility:
      type: object
      description: |
        Whether this want could be **improved** (§60) — a different question
        from either satisfaction axis. A want can be fully satisfied and still
        improvable, and that gap is the whole upgrade workflow:

        | state | meaning |
        |---|---|
        | not accepted | `MISSING`, keep searching — an *acquisition*, not an upgrade |
        | accepted, not terminal | satisfied **and** still improvable |
        | terminal | done; there is nothing left to want |
      required: [eligible, status, detail]
      properties:
        eligible:
          type: boolean
          description: Nothing about this want's state rules an upgrade out.
        status:
          type: string
          enum:
            [
              available,
              not_monitored,
              not_satisfied,
              terminal,
              no_better_candidate,
            ]
          description: |
            **Why** — an enumerated reason rather than a bare boolean, because
            "no upgrade" has four completely different meanings and an operator
            asking "why is this not upgrading" needs to know which.

            `not_monitored` outranks `terminal`: a want that is both reports
            the operator's decision, because "you told me to stop" is the more
            useful answer than "it happens to be perfect".

            `no_better_candidate` is the **normal** answer for a healthy
            library — eligible, with nothing better found. It is what an
            eligible want reports when nothing is on offer.
        detail:
          type: string

    ContentSatisfaction:
      type: object
      required: [satisfaction, assets]
      properties:
        satisfaction:
          type: string
          enum: [unknown, not_satisfied, satisfied]
        satisfied_by:
          type: string
          description: |
            The asset that satisfies — the **best** one, by the same ranking
            the search uses, so "what am I watching" and "what would I have
            acquired" cannot disagree.
        assets:
          type: array
          description: |
            Every asset considered, with its full §63 reasons. An asset that
            exists and was rejected appears here **with the rule that rejected
            it**, which is the whole point of this endpoint.
          items: { $ref: "#/components/schemas/AssetSatisfaction" }

    AssetSatisfaction:
      type: object
      required: [asset_id, accepted, score, terminal, reasons]
      properties:
        asset_id: { type: string }
        accepted: { type: boolean }
        score: { type: integer }
        terminal: { type: boolean }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          items: { $ref: "#/components/schemas/EvaluationReason" }

    PlacementSatisfaction:
      type: object
      required: [satisfaction, detail, unproven]
      properties:
        satisfaction:
          type: string
          enum: [unknown, not_satisfied, converging, satisfied, not_applicable]
          description: |
            `not_applicable` is for ADR-0020's `linked` assets, which have no
            blob and therefore nothing to replicate. Calling that `satisfied`
            would be vacuously true and a lie by construction.
        missing:
          type: array
          items: { type: string }
          description: |
            The peers that should hold the bytes and do not. `converging` with
            no list of what is missing is a status nobody can act on.
        detail: { type: string }
        unproven:
          type: boolean
          description: |
            **Whether this answer is true by construction rather than by
            replication having worked.** Computed per response from the Full
            Peer target set: `true` when that set is this node alone, `false`
            when it names two or more peers.

            On a single-peer deployment placement is satisfied the moment
            content is, because there is nowhere for bytes to converge to, and
            `converging` is unreachable — so a client must not read `satisfied`
            there as evidence that replication works. On a two-peer deployment
            the axis is answering a real question and this is `false`.

            It was hard-coded `true` while one peer was the only deployment
            that existed. It did not become `false` when the second peer
            arrived: a Heyarr on one machine is a supported configuration
            forever, and a constant `false` would be a lie on every one of
            them.

            It is a response field rather than only a note in this document
            because a caveat the reader of the response never sees is a caveat
            that does not work.

    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          description: |
            Absent makes this a notification, which is answered with `202` and
            no body rather than a result.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum: [initialize, tools/list, tools/call, ping]
        params:
          type: object
          description: |
            For `tools/call`: `{ "name": "...", "arguments": { ... } }`. The
            argument shape for each tool is its `inputSchema` from `tools/list`,
            and unknown fields are refused rather than ignored — an agent that
            misspelled one finds out instead of getting a cheerful empty result.

    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          description: |
            For `tools/call`, MCP's content envelope: a `content` array with a
            text block every client can render, plus `structuredContent`
            carrying the same value as JSON. Both, so an agent gets prose it can
            quote **and** a shape it can branch on rather than having to parse
            the prose.
        error: { $ref: "#/components/schemas/JSONRPCError" }

    JSONRPCError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            JSON-RPC 2.0 codes, plus one. `-32700` parse error, `-32600` invalid
            request, `-32601` method or tool not found, `-32602` invalid params,
            `-32603` internal error, and **`-32001` forbidden** — outside the
            reserved range because a refused scope is not a malformed request,
            and an agent that cannot tell "you may not do this" from "you asked
            wrongly" will retry the wrong one forever.
        message: { type: string }
        data:
          type: object
          description: |
            The actionable half. A refused scope names the tool and the scope it
            needs; a deferred §71 verb names the milestone that brings it.

    EvaluateRequest:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReleaseCandidate" }

    ReleaseCandidate:
      type: object
      description: One release a provider offered.
      required: [id]
      properties:
        id:
          type: string
          description: |
            Stable for a given release from a given provider, and the ranking's
            tie-break — so it must not be a position in a response. Two
            candidates sharing an id is a `400`, because it would make the
            ranking depend on the order they were sent in.
        title:
          type: string
          description: |
            What the indexer called it. **Never parsed** — attributes are
            extracted by the provider, and re-deriving them from the title at
            scoring time would be a second, invisible extraction.
        provider: { type: string }
        attributes:
          type: object
          description: |
            What could be determined about the release, keyed by attribute
            name. A key that is **absent** (or explicitly `null`) means "could
            not be determined", which is different from a zero value and is
            reported as `undetermined` rather than as a failure.

            A provider that cannot tell must leave the attribute out. HDR
            detection in Milestone 2 is a substring match on the ffprobe
            profile and is a recorded weakness; a release *title* is worse
            evidence, not better.
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
              - type: boolean
              - type: "null"

    Evaluation:
      type: object
      required: [quality_profile_id, ranked]
      properties:
        quality_profile_id: { type: string }
        ranked:
          type: array
          description: Every candidate, best first.
          items: { $ref: "#/components/schemas/RankedCandidate" }
        selected:
          type: string
          description: |
            The candidate that would be acquired. **Absent when none was
            acceptable** — and note this is not simply the first of `ranked`,
            which when everything was rejected is merely the least bad.

    RankedCandidate:
      type: object
      required: [id, accepted, score, terminal, reasons]
      properties:
        id: { type: string }
        title: { type: string }
        provider: { type: string }
        accepted:
          type: boolean
          description: |
            Whether every gate held. A candidate that is not accepted is never
            acquired, whatever it scored.
        score:
          type: integer
          description: |
            The sum of the preferences that landed. Meaningful only among
            accepted candidates: a rejected one's score is not a near miss, it
            is a number about something that will not be used.
        terminal:
          type: boolean
          description: |
            This candidate meets **every** terminal condition, so the upgrade
            workflow has nothing left to want (§62).

            A profile with no terminal rules is **never** terminal — vacuous
            truth over an empty set would turn "never stop looking" into "stop
            immediately". A rejected candidate is never terminal either.
        reasons:
          type: array
          description: Every rule that was considered, in the profile's own order.
          items: { $ref: "#/components/schemas/EvaluationReason" }
        rejected_by:
          type: array
          description: The gates that rejected this candidate. Absent when accepted.
          items: { $ref: "#/components/schemas/EvaluationReason" }

    EvaluationReason:
      type: object
      required: [rule, section, result, detail]
      properties:
        rule:
          type: string
          description: |
            The rule's machine-readable identity, `<attribute>.<op>`. Clients
            branch on this; a client branching on prose is one that breaks when
            the prose improves.
        section:
          type: string
          enum: [accept, prefer, terminal]
        result:
          type: string
          enum: [pass, fail, bonus, penalty, miss, undetermined]
        score:
          type: integer
          description: The contribution, present only for preferences that landed.
        detail:
          type: string
          description: The prose half, for a human.

    DesiredItem:
      type: object
      description: |
        "This content should exist under these conditions" (§55) — the row that
        makes Heyarr more than a catalogue.

        It anchors to a **Work**, the semantic entity (§11), which exists
        whether or not any bytes do. Never to an Asset: an Asset is a file that
        exists by definition, and wanting a file you already have is not a
        coherent thing to say.
      required: [id, scope, work_id, quality_profile_id, monitor]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [work, edition]
          description: |
            How much of the work is wanted — the whole thing, or one edition of
            it (a season, a particular release, a language).

            **There is no `episode` scope, and that is a limitation rather than
            an omission.** §11 makes the *series* the Work and an edition the
            season, so an episode is an Asset — a file that exists — and there
            is no entity anywhere for an episode nobody has yet. Knowing which
            episodes *should* exist is what a metadata provider is for, and
            that is deferred out of Milestone 3.

            What this costs today, stated rather than papered over: with no
            metadata provider, content satisfaction for a series-scoped want is
            "an acceptable asset exists", **not** "every episode exists". A
            want for a series is not a completeness guarantee in this
            milestone.
        work_id:
          type: string
          description: Always set, even at edition scope.
        edition_id:
          type: string
          description: Present only at edition scope — absent, not null, at work scope.
        quality_profile_id: { type: string }
        monitor:
          type: boolean
          description: |
            "Keep looking for something better", which is **not** the same as
            wanting (§60 keeps both words). An unmonitored want that is
            satisfied is finished, terminal profile or not: the operator said
            "get me this", not "keep improving this". Running the upgrade
            workflow over unmonitored items is how *arr installations
            re-download libraries nobody asked them to touch.
        reason:
          type: string
          description: |
            Free text, never interpreted. It exists because a library
            accumulates wants and six months later nobody remembers why one is
            there.
        acquisition:
          $ref: "#/components/schemas/AcquisitionState"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcquisitionState:
      type: object
      description: |
        Where a want has got to (§64).

        §64 draws twelve boxes in a single column — `MISSING`, `SEARCHING`,
        `CANDIDATES_FOUND`, `SELECTED`, `QUEUED`, `DOWNLOADING`, `VERIFYING`,
        `INGESTING`, `AVAILABLE`, `CONTENT_SATISFIED`, `PLACEMENT_CONVERGING`,
        `FULLY_SATISFIED` — but they are **not twelve steps along one road**.
        They are a presentation of four independent facts, and this object
        carries all four alongside the name.

        Showing only `state` would reintroduce at the edge exactly the collapse
        the storage model exists to prevent: a client that can see
        `CONTENT_SATISFIED` but not which of §56's two questions was answered
        cannot tell "we have it" from "we have it everywhere".
      required: [state, phase, managed, content, placement]
      properties:
        state:
          type: string
          enum:
            [
              MISSING,
              SEARCHING,
              CANDIDATES_FOUND,
              SELECTED,
              QUEUED,
              DOWNLOADING,
              VERIFYING,
              INGESTING,
              AVAILABLE,
              CONTENT_SATISFIED,
              PLACEMENT_CONVERGING,
              FULLY_SATISFIED,
            ]
          description: §64's name, **derived** from the fields below and never stored.
        phase:
          type: string
          enum:
            [idle, searching, candidates_found, selected, queued, downloading, verifying, ingesting]
          description: |
            Where the acquisition pipeline is.

            There is deliberately **no `missing` or `available` phase**. Both of
            §64's names mean "nothing in flight" and differ only in whether
            Heyarr holds bytes — so with them as phases, a fruitless upgrade
            search returns to `MISSING` and reports a perfectly good library as
            empty.
        managed:
          type: boolean
          description: |
            Whether Heyarr holds bytes for this want. Independent of `phase`,
            because a want can be acquiring an **upgrade** while already
            holding a good copy.
        content:
          type: string
          enum: [unknown, not_satisfied, satisfied]
          description: |
            "Do we hold bytes the quality profile accepts?" (§56)

            `unknown` is distinct from `not_satisfied`: "nobody has looked" and
            "we looked and the answer is no" lead to different actions, and
            collapsing them makes a fresh want indistinguishable from one just
            found wanting.

            There is no `converging` here — no partial file half-satisfies a
            profile.
        placement:
          type: string
          enum: [unknown, not_satisfied, converging, satisfied, not_applicable]
          description: |
            "Are those bytes on every Full Peer that should hold them?" (§56)

            `not_applicable` is for ADR-0020's `linked` assets, which have no
            blob and therefore nothing to replicate. Calling that `satisfied`
            would be vacuously true and a lie by construction: `FULLY_SATISFIED`
            would then mean "one copy, on one disk, with no integrity
            guarantee".

            `converging` is reachable and observed as of Milestone 4: a
            two-peer deployment moving real bytes reports it mid-transfer and
            `satisfied` once the transfer lands.

            On a deployment whose Full Peer target set is this node alone it is
            still `satisfied` the moment content is — there is nowhere for bytes
            to converge to. `GET /api/v1/desired/{id}/satisfaction` reports that
            case as `placement.unproven: true`; this listing does not, so read
            the satisfaction endpoint before treating `satisfied` here as
            evidence that replication works.
        detail:
          type: string
          description: Why the last pipeline move happened, when it was a failure.

    CreateDesired:
      type: object
      description: |
        Name the work by `work_id` **or** `work`, and the profile by
        `quality_profile_id` **or** `quality_profile`. Supplying both of a pair
        is a `400` rather than a silent precedence rule.
      properties:
        scope:
          type: string
          enum: [work, edition]
          default: work
        work_id: { type: string }
        edition_id:
          type: string
          description: Required at edition scope, refused at work scope.
        work:
          $ref: "#/components/schemas/WorkDescriptor"
        quality_profile_id: { type: string }
        quality_profile:
          type: string
          description: The profile's name, for when a person is typing this.
        monitor:
          type: boolean
          default: true
        reason: { type: string }

    WorkDescriptor:
      type: object
      description: |
        Content named semantically, whether or not it exists. Resolved through
        the same `(content_type, work_key)` get-or-create the scanner uses, so
        wanting something and later scanning it converge on one Work.
      required: [content_type, title]
      properties:
        content_type:
          type: string
          description: "`movie`, `series`, `music`, `book`, … (§12)."
        title: { type: string }
        year:
          type: integer
          description: |
            Optional, and part of the identity when present. A year in the
            title (`"Blade Runner (1982)"`) is understood too; an explicit year
            wins, because the caller said so.

    UpdateDesired:
      type: object
      description: An omitted field is left alone. The target cannot be changed.
      properties:
        quality_profile_id: { type: string }
        quality_profile: { type: string }
        monitor: { type: boolean }
        reason: { type: string }

    FollowSourceRequest:
      type: object
      description: |
        The intent behind `POST /followed-sources`. Source-agnostic (#396): give
        a feed identity (a `url` or a `tvdb_id`) and a series identity (a
        `work_id`, or a `title`); the type is inferred. Exactly one of `work_id`
        and `title`. A quality profile is required — every projected episode is
        measured against it.
      required: [quality_profile]
      properties:
        url:
          type: string
          description: A feed identity to infer the source from — a TVDB series URL in Phase 1.
        tvdb_id:
          type: string
          description: A numeric TVDB series id, as an alternative to url.
        work_id:
          type: string
          description: An existing series work. Give this or title, never both.
        title:
          type: string
          description: |
            The series title, for a series not yet catalogued. Get-or-creates the
            series work the same way `want_content` does.
        year: { type: integer }
        quality_profile_id: { type: string }
        quality_profile:
          type: string
          description: The profile by name, as a person would say it. Give this or quality_profile_id.
        monitor:
          type: boolean
          description: Keep looking for a better copy of each episode. Defaults to true.
        backfill:
          type: string
          enum: [from_now, full]
          description: |
            How much back-catalogue to pull on the first poll. `from_now` (the
            default) archives only episodes airing after you follow; `full` walks
            the whole back-catalogue into wants.
        reason:
          type: string
          description: A free-text note, never interpreted.
        retention:
          type: string
          description: Reserved. Phase 1 keeps everything; a non-empty value is refused.

    FollowedSource:
      type: object
      description: |
        A followed source as the API presents it — the subscription plus the
        derived counts and health a caller reads to answer "is this working".
      required:
        [id, work_id, type, feed_ref, quality_profile_id, monitor, backfill,
         items_known, items_archived, health, created_at]
      properties:
        id: { type: string }
        work_id: { type: string }
        type:
          type: string
          description: The inferred source type. Reported, never a request field.
          enum: [tv_series, podcast, youtube_channel, rss_feed]
        feed_ref:
          type: string
          description: The source-stable handle the feed adapter polls — a TVDB series id.
        quality_profile_id: { type: string }
        monitor: { type: boolean }
        backfill: { type: string, enum: [from_now, full] }
        reason: { type: string }
        items_known:
          type: integer
          description: How many items the feed has yielded.
        items_archived:
          type: integer
          description: How many of those are held at the profile.
        health:
          type: string
          enum: [healthy, unhealthy, unknown]
          description: |
            The state of the feed adapter this source is polled through. `unknown`
            means none is configured, or none has been checked yet.
        created_at: { type: string, format: date-time }
        last_polled_at: { type: string, format: date-time }
        next_poll_at: { type: string, format: date-time }

    WorkSummary:
      type: object
      description: One work a content-intent search returned.
      required: [work_id, content_type, title]
      properties:
        work_id: { type: string }
        content_type: { type: string }
        title: { type: string }
        year: { type: integer }
        tvdb_id:
          type: string
          description: |
            The work's stored TVDB external id (ADR-0050), when it has one — the
            feed identity `follow_source` takes as `tvdb_id`, so a client can
            follow a search result in ONE step rather than by a title that might
            create a second work (decision 2, M12). Omitted for a work with no
            stored tvdb id; the client then asks the operator for one. This
            surfaces an id already in the library — not a live TVDB discovery
            search for series the library does not yet hold.

    SessionView:
      type: object
      description: A caller's own identity and effective authority (ADR-0061).
      required: [kind, scopes, can_write, management_authorized]
      properties:
        kind:
          type: string
          enum: [session, device, service, anonymous]
          description: |
            How the caller authenticated: `session` (web-login/QR, ADR-0053),
            `device` (device cert, ADR-0048), `service` (a bearer token), or
            `anonymous` (authentication disabled on a loopback listener).
        principal_id:
          type: string
          description: The identity the caller acts as ("ed25519:<hex>" for a user); empty for the anonymous identity.
        device_key:
          type: string
          description: The approving/authenticated device key for a session or device caller — the value an operator names to grant management. Absent otherwise.
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
          description: The effective authority this credential carries.
        can_write:
          type: boolean
          description: Whether `scopes` admits write — i.e. whether follow/unfollow will succeed for this caller as it stands.
        management_authorized:
          type: boolean
          description: |
            True when this is a session whose approving device holds a
            follow-management grant (ADR-0061) — the reason a session can write.
            False for a read-only session and for a service token (whose write
            authority, when it has it, is its own scope, not a grant).

    ManagementGrant:
      type: object
      description: One device authorised to manage followed sources from a web-login session (ADR-0061).
      required: [device_key, reason, granted_at]
      properties:
        device_key:
          type: string
          description: The authorised approving device key ("ed25519:<hex>").
        reason:
          type: string
          description: A free-text operator note; may be empty.
        granted_at:
          type: string
          format: date-time

    ManagementGrantRequest:
      type: object
      description: The operator's consent that a device may manage followed sources (ADR-0061).
      required: [device_key]
      properties:
        device_key:
          type: string
          description: The approving device key to authorise, as GET /session reports it for that device ("ed25519:<hex>").
        reason:
          type: string
          description: A free-text operator note ("the operator's phone"). Optional.

    Providers:
      type: object
      required: [providers, capabilities]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }
        capabilities:
          type: array
          items: { type: string, enum: [indexer, download, metadata] }
          description: |
            What this node can therefore do, as a set — and therefore which
            jobs it can claim.

            Stated rather than left for a client to derive, because deriving it
            means knowing that a **disabled** provider contributes nothing, and
            a dashboard that got that wrong would report "indexing available"
            for a provider somebody switched off.

            Empty is a legitimate answer, not an error: it is exactly what
            ADR-0025 describes.

    Capabilities:
      type: object
      required: [holders, available]
      properties:
        capability:
          type: string
          description: |
            Echoes the `?capability=` filter, so a client holding a response
            knows which question it answers.
        holders:
          type: array
          items: { $ref: "#/components/schemas/CapabilityHolder" }
          description: |
            Every **live** advertisement, one entry per worker. An expired one
            is absent rather than present-and-stale: showing it with a "last
            seen" column would invite an operator to route work to a machine
            that is switched off.

            Empty is a legitimate answer. A fleet where nothing has advertised
            yet, and a fleet whose workers can do nothing anybody routes on, are
            both supported configurations (ADR-0023).
        available:
          type: array
          items: { type: string }
          description: |
            The union across the fleet: every capability at least one live
            worker holds, sorted.

            Stated rather than left for a client to derive, because deriving it
            means knowing that an expired holder contributes nothing — and a
            dashboard that got that wrong would offer a transcode nothing can
            run.

    CapabilityHolder:
      type: object
      required: [worker_id, capabilities, expires_at]
      properties:
        worker_id:
          type: string
          description: |
            The advertising worker. It is the same string that appears as a
            job's lease owner, so a stuck job and a fleet entry name the same
            thing. Unique per process: a restarted worker advertises under a new
            id and its predecessor's advertisement expires.
        peer_id:
          type: string
          description: The node this worker runs on, which is the unit the question is asked about.
        peer_name:
          type: string
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/HeldCapability" }
        expires_at:
          type: string
          format: date-time
          description: |
            When this advertisement stops being honoured unless the worker
            renews it. Present so an operator can tell a worker that is about to
            fall out of the fleet from one that has just arrived.

    HeldCapability:
      type: object
      required: [name, source, proved_at]
      properties:
        name:
          type: string
          description: |
            The exact string a job's `required_capability` is matched against.
            Dotted and hierarchical — `ffmpeg`, `ffmpeg.encoder.hevc`,
            `ffmpeg.encoder.av1.vaapi` — and matched by equality, never by
            prefix.
        source:
          type: string
          enum: [binary, probe, service]
          description: |
            How this was established, which is what says whether it is
            re-verified.

            | source | means | re-verified |
            |---|---|---|
            | `binary` | a tool resolved at startup (ADR-0023) | no — installing ffmpeg under a running Heyarr is not a supported flow |
            | `probe` | the capability was **exercised**: a real encode of a handful of frames to a null sink | yes, on a beat, and the advertisement narrows when it stops passing |
            | `service` | an external network service is configured (ADR-0025) | no; its reachability is `/api/v1/providers`' answer |
        detail:
          type: string
          description: A few words for an operator — which encoder proved it.
        proved_at:
          type: string
          format: date-time
          description: |
            When the proof was taken, **not** when the row was written. The
            difference matters: a re-advertisement that reused a cached proof
            would otherwise look freshly verified.

    ProviderStatus:
      type: object
      required: [name, capabilities, healthy, detail]
      properties:
        name:
          type: string
          description: |
            The operator's name for this provider, unique within an instance.
            It is what appears in routing, in health, and in a release
            candidate's `provider` field — so it is the operator's word rather
            than a generated identifier.
        capabilities:
          type: array
          items: { type: string, enum: [indexer, download, metadata] }
          description: |
            What this provider can do for us.

            **Empty when the provider is disabled in configuration.** That is
            how "configured and switched off" is distinguished from "not
            configured at all": the first appears here with nothing it can do,
            the second does not appear.

            `metadata` is declared and nothing implements it in this milestone
            — §84's list does not include metadata providers. It exists so that
            the first one is a change to configuration rather than a change to
            the registry.
        healthy:
          type: boolean
          description: Whether the last check found the provider usable.
        detail:
          type: string
          description: |
            What was observed, in a few words. A status with no reason is one
            nobody can act on, so this is always present.
        version:
          type: string
          description: |
            The API version the service reported.

            This is what replaces version **pinning** for a service Heyarr does
            not install (ADR-0026): not controlling the version does not mean
            ignoring it. A version outside the supported range is reported
            unhealthy naming both numbers, and is **never** a startup failure.
        checked_at:
          type: string
          format: date-time
          description: |
            When the last check ran. **Absent means never checked**, which is
            distinct from `healthy: false`.

    QualityProfile:
      type: object
      description: |
        A quality profile (§62). It says three different **kinds** of thing,
        not three degrees of one:

        | section | meaning |
        |---|---|
        | `accept` | a **gate**. Fail one and the candidate is rejected outright, whatever else it offers. |
        | `prefer` | a **score**. Never a gate — a candidate meeting no preference at all is still acceptable, merely worse. |
        | `terminal` | a **stop condition**. The point at which the upgrade workflow has nothing left to want. |

        Collapsing any two produces the *arr behaviour §61 rejects: a
        preference that silently rejects, or an upgrade loop with no ceiling
        that never terminates because "better" is unbounded.

        An **empty `terminal` and an absent one are the same thing** — "there
        is no condition under which this profile is finished", which is legal
        and means *never stop looking*. The seeded `archival` profile is
        exactly that.
      required: [id, name, accept, prefer, terminal]
      properties:
        id: { type: string }
        name:
          type: string
          description: Unique. This is what a DesiredItem names (§55).
        description: { type: string }
        accept:
          type: array
          description: Gates. Every one must pass.
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          description: Scored. None is required; each contributes its weight.
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          description: |
            Stop conditions. **All** must hold for a candidate to be terminal.
            Empty means this profile is never finished.
          items: { $ref: "#/components/schemas/QualityRule" }
        seeded:
          type: boolean
          description: |
            Came from Heyarr's defaults rather than from an operator. Seeding
            converges on the name and never overwrites, so an edited default
            stays edited — this is how you can tell you are looking at one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WriteQualityProfile:
      type: object
      description: |
        On `POST`, an omitted section is empty. On `PUT`, an omitted section is
        **left alone** and a section sent as `[]` is **cleared**.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        accept:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        prefer:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }
        terminal:
          type: array
          items: { $ref: "#/components/schemas/QualityRule" }

    QualityRule:
      type: object
      description: |
        One assertion about a release: an attribute, a comparison and an
        operand. The same shape serves all three sections — what differs is
        what a failure *means*, and that belongs to the section rather than to
        the rule. One rule type is what lets §63 report all three the same way.

        The attribute vocabulary is **closed**, so a rule can be validated when
        it is written rather than when it is evaluated. Adding an attribute is
        a code change, which is correct: something has to know how to extract
        it from a release, and an attribute nothing populates is a rule that
        silently never matches.
      required: [attribute, op, value]
      properties:
        attribute:
          type: string
          enum:
            [
              audio_channels,
              audio_codec,
              hdr,
              language,
              resolution,
              size_bytes,
              source,
              video_codec,
            ]
          description: |
            `resolution` is vertical lines (480, 720, 1080, 2160) rather than a
            label, because "4K", "2160p" and "UHD" are three spellings of one
            number.

            `source` is **not ordered**, even though there is an obvious
            quality ordering among `remux`, `bluray`, `web-dl` and the rest. An
            ordering here would be a second scoring system living outside
            `prefer`, invisible to §63's reasons — the opaque scoring §61
            rejects. Say "bluray beats webrip" with two preferences instead,
            and it appears in the explanation.
        op:
          type: string
          enum: [eq, neq, gte, lte, in, nin]
          description: |
            `gte` and `lte` are numbers only; `in` and `nin` are names only. A
            comparison that does not apply to the attribute's type is a `400`,
            as is a list operand with `eq` — which would otherwise validate and
            then silently match nothing.
        value:
          description: |
            A bare JSON value whose shape follows the attribute: a whole number,
            a name, a list of names (for `in`/`nin`), or a boolean. The kind is
            read from the JSON and then checked against the attribute, never
            coerced — so `"1080"` against `resolution` is a caught typo rather
            than a working rule.
          oneOf:
            - type: integer
            - type: string
            - type: boolean
            - type: array
              items: { type: string }
        weight:
          type: integer
          description: |
            The score contribution, meaningful **only** in `prefer`. May be
            negative — a penalty is a real thing to want. May not be zero: a
            preference that cannot affect the score is indistinguishable from
            an absent one, and keeping it means an operator believes something
            is being preferred when nothing is.

            A weight on an `accept` or `terminal` rule is a `400`, not an
            ignored field. It is the mistake this design most invites, and
            silently dropping it would leave an operator believing a gate is
            scoring.

    Device:
      type: object
      description: A registered device and the capabilities it declares (§68).
      properties:
        id: { type: string }
        device_key:
          type: string
          description: |
            The client's own stable identifier, and the idempotency key for
            registration. Not a credential and never checked as one.
        name: { type: string }
        platform:
          type: string
          description: Free text — `tvos`, `android`, `web`.
        profile: { $ref: "#/components/schemas/DeviceProfile" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: |
            When this device last registered. The only thing that makes a stale
            row identifiable later.

    DeviceProfile:
      type: object
      description: |
        What a device says it can play. A zero maximum means **no limit
        stated**, which is deliberately different from a limit of zero: a
        client that omits `max_bitrate_bps` is not claiming it can play
        nothing.
      properties:
        containers:
          type: array
          items: { type: string }
        video_codecs:
          type: array
          items: { type: string }
        audio_codecs:
          type: array
          items: { type: string }
        max_width: { type: integer }
        max_height: { type: integer }
        max_bitrate_bps: { type: integer, format: int64 }
        supports_hdr: { type: boolean }

    RegisterDevice:
      type: object
      required: [device_key, name]
      properties:
        device_key: { type: string }
        name: { type: string }
        platform: { type: string }
        profile: { $ref: "#/components/schemas/DeviceProfile" }

    StorageInfo:
      type: object
      properties:
        path: { type: string }
        ok: { type: boolean }

    Readiness:
      type: object
      properties:
        status: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
